<div id="app"></div>
<noscript>Ce site a besoin de JavaScript pour afficher les démos interactives et le jeu.</noscript>
<template id="qk-tpl"><style>
/* Layout: one retro console — HUD strip, pixel screen, objective strip, touch pad — centred on a night-blue desk. Single committed dark look. */
:host{
  --desk:#131a2b;      /* page ground, deep grid blue */
  --ink:#1c2440;       /* frames, dialog border */
  --paper:#f7f0dc;     /* dialog + panels */
  --paper-2:#ece2c4;
  --text:#1c2440;
  --muted:#5b6380;
  --amber:#f2a33a;     /* XP, highlights */
  --teal:#2aa198;      /* electricity */
  --flame:#e2573b;     /* gas */
  --ok:#2f8f4e; --bad:#c43d3d;
  --on-desk:#e8e4d6;
  --f-pix:"Unifont", "Courier New", monospace;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
.qk-app{min-height:100%;background:var(--desk);color:var(--on-desk);font-family:var(--f-body);
  background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:24px 24px;padding-inline:16px;padding-block:12px 24px}
.console{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-family:var(--f-pix);background:var(--ink);border:3px solid #0b1020;border-radius:6px;padding:6px 10px;color:var(--on-desk)}
.hud .who{font-weight:700;font-size:16.5px}
.hud .rank{color:var(--amber);font-size:15.5px}
.hud .lvl{font-size:15.5px}
.xpbar{flex:1;min-width:90px;height:8px;background:#0b1020;border-radius:4px;overflow:hidden;border:1px solid #39426a}
.xpbar i{display:block;height:100%;background:var(--amber);width:0;transition:width .4s}
.hud button{font:inherit;font-size:14.5px;background:#2c365c;color:var(--on-desk);border:2px solid #4a5588;border-radius:4px;padding:3px 8px;cursor:pointer}
.hud button:hover,.hud button:focus-visible{border-color:var(--amber);outline:none}
.badges{display:flex;gap:3px}
.badges span{width:14px;height:14px;border-radius:50%;background:#2c365c;border:1px solid #4a5588;display:inline-block}
.badges span.on{background:var(--amber);border-color:#ffd48a;box-shadow:0 0 6px rgba(242,163,58,.6)}
.screen-wrap{position:relative;border:6px solid #0b1020;border-radius:8px;background:#000;overflow:hidden;box-shadow:0 0 0 3px #2c365c,0 12px 30px rgba(0,0,0,.45)}
canvas#screen{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
.objective{font-family:var(--f-pix);font-size:16.5px;background:#1a223a;border:2px dashed #3a4470;border-radius:6px;padding:6px 10px;color:var(--on-desk)}
.objective b{color:var(--amber);font-weight:600}
.keys{font-size:14px;color:#9aa3c4;text-align:center}
/* dialog */
.dialog{position:absolute;left:2%;right:2%;bottom:3%;background:var(--paper);color:var(--text);border:4px double var(--ink);border-radius:6px;padding:10px 14px 12px;font-family:var(--f-pix);font-size:17.5px;line-height:1.3;height:30%;min-height:78px;max-height:260px;overflow-wrap:break-word;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.dialog .dtx{height:100%;overflow:hidden;padding-right:10px}
.dialog .spk{font-size:14.5px!important;z-index:1;position:absolute;top:-14px;left:12px;background:var(--ink);color:var(--paper);font-size:.8em;padding:1px 8px;border-radius:3px}
.dialog .more{position:absolute;right:10px;bottom:4px;animation:blink 1s steps(2) infinite;color:var(--flame)}
@keyframes blink{50%{opacity:0}}
.toast{position:fixed;z-index:60;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);background:var(--amber);color:var(--ink);font-family:var(--f-pix);font-weight:700;padding:4px 12px;border-radius:4px;border:2px solid var(--ink);white-space:nowrap;font-size:clamp(12px,2.4vw,16px);pointer-events:none;animation:pop 1.7s forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-8px)}10%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
/* touch pad */
.pad{display:none;justify-content:space-between;align-items:center;padding:6px 8px;user-select:none;-webkit-user-select:none;touch-action:none}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:2px}
.dpad button,.ab button{background:#2c365c;border:2px solid #4a5588;color:var(--on-desk);font-family:var(--f-pix);font-size:20px;border-radius:8px;touch-action:none}
.dpad button:active,.ab button:active,.dpad button.held{background:#4a5588}
.ab{display:flex;gap:12px;align-items:center}
.ab button{width:62px;height:62px;border-radius:50%;font-weight:700}
.ab .a{background:var(--flame);border-color:#ff9a80}
.ab .run{width:auto;height:40px;border-radius:20px;font-size:15.5px;padding:0 12px;align-self:flex-end}
.ab .run[aria-pressed=true]{background:var(--amber);color:var(--ink);border-color:#ffd48a}
@media (pointer:coarse),(max-width:680px){.pad{display:flex}.keys{display:none}}
/* overlays */
.overlay{position:fixed;inset:0;background:rgba(8,11,22,.78);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;z-index:20;overflow-y:auto}
.panel{background:var(--paper);color:var(--text);border:4px double var(--ink);border-radius:8px;width:100%;max-width:680px;margin:auto 0;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.panel header{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--ink);color:var(--paper);font-family:var(--f-pix);padding:8px 14px;font-size:18.5px}
.panel header .step{color:var(--amber);font-size:15.5px}
.pbody{padding:16px 18px 18px;font-size:17.5px;line-height:1.5}
.pbody h3{font-family:var(--f-pix);font-size:22px;margin:0 0 8px;text-wrap:balance}
.pbody p{margin:0 0 10px;max-width:65ch}
.pbody .ctx{background:var(--paper-2);border-left:4px solid var(--teal);padding:8px 12px;border-radius:0 4px 4px 0;margin-bottom:12px}
.pbody .ctx.gas{border-left-color:var(--flame)}
.pbody .num{font-variant-numeric:tabular-nums;font-family:var(--f-pix);font-size:1.05em}
.opts{display:grid;gap:8px;margin:10px 0}
.opt{text-align:left;font:inherit;background:#fffaf0;border:2px solid #c9bb92;border-radius:6px;padding:9px 12px;cursor:pointer;color:var(--text)}
.opt:hover:not(:disabled),.opt:focus-visible{border-color:var(--ink);outline:none;background:#fff}
.opt.good{border-color:var(--ok);background:#e3f4e6}
.opt.badc{border-color:var(--bad);background:#f8e1dd;opacity:.8}
.opt .mono{font-family:var(--f-pix);letter-spacing:.06em}
.fb{border-radius:6px;padding:9px 12px;margin:8px 0;font-size:16.5px}
.fb.ok{background:#e3f4e6;border:2px solid var(--ok)}
.fb.ko{background:#f8e1dd;border:2px solid var(--bad)}
.btn{font-family:var(--f-pix);font-size:18.5px;background:var(--ink);color:var(--paper);border:0;border-radius:6px;padding:9px 18px;cursor:pointer;margin-top:6px}
.btn:hover,.btn:focus-visible{background:#2f3a66;outline:2px solid var(--amber)}
.btn.alt{background:#fffaf0;color:var(--ink);border:2px solid var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:grid;gap:4px;margin-bottom:10px}
.field label{font-weight:700;font-size:15.5px}
.field{min-width:0}.field select{width:100%;min-width:0;text-overflow:ellipsis}
.field select,.field input{font:inherit;padding:7px 8px;border:2px solid #c9bb92;border-radius:5px;background:#fffaf0;color:var(--text);max-width:100%}
.chk{display:flex;gap:10px;align-items:flex-start;background:#fffaf0;border:2px solid #c9bb92;border-radius:6px;padding:8px 10px;cursor:pointer}
.chk input{margin-top:4px;width:18px;height:18px;accent-color:var(--ink)}
.chk.good{border-color:var(--ok);background:#e3f4e6}.chk.badc{border-color:var(--bad);background:#f8e1dd}
.chk small{display:block;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.card{background:#fffaf0;border:3px solid #c9bb92;border-radius:8px;padding:10px;cursor:pointer;text-align:left;font:inherit;color:var(--text);display:flex;flex-direction:column;gap:6px}
.card:hover,.card:focus-visible{border-color:var(--ink);outline:none}
.card canvas{width:100%;image-rendering:pixelated;background:#7cc56a;border-radius:4px}
.card b{font-family:var(--f-pix);font-size:18.5px}
.card small{color:var(--muted);font-size:15px;line-height:1.35}
.tag{display:inline-block;font-family:var(--f-pix);font-size:14.5px;padding:1px 6px;border-radius:3px;background:var(--ink);color:var(--paper)}
.seq{display:flex;gap:6px;flex-wrap:wrap;min-height:40px;padding:6px;border:2px dashed #c9bb92;border-radius:6px;margin:8px 0}
.seq .it{background:var(--ink);color:var(--paper);padding:4px 10px;border-radius:4px;font-family:var(--f-pix)}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:16px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border-bottom:1px solid #d6caa6;padding:6px 8px;text-align:left}
.tbl th{font-family:var(--f-pix);font-weight:600}
.sig{width:100%;height:140px;background:#fff;border:2px dashed var(--ink);border-radius:6px;touch-action:none;cursor:crosshair}
.chart{width:100%;height:auto;background:#fffaf0;border:2px solid #c9bb92;border-radius:6px}
input[type=range]{width:100%;accent-color:var(--flame)}
.sticker{display:inline-block;font-family:var(--f-pix);background:#fff;border:2px solid #444;padding:2px 8px;border-radius:3px;margin:3px;color:#222}
.meter-art{display:flex;justify-content:center;margin:6px 0 12px}
.meter-art canvas{width:min(260px,70%);image-rendering:pixelated}
/* battle */
.battle{position:fixed;inset:0;z-index:25;background:rgba(8,11,22,.85);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.arena{width:100%;max-width:680px;background:linear-gradient(#cfe8d0 0 55%,#a9d39a 55%);border:4px double var(--ink);border-radius:8px;overflow:hidden;color:var(--text)}
.field2{position:relative;height:clamp(200px,42vw,280px)}
.hpbox{position:absolute;background:var(--paper);border:3px solid var(--ink);border-radius:6px 6px 14px 6px;padding:6px 10px;font-family:var(--f-pix);min-width:190px;font-size:16.5px}
.hpbox .bar{height:8px;background:#ddd;border:1px solid var(--ink);border-radius:4px;overflow:hidden;margin-top:4px}
.hpbox .bar i{display:block;height:100%;background:var(--ok);transition:width .6s}
.hpbox.enemy{top:12px;left:12px}.hpbox.me{right:12px;bottom:12px}
.mon{position:absolute;right:8%;top:10%;width:clamp(96px,20vw,140px);image-rendering:pixelated}
.hero{position:absolute;left:8%;bottom:4%;width:clamp(96px,20vw,130px);image-rendering:pixelated}
.mon.hit{animation:shake .5s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.mon.ko{transition:opacity .8s,transform .8s;opacity:0;transform:translateY(20px) scale(.6)}
.bmsg{background:var(--paper);border-top:4px double var(--ink);padding:10px 14px;font-family:var(--f-pix);font-size:17.5px;min-height:64px;line-height:1.35}
.bdata{font-family:var(--f-body);font-size:16.5px;background:var(--paper-2);padding:6px 10px;border-radius:4px;margin-top:6px}
.moves{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 12px 12px;background:var(--paper)}
@media (max-width:520px){.moves{grid-template-columns:1fr}}
.moves button{font-family:var(--f-body);font-size:16px;text-align:left;background:#fffaf0;border:2px solid var(--ink);border-radius:6px;padding:8px 10px;cursor:pointer;color:var(--text)}
.moves button:hover,.moves button:focus-visible{background:#fff;outline:2px solid var(--amber)}
.moves button:disabled{opacity:.45;cursor:default}
/* title & evolution */
.title-screen{position:fixed;inset:0;z-index:30;background:var(--desk);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.title-box{max-width:760px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.logo{font-family:var(--f-pix);font-weight:700;font-size:clamp(34px,8vw,58px);line-height:1;color:var(--amber);text-shadow:3px 3px 0 var(--flame),6px 6px 0 #0b1020;letter-spacing:.02em;text-wrap:balance}
.logo small{display:block;font-size:.34em;color:var(--on-desk);text-shadow:none;margin-top:10px;letter-spacing:.12em;text-transform:uppercase}
.title-box p{color:#b7bdd6;max-width:48ch;margin:0}
.title-box input{font-family:var(--f-pix);font-size:20px;padding:8px 10px;border-radius:6px;border:2px solid #4a5588;background:#0f1424;color:var(--on-desk);text-align:center;width:220px}
.title-box .btn{background:var(--amber);color:var(--ink)}
.hud .saved{font-size:13px;color:#8fd19e;opacity:0;white-space:nowrap}
.hud .saved.on{animation:svf 2.4s ease forwards}
@keyframes svf{0%{opacity:0}12%{opacity:1}75%{opacity:1}100%{opacity:0}}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;text-align:left}
@media (max-width:720px){.slots{grid-template-columns:1fr}}
.slot{background:#1a223a;border:2px solid #3a4470;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.slot.cur{border-color:var(--amber)}
.slot-h{display:flex;gap:10px;align-items:center}
.slot-h canvas{width:44px;height:44px;image-rendering:pixelated;background:#7cc56a;border-radius:6px;border:2px solid #0b1020;flex:none}
.slot b{font-family:var(--f-pix);font-size:17.5px;color:var(--on-desk)}
.slot small{display:block;color:#b7bdd6;font-size:14px;line-height:1.35}
.slot .stats{font-family:var(--f-pix);font-size:14px;color:var(--amber)}
.slot .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.slot .hades{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:center;color:var(--on-desk);font-size:15.5px;cursor:pointer}
.slot .hades input{width:18px;height:18px;margin:0;padding:0;accent-color:#c43d3d;grid-row:1/3}
.slot .hades small{grid-column:2}
.slot .acts .btn{font-size:15px;padding:6px 10px;margin:0}
.slot .acts .btn.danger{background:transparent;color:#ff9a8a;border:2px solid #6b2a2a}
.slot input{width:100%;font-size:16.5px;padding:6px 8px}
.save-list{display:grid;gap:8px;margin:10px 0}
.save-list div{background:#fffaf0;border:2px solid #c9bb92;border-radius:6px;padding:8px 10px;font-size:15.5px}
.save-list div.cur{border-color:var(--amber)}
.title-box .btn.alt{background:transparent;color:var(--on-desk);border-color:#4a5588}
.ranks{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-family:var(--f-pix);font-size:14.5px;color:#9aa3c4}
.ranks span{border:1px solid #39426a;border-radius:4px;padding:2px 8px}
.evo{position:fixed;inset:0;z-index:40;background:#0b1020;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:var(--on-desk);font-family:var(--f-pix);text-align:center;padding:16px}
.evo canvas{width:160px;image-rendering:pixelated}
.evo .t{font-size:clamp(18px,4vw,26px);max-width:30ch}
.menu-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.menu-tabs button{font-family:var(--f-pix);font-size:16.5px;background:#fffaf0;border:2px solid #c9bb92;border-radius:5px;padding:4px 10px;cursor:pointer;color:var(--text)}
.menu-tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.dex div{background:#fffaf0;border:2px solid #c9bb92;border-radius:6px;padding:6px;text-align:center;font-size:15px}
.dex canvas{width:64px;image-rendering:pixelated}
.dex .unk{opacity:.45}
/* avatar & étapes */
.av-grid{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:560px){.av-grid{grid-template-columns:1fr}}
.av-prev{display:flex;flex-direction:column;gap:6px;align-items:center;background:#7cc56a;border:3px solid var(--ink);border-radius:8px;padding:10px}
.av-prev canvas{width:100%;max-width:200px;image-rendering:pixelated}
.av-prev small{color:var(--ink);font-size:13px;text-align:center}
.swatches,.pills{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid #fffaf0;box-shadow:0 0 0 2px #c9bb92;cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.sw:focus-visible,.pill:focus-visible{outline:2px solid var(--flame);outline-offset:2px}
.pill{font:inherit;font-size:15.5px;background:#fffaf0;border:2px solid #c9bb92;border-radius:999px;padding:4px 12px;cursor:pointer;color:var(--text)}
.pill.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chap{display:grid;gap:6px;margin:10px 0}
.chap .opt .num{color:var(--muted);margin-right:6px}
.chap .chap-done{background:#eef6ea}
.chap .chap-cur{border-color:var(--amber);background:#fff3dc}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

[hidden]{display:none!important}
button,input,select{font:inherit}
.qk-top{max-width:760px;margin:0 auto 8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.qk-top button{font-family:var(--f-body);font-size:15.5px;background:transparent;color:var(--on-desk);border:2px solid #3a4470;border-radius:999px;padding:5px 12px;cursor:pointer}
.qk-top button:hover,.qk-top button:focus-visible{border-color:var(--amber);outline:none}
.qk-top b{color:var(--amber)}
.qk-top-r{display:flex;gap:8px;flex-wrap:wrap}
#qkFs{border-color:var(--amber);color:var(--amber)}
/* ---- vignette flottante (fenêtre toujours au-dessus) ---- */
.qk-app.pip .pad,.qk-app.pop .pad{display:none!important}
.qk-app.pip #qkBack,.qk-app.pip #qkFs,.qk-app.pop #qkBack,.qk-app.pop #qkFs,.qk-app.pop #qkPip{display:none}
.qk-app.pip .qk-top,.qk-app.pop .qk-top{padding:4px 6px;flex-wrap:nowrap}
.qk-app.pip .qk-top-r,.qk-app.pop .qk-top-r{flex:1;justify-content:space-between;flex-wrap:nowrap;min-width:0}
.qk-app.pip #qkCourse,.qk-app.pop #qkCourse{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qk-app.pip #qkPip{border-color:var(--amber);color:var(--amber);white-space:nowrap}
.qk-app.app.pip .objective,.qk-app.app.pop .objective{display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.qk-app.pip .console,.qk-app.pop .console{padding:0 6px 6px;gap:4px}
.qk-top .sm{display:none}
.hud button{white-space:nowrap}
.qk-app.app .screen-wrap{position:relative}
.qk-app.app .hud{flex-wrap:nowrap;overflow:hidden}
.qk-app.app .hud .xpbar{min-width:40px}
@media (max-width:560px){
  .qk-top .lg{display:none}.qk-top .sm{display:inline}
  .qk-top button{font-size:14px;padding:3px 9px}
  .hud{gap:6px;padding:5px 8px}
  .hud .who{font-size:14.5px}.hud .rank{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}.hud .lvl{font-size:13px;white-space:nowrap}
  .hud .badges{display:none}
  .hud button{font-size:13px;padding:2px 6px}
  .objective{font-size:14.5px}
  .dpad{grid-template-columns:repeat(3,clamp(40px,13vw,52px));grid-template-rows:repeat(3,clamp(40px,13vw,52px))}
  .ab button{width:clamp(50px,15vw,62px);height:clamp(50px,15vw,62px)}
  .ab{gap:8px}
  .pad{padding:4px 2px}
  .panel header{font-size:16.5px;padding:7px 10px}
  .pbody{padding:12px;font-size:16.5px}
  .overlay{padding:8px}
}
@media (max-height:560px){.overlay{padding-top:6px}.pbody{padding:10px 12px}}

/* ---- mode plein écran / immersif ---- */
.qk-app.app{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);overflow:hidden}
.qk-app.app .qk-top{max-width:none;width:100%;margin:0;padding:6px 10px}
.qk-app.app .qk-top button{font-size:14.5px;padding:3px 10px}
.qk-app.app .console{max-width:none;width:100%;flex:1;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:6px;padding:0 10px 8px;position:relative}
.qk-app.app .hud{padding:4px 8px}
.qk-app.app .screen-wrap{min-height:0;display:flex;align-items:center;justify-content:center;border-width:0;border-radius:0;box-shadow:none;background:#000}
.qk-app.app canvas#screen{position:absolute;left:0;top:0}
.qk-app.app .objective{font-size:14.5px;padding:4px 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qk-app.app .keys{display:none}
.qk-app.app .dialog{height:32%}
@media (orientation:landscape) and (pointer:coarse){
  .qk-app.app .console{grid-template-rows:auto minmax(0,1fr) auto}
  .qk-app.app .qk-top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 4px);right:calc(env(safe-area-inset-right,0px) + 8px);width:auto;padding:0;z-index:5}
  .qk-app.app .qk-top .lg{display:none}.qk-app.app .qk-top .sm{display:inline}
  .qk-app.app .qk-top button{font-size:13px;padding:2px 8px;background:rgba(19,26,43,.85)}
  .qk-app.app #qkFs{background:rgba(19,26,43,.85)}
  .qk-app.app .console{padding-top:4px}
  .qk-app.app .hud{padding-right:280px}
  .qk-app.app .hud .rank{display:none}
  .qk-app.app .hud .xpbar,.qk-app.app .hud .badges{display:none}
  .qk-app.app .objective{-webkit-line-clamp:1}
  .qk-app.app .pad{position:absolute;left:10px;right:10px;bottom:36px;pointer-events:none;padding:0}
  .qk-app.app .pad .dpad,.qk-app.app .pad .ab{pointer-events:auto;opacity:.78}
  .qk-app.app .dpad{grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px)}
  .qk-app.app .ab button{width:56px;height:56px}
  .qk-app.app .ab{position:relative}
  .qk-app.app .dialog{left:168px;right:150px;height:40%;min-height:70px}
  .qk-app.app .ab .run{position:absolute;right:0;bottom:64px;width:auto;height:34px}
}

/* ---- écran maximal : bandeaux, objectif et aides sont rangés dans le menu START ---- */
.qk-top,.hud,.objective,.keys{display:none!important}
.qk-app{padding:0}
.qk-app.app .console{grid-template-rows:minmax(0,1fr) auto;padding:0;gap:0}
.qk-app.app .pad{padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px))}
.scr-btns{position:absolute;top:8px;right:8px;z-index:6;display:flex;gap:6px}
.start-btn{font-family:var(--f-pix);font-weight:700;font-size:14.5px;letter-spacing:.1em;background:rgba(19,26,43,.7);color:var(--on-desk);border:2px solid rgba(255,255,255,.35);border-radius:999px;padding:4px 12px;cursor:pointer}
.start-btn:hover,.start-btn:focus-visible{border-color:var(--amber);color:var(--amber);background:rgba(19,26,43,.94);outline:none}
.ab .b{font-size:14.5px;letter-spacing:.04em}
.dpad button{font-family:system-ui,sans-serif}
.obj-flash{position:absolute;top:8px;left:8px;right:300px;z-index:5;max-width:640px;font-family:var(--f-pix);font-size:15.5px;line-height:1.3;background:rgba(19,26,43,.88);color:var(--on-desk);border:2px solid var(--amber);border-radius:6px;padding:5px 10px;pointer-events:none;animation:objf 6s ease forwards}
.obj-flash>div{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

@keyframes objf{0%{opacity:0;transform:translateY(-6px)}6%{opacity:1;transform:none}88%{opacity:1}100%{opacity:0}}

/* Minuteries et animations du jeu : elles passent par la fenêtre qui affiche le jeu (l'onglet, ou la vignette flottante),
   pour continuer à tourner quand l'onglet est en arrière-plan ; elles sont réarmées quand le jeu change de fenêtre. */
const PIP={win:null,fwd:false,pop:null,stale:false,isPop:window.name==='wattlings-vignette'};
const QT={win:window,t:new Map(),r:new Map(),n:0};
function qkTimeout(fn,ms){const id=++QT.n,a=[].slice.call(arguments,2),e={w:QT.win,due:Date.now()+(ms||0)};e.run=()=>{QT.t.delete(id);fn.apply(null,a)};e.h=e.w.setTimeout(e.run,ms||0);QT.t.set(id,e);return id}
function qkClear(id){const e=QT.t.get(id);if(e){try{e.w.clearTimeout(e.h)}catch(_){}QT.t.delete(id)}}
function qkInterval(fn,ms){const tick=()=>{qkTimeout(tick,ms);fn()};return qkTimeout(tick,ms)}
function qkRAF(fn){const id=++QT.n,e={w:QT.win};e.run=()=>{QT.r.delete(id);fn(performance.now())};e.h=e.w.requestAnimationFrame(e.run);QT.r.set(id,e);return id}

function qkSwitch(win){
  QT.t.forEach(e=>{try{e.w.clearTimeout(e.h)}catch(_){}e.w=win;e.h=win.setTimeout(e.run,Math.max(0,e.due-Date.now()))});
  QT.r.forEach(e=>{try{e.w.cancelAnimationFrame(e.h)}catch(_){}e.w=win;e.h=win.requestAnimationFrame(e.run)});
  QT.win=win}

/* ================= SUIVI D'AUDIENCE ANONYME (Supabase) =================
   Aucun cookie, aucune donnée personnelle : un identifiant aléatoire (13 mois) par navigateur.
   Ne fait rien tant que window.WATTLINGS_TRACKING n'est pas renseigné, en navigation « Ne pas me pister »,
   après un clic sur « Ne pas me compter », ou hors d'un site web (fichier local, aperçu claude.ai). */
const TRK=(function(){
  const cfg=window.WATTLINGS_TRACKING||{},LS={vid:'wattlings-vid',opt:'wattlings-ne-pas-compter',last:'wattlings-last'};
  const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}},set=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
  const rnd=n=>{const a=new Uint8Array(n);(crypto||window.msCrypto).getRandomValues(a);return [...a].map(b=>(b%36).toString(36)).join('')};
  const dnt=()=>navigator.doNotTrack==='1'||window.doNotTrack==='1'||navigator.globalPrivacyControl===true;
  const host=location.hostname||'';
  const webOK=/^https?:$/.test(location.protocol)&&!/claude|anthropic|localhost|127\.0\.0\.1/.test(host);
  const optedOut=()=>get(LS.opt)==='1';
  const active=()=>!!(cfg.url&&cfg.key)&&webOK&&!dnt()&&!optedOut();
  function vid(){let v=null;try{v=JSON.parse(get(LS.vid)||'null')}catch(e){}
    if(!v||!v.id||Date.now()-v.t>396*864e5){v={id:rnd(20),t:Date.now()};set(LS.vid,JSON.stringify(v))}return v.id}
  let sid=null,first=false;
  function session(){const now=Date.now(),last=+get(LS.last)||0;let s=null;try{s=sessionStorage.getItem('wattlings-sid')}catch(e){}
    if(!s||now-last>30*6e4){s=rnd(14);first=true;try{sessionStorage.setItem('wattlings-sid',s)}catch(e){}}
    set(LS.last,String(now));sid=s;return s}
  const device=()=>{const w=Math.min(screen.width||innerWidth,innerWidth||9999),coarse=matchMedia('(pointer:coarse)').matches;return coarse?(w>=700?'tablet':'mobile'):(w<700?'mobile':'desktop')};
  const page=()=>{const h=decodeURIComponent(location.hash.slice(1));return(h&&!/^g-/.test(h)?h:'accueil').slice(0,80)};
  let q=[],timer=null;
  function send(opts){if(!q.length||!active())return;const rows=q.splice(0,50);
    try{fetch(cfg.url.replace(/\/$/,'')+'/rest/v1/events',{method:'POST',keepalive:!!(opts&&opts.beacon),
      headers:{'apikey':cfg.key,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(rows)}).catch(()=>{})}catch(e){}}
  function track(name,props){
    if(!active())return;
    const s=session(),row={vid:vid(),sid:s,name,page:page(),device:device(),lang:(navigator.language||'').slice(0,12),props:Object.assign({},props||{})};
    if(first){first=false;row.props.first=true;try{const r=document.referrer&&new URL(document.referrer).hostname;row.ref=(r&&r!==host?r:'').slice(0,120)}catch(e){row.ref=''}}
    for(const k in row.props){const v=row.props[k];if(typeof v==='string')row.props[k]=v.slice(0,120)}

  addEventListener('pagehide',()=>{readFlush();send({beacon:true})});
  /* ---- lien secret : https://…/#ne-pas-compter exclut définitivement ce navigateur ---- */
  function optCheck(){if(location.hash==='#ne-pas-compter'){set(LS.opt,'1');history.replaceState(null,'',location.pathname+location.search+'#accueil');dispatchEvent(new HashChangeEvent('hashchange'));notice('Ce navigateur n’est plus compté dans les statistiques.')}}
  function notice(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:2000;background:#0a1a33;color:#fff;padding:10px 16px;border-radius:10px;font:15px system-ui;box-shadow:0 6px 20px rgba(0,0,0,.3)';document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}
  /* ---- temps de lecture par page (temps visible uniquement) ---- */
  let rp=page(),rt=0,rs=document.visibilityState==='visible'?Date.now():0;
  function readFlush(){if(rs){rt+=Date.now()-rs;rs=document.visibilityState==='visible'?Date.now():0}const s=Math.round(rt/1000);if(s>=3&&rp!=='jeu')track('read_time',{p:rp,s});rt=0}
  addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')rs=Date.now();else if(rs){rt+=Date.now()-rs;rs=0}});
  /* ---- cours : pages, onglets, démos, quiz, glossaire ---- */
  let demoSeen=new Set();
  function route(){optCheck();readFlush();rp=page();rs=document.visibilityState==='visible'?Date.now():0;demoSeen=new Set();if(!/^jeu/.test(rp))track('pageview')}
  addEventListener('hashchange',route);
  document.addEventListener('click',e=>{
    const t=e.target.closest?e.target:null;if(!t)return;
    const tab=t.closest('[data-niv]');if(tab){track('course_tab',{niv:tab.dataset.niv});return}

  },true);
  const demoUse=e=>{const d=e.target.closest&&e.target.closest('section.demo');if(!d||d.classList.contains('quiz-bloc'))return;const h=(d.querySelector('h2')||{}).textContent||'démo';if(demoSeen.has(h))return;demoSeen.add(h);track('demo_use',{demo:h.trim().slice(0,90)})};
  document.addEventListener('click',demoUse,true);document.addEventListener('input',demoUse,true);
  /* ---- mention de confidentialité et interrupteur, en bas de chaque page du cours ---- */
  function privacy(){if(!cfg.url||!webOK)return;const c=document.getElementById('contenu');if(!c||c.querySelector('.qk-privacy'))return;
    const p=document.createElement('p');p.className='qk-privacy';
    const render=()=>{p.innerHTML=optedOut()?'Mesure d’audience : ce navigateur n’est pas compté. <button type="button">Me compter à nouveau</button>':dnt()?'Mesure d’audience : désactivée par le réglage « Ne pas me pister » de ton navigateur.':'Mesure d’audience anonyme, sans cookie ni donnée personnelle, conservée 13 mois, réservée à l’auteur du site. <button type="button">Ne pas me compter</button>';
      const b=p.querySelector('button');if(b)b.onclick=()=>{if(optedOut()){try{localStorage.removeItem(LS.opt)}catch(e){}}else{set(LS.opt,'1');q=[]}render()}};
    render();c.appendChild(p)}
  new MutationObserver(()=>privacy()).observe(document.documentElement,{childList:true,subtree:true});
  optCheck();setTimeout(route,300);
  return{track,active};
})();

  mat:{map:'town',x:42,y:9,kind:'mast',who:null,where:'le tableau de la station météo',idle:["Station météo d’Ampère-sur-Loire. Température : de saison. Moral des chaudières : bon."]},
  veilleur:{map:'town',x:20,y:12,kind:'npc',who:'Veilleur de nuit',pal:{shirt:'#2c2c34',pants:'#2c2c34',hair:'#5a3a22',hat:'#1c2440'},dir:'down',when:()=>S.ch===7,where:'le veilleur de nuit, sur la grande rue (la nuit)',idle:["La nuit, la ville dort. Les veilles, elles, ne dorment jamais."]},
  plombier:{map:'town',x:21,y:27,kind:'npc',who:'Plombier',pal:{shirt:'#2f6db5',pants:'#2f6db5',hair:'#2b1d14',hat:'#c43d3d'},dir:'left',where:'le plombier, près de la maison Dupuis (sud)',idle:["Plombier. Je répare les fuites. Les vôtres sont en kWh ? Pas mon rayon, mais je compatis."]},
  artisan:{map:'town',x:12,y:26,kind:'npc',who:'Artisan',pal:{shirt:'#8a5a2b',pants:'#2f3a5c',hair:'#2b1d14',hat:'#e2a13a'},dir:'down',where:'l’artisan, près du parc solaire (sud-ouest)',idle:["Isolation, fenêtres, chaudières… Mais je vous préviens : isoler un bâtiment chauffé le week-end, c’est chauffer le vide avec style."]},
  installateur:{map:'town',x:8,y:28,kind:'npc',who:'Installatrice solaire',pal:{shirt:'#f2c12e',pants:'#2f3a5c',hair:'#8a5a2b'},dir:'up',where:'l’installatrice, au parc solaire (sud-ouest)',idle:["Mes panneaux produisent surtout l’été. Les écoles, elles, sont surtout fermées l’été. On y travaille."]},
  mmeDupuis:{ins:'maison',x:4,y:3,kind:'npc',who:'Mme Dupuis',pal:{shirt:'#e57399',pants:'#2f3a5c',hair:'#2b1d14',style:'long'},dir:'down',where:'Mme Dupuis, dans sa maison (sud)',idle:["Mon mari croit que le thermostat est un objet décoratif."]},
  mDupuis:{ins:'maison',x:7,y:4,kind:'npc',who:'M. Dupuis',pal:{shirt:'#2f9e7a',pants:'#6b4a2b',hair:'#9a9aa2'},dir:'left',where:'M. Dupuis, dans sa maison (sud)',idle:["J’ai acheté un thermostat connecté. Il me connecte surtout à ma banque."]},
  pharma:{ins:'pharma',x:5,y:3,kind:'npc',who:'Pharmacienne',pal:{shirt:'#f7f0dc',pants:'#2f6d34',hair:'#d9a441'},dir:'down',where:'la pharmacienne (quartier est)',idle:["Pour les maux de tête dus aux factures d’énergie, j’ai du paracétamol. Pour la facture, rien."]},
  balance:{ins:'pharma',x:8,y:3,kind:'balance',who:'Balance',where:'la balance de la pharmacie',idle:["Une balance. Elle affiche « Pesez-vous toujours dans les mêmes conditions ». Elle sait des choses."]},
  maire:{map:'mairie',existing:1,who:'Maire',where:'le maire, à l’hôtel de ville'},
  posterMairie:{map:'mairie',x:5,y:1,kind:'poster',who:null,where:'l’affiche du Pareto, à l’hôtel de ville',idle:["Affiche : « 20 % des sites, 80 % des problèmes. 100 % des réunions. »"]},
  marchand:{map:'town',x:41,y:24,kind:'npc',who:'Marchand',pal:{shirt:'#2f6d34',pants:'#6b4a2b',hair:'#b8431f',hat:'#f7f0dc'},dir:'down',where:'le marchand du marché, quartier est',idle:["Tomates, courgettes, et des conseils gratuits. Les conseils sont hors saison."]},
  joule:{map:'office',existing:1,who:'Mme Joule',where:'Mme Joule, dans ton bureau'}

/* Fiches : st = étape du cours, k = phrase / retenir / analogie, req = indispensable pour débloquer le mini-jeu de l'étape. */
const FICHES=[
  {id:'c0',st:0,src:'cycle',t:'Le cycle en 8 étapes',x:"Les étapes 1 à 4 (Data) produisent une donnée fiable. Les étapes 5 à 8 (Énergie) s’en servent pour consommer moins. Et la boucle recommence.",say:["L’affiche montre un cercle : Cadrer, Collecter, Fiabiliser, Structurer, puis Analyser, Détecter, Agir, Mesurer."]},
  {id:'s1p',st:1,k:'phrase',req:1,src:'geometre',t:'Cadrer, c’est décider',x:"Avant de mesurer quoi que ce soit, on décide quoi suivre, où, et dans quel but.",say:["Moi, avant de mesurer un terrain, je demande pourquoi on le mesure. Sinon je mesure des cailloux pour rien.","Pour ton bâtiment, c’est pareil."]},
  {id:'s1r1',st:1,k:'retenir',req:1,src:'planquartier',t:'Le périmètre',x:"On délimite un périmètre : un site, un bâtiment, parfois un usage (chauffage, éclairage…).",say:["Sur le plan, des pointillés entourent chaque site. En légende : « Un périmètre, c’est ce qu’on suit. Le reste, on l’ignore poliment. »"]},
  {id:'s1r2',st:1,k:'retenir',req:2,src:'agentEnedis',t:'Point de comptage, PDL et PCE',x:"Chaque énergie arrive par un point de comptage qui a un identifiant unique : le PDL (ou PRM) pour l’électricité, le PCE pour le gaz.",say:["Un compteur, ça se change. Le point où l’énergie entre dans le bâtiment, lui, reste : c’est le point de comptage.","Chez nous il s’appelle PDL, ou PRM : 14 chiffres. Chez GRDF, c’est le PCE."]},
  {id:'s1r3',st:1,k:'retenir',src:'officeObj',t:'L’objectif',x:"On fixe un objectif : baisser la facture, respecter le décret tertiaire, réduire le CO₂…",say:["L’affiche liste trois objectifs possibles, et une question en gros : « Lequel est le nôtre ? »"]},
  {id:'s1a',st:1,k:'analogie',src:'drOhm',t:'Analogie : le bilan de santé',x:"Avant les examens, le médecin décide qui il examine, quels examens il prescrit et ce qu’il cherche. Sans ça, on accumule des résultats sans savoir quoi en faire.",say:["Si je prescris tous les examens à tout le monde, j’ai des classeurs pleins et aucun diagnostic.","Un bon bilan commence par une question."]},
  {id:'s2p',st:2,k:'phrase',req:3,src:'conseillere',t:'Trois canaux de données',x:"La donnée d’énergie arrive par trois canaux : le télérelevé, les index et les factures. Même énergie, trois formes différentes.",say:["On me demande souvent « la » donnée. Il n’y a pas « la » donnée : il y en a trois sortes."]},
  {id:'s2r1',st:2,k:'retenir',req:3,src:'techGRDF',t:'Le télérelevé',x:"Le télérelevé est fin et rapide : une courbe de charge au pas de 10 min pour l’électricité, un volume par jour pour le gaz (Gazpar).",say:["Avant de t’expliquer, une question de technicienne."],quiz:{q:'Combien de relevés par jour le compteur Gazpar transmet-il ?',opts:[['Un : la consommation de la veille',1,'Chaque matin, la consommation du jour précédent.'],['144, comme l’électricité',0,'Ça, c’est la courbe électrique au pas de 10 min.'],['Un par mois',0,'Gazpar est plus bavard que ça.']]}},
  {id:'s2r2',st:2,k:'retenir',src:'retraite',t:'L’index',x:"L’index est le compteur qui tourne : on soustrait deux relevés pour obtenir une consommation.",say:["De mon temps, on lisait l’index sur le compteur, et on soustrayait deux relevés. Ça marche toujours, tu sais.","Il faut juste savoir lire. Et soustraire dans le bon sens."]},
  {id:'s2r3',st:2,k:'retenir',req:3,src:'conseiller',t:'La facture',x:"La facture donne le coût en euros, avec du retard et sur des périodes qui ne suivent pas les mois.",say:["Nos factures disent exactement ce que vous avez payé. Avec un peu de retard. Du 14 au 13 du mois suivant, parce que la vie n’est pas un calendrier."]},
  {id:'s2a',st:2,k:'analogie',src:'dab',t:'Analogie : suivre son budget',x:"L’appli bancaire montre chaque dépense en temps réel (télérelevé). Le relevé de fin de mois donne le solde (index). La facture du magasin dit ce que tu as payé et pourquoi (facture).",say:["Le distributeur imprime un ticket : « Temps réel, relevé mensuel, facture : trois vues du même argent. »"]},
  {id:'s3p',st:3,k:'phrase',req:4,src:'tech',t:'Vérifier avant d’analyser',x:"Avant d’analyser, on vérifie que la donnée est juste : complète, sans doublon, plausible et cohérente entre sources.",say:["Ici, rien n’entre dans les analyses sans contrôle. Complète, sans doublon, plausible, cohérente : c’est la devise du parc."]},
  {id:'s3r1',st:3,k:'retenir',req:4,src:'panneauParc',t:'Complétude',x:"Une journée au pas de 10 min doit avoir 144 points, sauf les jours de changement d’heure (138 ou 150 en heure locale).",say:["Le panneau affiche un compteur : « Aujourd’hui : 144 points sur 144. Record battu depuis hier. »"]},
  {id:'s3r2',st:3,k:'retenir',src:'electricien',t:'Plausibilité',x:"Un pic à 999,9 kW dans une école de 60 kVA, c’est un bug de mesure, pas une vraie consommation.",say:["Une fois, un compteur m’a annoncé 999,9 kW dans une école de 60 kVA.","Soit l’école avait construit un accélérateur de particules, soit c’était un bug. C’était un bug."]},
  {id:'s3r3',st:3,k:'retenir',src:'lecteur',t:'Jamais en silence',x:"On ne corrige jamais en silence : chaque valeur garde un statut (brute, corrigée, estimée).",say:["J’archive tout. Surtout les erreurs. Une correction qu’on ne peut pas expliquer, c’est une rumeur."]},
  {id:'s3a',st:3,k:'analogie',src:'drOhm',t:'Analogie : le thermomètre',x:"Si le thermomètre affiche 45 °C, on ne conclut pas à une fièvre mortelle : on vérifie d’abord le thermomètre. Une mauvaise mesure mène à un mauvais diagnostic.",say:["Un patient à 45 °C ? Je vérifie d’abord le thermomètre. Toujours. Ça m’a évité beaucoup de paperasse."]},
  {id:'s4p',st:4,k:'phrase',req:5,src:'biblio',t:'Un modèle commun',x:"On range les données dans un modèle commun, à la même unité et au bon pas de temps, pour pouvoir les comparer et les additionner.",say:["Tu ne peux pas additionner des pommes et des m³. Enfin si, mais tu obtiens une salade."]},
  {id:'s4r1',st:4,k:'retenir',req:5,src:'borne',t:'Site, compteurs, mesures',x:"Un modèle simple : un site contient des compteurs, qui produisent des mesures.",say:["La borne demande de vérifier ton inscription."],quiz:{q:'Complète le modèle : un site contient des…, qui produisent des mesures.',opts:[['Compteurs',1,'Site → compteurs → mesures.'],['Factures',0,'Les factures sont une autre source, pas un maillon du modèle.'],['Usages',0,'Un usage n’est mesuré que s’il a un sous-compteur.']]}},
  {id:'s4r2',st:4,k:'retenir',src:'horloge',t:'Changer de pas de temps',x:"Changer de pas de temps (agrégation) lisse la courbe mais ne change pas l’énergie totale.",say:["Sous l’horloge, une plaque : « Que tu comptes en minutes ou en jours, la journée dure pareil. »"]},
  {id:'s4r3',st:4,k:'retenir',src:'convGRDF',t:'Des m³ aux kWh',x:"Pour comparer le gaz et l’électricité, on convertit les m³ en kWh avec le coefficient de conversion.",say:["L’affiche montre une flèche : m³ × coefficient = kWh."]},
  {id:'s4a',st:4,k:'analogie',src:'biblio',t:'Analogie : la bibliothèque',x:"Les mêmes livres peuvent être classés par auteur, par thème ou par année. Le classement ne change pas les livres, mais il change ce que tu trouves facilement.",say:["Tu vois ces livres ? Je les ai classés par auteur. Hier, ils étaient par couleur. Ce sont les mêmes livres. Mais essaie de trouver Zola par couleur."]},
  {id:'s5p',st:5,k:'phrase',req:6,src:'ecg',t:'Lire la consommation',x:"On lit la consommation pour comprendre quand le bâtiment consomme, combien il consomme à vide, et comment il réagit au froid.",say:["Sous le tracé, une légende : « Quand ? Combien au repos ? Comment réagit-il à l’effort ? » Quelqu’un a ajouté : « et au froid ? »"]},
  {id:'s5r1',st:5,k:'retenir',src:'gardien',t:'Le talon',x:"Le talon, c’est ce que le bâtiment consomme quand il est vide. Chez l’école, il pèse lourd dans le total.",say:["Le soir, quand tout le monde est parti, j’entends encore les serveurs ronronner. C’est ça, le talon : ce qui tourne quand il n’y a personne."]},
  {id:'s5r2',st:5,k:'retenir',src:'mmeDupuis',t:'Des profils différents',x:"Une journée de classe et une journée de vacances n’ont pas du tout le même profil.",say:["Mes enfants à l’école, la maison est calme. En vacances, c’est le chaos, et le compteur aussi. Pour l’école, c’est l’inverse."]},
  {id:'s5r3',st:5,k:'retenir',req:6,src:'meteo',t:'Le chauffage suit la météo',x:"Le chauffage suit la météo : on la mesure avec les DJU (degrés-jours unifiés).",say:["Un DJU, c’est 18 °C moins la température moyenne du jour. Plus il fait froid, plus il y en a."],quiz:{q:'Un jour à 8 °C de moyenne compte combien de DJU ?',opts:[['10',1,'18 − 8 = 10 DJU.'],['8',0,'On part de 18 °C.'],['26',0,'On soustrait, on n’additionne pas.']]}},
  {id:'s5a',st:5,k:'analogie',src:'drOhm',t:'Analogie : l’électrocardiogramme',x:"Le cardiologue regarde le rythme au repos, les pics à l’effort et ce qui sort de l’ordinaire. Une courbe de charge se lit de la même façon.",say:["Un électrocardiogramme et une courbe de charge, c’est la même lecture : le repos, l’effort, et le truc bizarre à 3 h du matin."]},
  {id:'s6p',st:6,k:'phrase',req:7,src:'veilleur',t:'Comparer au normal',x:"On compare la consommation réelle à ce qu’elle devrait être, pour repérer gaspillages et dérives et estimer leur coût.",say:["Je fais ma ronde tous les soirs. Je ne cherche pas ce qui est allumé : je cherche ce qui ne devrait pas l’être."]},
  {id:'s6r1',st:6,k:'retenir',src:'rayonStat',t:'La référence',x:"Sans baseline (référence), pas de détection : il faut savoir ce qui est « normal ».",say:["Un livre s’ouvre à une page cornée : « Pour trouver l’anormal, définis d’abord le normal. »"]},
  {id:'s6r2',st:6,k:'retenir',src:'depassement',t:'Les dérives classiques',x:"Les dérives classiques : talon qui monte, chauffage le week-end ou l’été, dépassement de puissance.",say:["L’affiche liste trois suspects habituels, avec leur photo d’identité."]},
  {id:'s6r3',st:6,k:'retenir',src:'tech',t:'Détecter sur du propre',x:"Une alerte sur une donnée fausse fait perdre du temps : la détection dépend de l’étape Fiabiliser.",say:["Tu te souviens de Picatron ? Si on ne l’avait pas corrigé, ton alerte de cette nuit sonnerait pour rien."]},
  {id:'s6a',st:6,k:'analogie',req:7,src:'plombier',t:'Analogie : le robinet qui goutte',x:"Une nuit où personne ne tire d’eau, le compteur d’eau devrait être immobile. S’il tourne, il y a une fuite. Un bâtiment vide qui consomme plus que d’habitude, c’est pareil.",say:["Regarde ce compteur d’eau. Il est 2 h du matin, personne ne tire d’eau, et il tourne.","Conclusion : il y a une fuite. Ton bâtiment vide qui consomme, c’est exactement pareil."]},
  {id:'s7p',st:7,k:'phrase',req:8,src:'artisan',t:'Du moins cher au plus lourd',x:"On passe à l’action, du moins cher au plus lourd : régler, optimiser le contrat, puis investir.",say:["Je pourrais te vendre des travaux tout de suite. Mais un bon artisan te dit d’abord de régler ce qui ne coûte rien."]},
  {id:'s7r1',st:7,k:'retenir',req:8,src:'mmeDupuis',t:'La sobriété d’abord',x:"Sobriété d’abord : régler les horaires, baisser la consigne, éteindre. Coût quasi nul.",say:["Chez nous, on a fait des économies avant même d’acheter quoi que ce soit."],quiz:{q:'Selon toi, qu’a fait Mme Dupuis en premier ?',opts:[['Baisser le thermostat et éteindre ce qui ne sert pas',1,'Gratuit, immédiat. La sobriété d’abord.'],['Changer la chaudière',0,'Ça, c’est pour plus tard, et c’est cher.'],['Poser des panneaux solaires',0,'La production vient en dernier.']]}},
  {id:'s7r2',st:7,k:'retenir',src:'conseiller',t:'Puis le contrat',x:"Puis le contrat : puissance souscrite ajustée, bonne option tarifaire.",say:["Entre nous : beaucoup de clients paient une puissance qu’ils n’utilisent jamais. Je ne devrais pas le dire. Je le dis quand même."]},
  {id:'s7r3',st:7,k:'retenir',src:'installateur',t:'Enfin l’efficacité et la production',x:"Enfin l’efficacité et la production : travaux, équipements, panneaux solaires. Coûteux, rentable sur plusieurs années.",say:["Mes panneaux, c’est rentable. Sur plusieurs années. Si on a d’abord réduit la consommation, sinon on produit pour le gaspillage."]},
  {id:'s7a',st:7,k:'analogie',src:'mDupuis',t:'Analogie : le budget du foyer',x:"D’abord on éteint les lumières et on baisse le chauffage. Ensuite on renégocie ses abonnements. Enfin, si ça vaut le coup, on isole la maison.",say:["Ma femme a éteint, puis j’ai renégocié les abonnements, puis on a isolé les combles. Dans cet ordre-là. Elle insiste sur « dans cet ordre-là »."]},
  {id:'s8p',st:8,k:'phrase',req:9,src:'pharma',t:'Vérifier que ça a marché',x:"On vérifie que l’action a vraiment marché, à conditions comparables, puis on repart au début de la boucle.",say:["Un traitement, on vérifie qu’il marche. Dans les mêmes conditions. Sinon on attribue au médicament ce qui revient à la météo."]},
  {id:'s8r1',st:8,k:'retenir',src:'meteo',t:'L’effet de l’hiver doux',x:"Un hiver doux fait baisser la consommation de gaz… sans que personne n’ait rien fait.",say:["Cet hiver était doux. Tout le monde a baissé sa consommation de gaz. Personne n’a rien fait. Tout le monde s’en est félicité."]},
  {id:'s8r2',st:8,k:'retenir',req:9,src:'mat',t:'Corriger avec les DJU',x:"On corrige la comparaison avec les DJU : c’est le principe de la mesure et vérification (M&V).",say:["Le tableau de la station affiche l’hiver dernier : 1 900 DJU, contre 2 244 d’habitude."],quiz:{q:'Le chauffage a baissé de 15 % et l’hiver a été 15 % plus doux. Que conclure ?',opts:[['Rien sans corriger du climat : l’effet réel est proche de 0',1,'On ramène les deux années aux mêmes DJU avant de comparer.'],['L’action a fait −15 %',0,'La météo explique toute la baisse.'],['La consommation a augmenté',0,'Rien ne le montre.']]}},
  {id:'s8r3',st:8,k:'retenir',src:'rayonRegl',t:'La boucle continue',x:"Le résultat alimente le prochain tour de boucle (logique ISO 50001) et les déclarations OPERAT.",say:["Deux livres côte à côte : « ISO 50001 : Planifier, Faire, Vérifier, Agir » et « OPERAT : déclarer chaque année avant le 30 septembre »."]},
  {id:'s8a',st:8,k:'analogie',src:'balance',t:'Analogie : se peser en manteau',x:"Tu te pèses en manteau en janvier et en t-shirt en juillet : tu as « perdu » 3 kg. Pour savoir si le régime a marché, il faut se peser dans les mêmes conditions.",say:["Tu montes sur la balance avec ton manteau. Elle affiche +3 kg et un message : « Retirez votre manteau, ou votre conclusion. »"]},
  {id:'pP',st:'P',k:'phrase',req:10,src:'maire',t:'Classer, comparer, prioriser',x:"À l’échelle d’un patrimoine, on ne lit plus une courbe : on classe, on compare et on priorise, pour mettre l’effort là où il rapporte le plus.",say:["Vingt bâtiments ! Je ne peux pas regarder vingt courbes. Il me faut un classement, des comparaisons, et une liste de priorités."]},
  {id:'pR1',st:'P',k:'retenir',src:'posterMairie',t:'Le Pareto',x:"Le Pareto classe les sites du plus gros au plus petit et cumule leur part. Une minorité de sites fait souvent l’essentiel : la « règle des 80/20 » est un ordre de grandeur.",say:["L’affiche montre des barres rangées de la plus grande à la plus petite, et une courbe qui monte jusqu’à 100 %."]},
  {id:'pR2',st:'P',k:'retenir',src:'conseiller',t:'Le bon indicateur',x:"Le classement dépend de l’indicateur : en euros l’électricité pèse plus (≈ 186 contre ≈ 89 €/MWh), en CO₂ c’est le gaz (≈ 0,204 contre ≈ 0,052 tCO₂e/MWh).",say:["Vous voulez classer vos sites ? En euros ou en CO₂ ? Parce que ce n’est pas le même classement. Et ça, c’est moi qui le dis, alors que je vends de l’électricité."]},
  {id:'pR3',st:'P',k:'retenir',src:'lecteur',t:'Gros ne veut pas dire inefficace',x:"On rapporte la consommation à la surface (kWh/m²) et on compare à des bâtiments de même activité : médiane du patrimoine et référence nationale.",say:["La plus grosse encyclopédie de la médiathèque n’est pas la plus bavarde : elle a juste beaucoup de pages. Pour tes bâtiments, divise par la surface."]},
  {id:'pR4',st:'P',k:'retenir',src:'joule',t:'Le gisement',x:"Le gisement = (ratio − référence) × surface. C’est lui qui dit où se jouent les MWh.",say:["Un dernier conseil avant l’hôtel de ville : un petit écart sur un énorme bâtiment pèse plus qu’un gros écart sur une petite crèche. Calcule le gisement."]},
  {id:'pA',st:'P',k:'analogie',req:10,src:'marchand',t:'Analogie : le ticket de caisse',x:"Quelques articles font l’essentiel du ticket : c’est là qu’on regarde d’abord. Mais pour savoir si on paie trop, on compare le prix au kilo, pas le prix total.",say:["Regarde ton ticket : trois articles font presque tout le total. Mais pour savoir si mes tomates sont chères, compare le prix au kilo !"]}
];
const FBY={};FICHES.forEach(f=>FBY[f.id]=f);
const fAvail=f=>S.ch>=STEP_CH[f.st];
const fGot=id=>!!(S.fiches&&S.fiches[id]);
function missingReq(ch){ch=ch===undefined?S.ch:ch;return FICHES.filter(f=>f.req===ch&&!fGot(f.id))}
function missingLines(ch){const m=missingReq(ch);return [{t:`Il te manque ${m.length} info${m.length>1?'s':''} clé${m.length>1?'s':''} pour continuer. Cherche : ${m.map(f=>SRC[f.src].where).join(' ; ')}.`},{t:'Les flèches orange t’indiquent où aller. Ton objectif et tes fiches sont dans le menu (touche M).'}]}
function srcTry(sid){
  const f=FICHES.find(f=>f.src===sid&&fAvail(f)&&!fGot(f.id));if(!f)return false;
  const s=SRC[sid],lines=f.say.map(t=>s.who?{w:s.who,t}:{t});
  const give=()=>showFiche(f);
  if(f.quiz)say(lines,()=>runSteps(s.who||'Question',[choice({q:f.quiz.q,opts:f.quiz.opts})],give));else say(lines,give);
  return true;
}
function srcAct(sid,fallback){return()=>{if(srcTry(sid))return;const s=SRC[sid];
  const future=FICHES.find(f=>f.src===sid&&!fAvail(f));
  if(fallback)return fallback();
  if(s.egg&&s.egg())return;
  const idle=(s.idle||['…']).map(t=>s.who?{w:s.who,t}:{t});
  if(future&&s.who)idle.push({w:s.who,t:'Repasse me voir plus tard, j’aurai sûrement quelque chose pour toi.'});
  say(idle)}}
function showFiche(f){
  trk('fiche',{id:f.id,cle:!!f.req});

function savoirTargets(){
  const m=missingReq();if(!m.length)return null;const T=[];
  m.forEach(f=>{const s=SRC[f.src];let pos=null;
    if(f.src==='tech')pos={map:'town',x:8,y:15};else if(f.src==='agentEnedis')pos={map:'town',x:21,y:14};else if(f.src==='maire')pos={map:'mairie',x:10,y:4};else if(f.src==='joule')pos={map:'office',x:8,y:4};
    else if(s.ins){const b=BLD.find(b=>b.id===s.ins);if(S.map==='town')T.push(b.door);else if(S.map==='local'&&S.inside===s.ins)T.push([s.x,s.y]);return}
    else pos={map:s.map,x:s.x,y:s.y};
    if(pos.map===S.map)T.push([pos.x,pos.y]);
    else if(S.map!=='town'&&pos.map==='town')T.push(S.map==='local'?[5,7]:S.map==='office'?[5,8]:S.map==='mairie'?[6,9]:S.map==='cave'?[1,2]:[7,10]);

    else if(S.map==='town'&&pos.map==='office')T.push(BLD[0].door);
  });

  return T;
}

    case '=':R(c,X,Y,16,16,'#e3cf98');if(h>.3)R(c,X+(h*13|0),Y+(h*97%13|0),2,1,'#cdb57a');if(h>.7)R(c,X+4,Y+10,1,1,'#cdb57a');break;

function targets(){
  const ST=savoirTargets();if(ST)return ST;
  const s=S.site,m=S.map,T=[],b=BLD.find(x=>x.id===s),off=BLD[0];
  const toOffice=()=>{if(m==='town')T.push(off.door);else if(m!=='office')T.push(m==='cave'?[1,2]:[7,10])};
  const toSite=()=>{if(m==='town'&&b)T.push(b.door);else if(m==='office')T.push([5,8])};
  switch(S.ch){
    case 0:if(m==='office')T.push([8,4]);else toOffice();break;
    case 1:if(m==='town'){if(!S.notes.adresse)T.push([b.door[0]+2,b.door[1]+1]);if(!S.notes.surface)T.push([b.door[0]-2,b.door[1]+1])}else if(m==='office')T.push([5,8]);else T.push(m==='cave'?[1,2]:[7,10]);break;
    case 2:toSite();if(m==='rdc'){if(!S.flags.elec)T.push([11,1]);if(!S.flags.gas)T.push([14,2])}if(m==='cave'&&!S.flags.gas)T.push([8,1]);if(m==='cave'&&S.flags.gas)T.push([1,2]);break;
    case 3:case 6:case 8:case 9:toOffice();if(m==='office')T.push([2,2]);break;
    case 4:if(m==='town')T.push([8,15]);else toOffice();break;
    case 5:toOffice();if(m==='office')T.push([10,2]);break;
    case 7:toSite();if(m==='rdc'&&(!S.derives.boiler||!S.derives.cave))T.push([14,2]);if(m==='cave'&&!S.derives.boiler)T.push([4,3]);break;
    case 10:if(m==='town')T.push([28,28]);else if(m==='mairie')T.push(S.pm>=6?[10,4]:[2,2]);else if(m==='office')T.push([5,8]);else T.push(m==='cave'?[1,2]:[7,10]);break;
  }
  return T;
}

let tick=0,busy=false; // busy = dialogue/modal/combat
function blocked(){return busy||dlg.open}
function tileAt(x,y){const g=MAPS[S.map].g;return g[y]&&g[y][x]}
function objAt(x,y){return objsFor(S.map).find(o=>o.x===x&&o.y===y)}
function isSolid(x,y){const t=tileAt(x,y);if(t===undefined||SOLID.has(t))return true;const o=objAt(x,y);return !!(o&&o.solid)}
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
function tryMove(d){
  P.dir=d;const [dx,dy]=DIRS[d],nx=P.x+dx,ny=P.y+dy,t=tileAt(nx,ny);
  if(BOX.on&&(t==='D'||t==='E'||t==='S'||t==='U')){const n=performance.now();if(n-(tryMove.c||0)>2500){toast('Le carton ne passe pas la porte.');tryMove.c=n}return}
  if(t==='D'){enterDoor(nx,ny);return}
  if(t==='E'){exitBuilding();return}
  if(t==='S'){warp('cave',2,2,'down');return}
  if(t==='U'){warp('rdc',13,2,'left');return}

function audInit(){
  if(!AUD.on)return;
  if(AUD.ctx){if(AUD.ctx.state==='suspended')AUD.ctx.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{
    const c=AUD.ctx=new AC();AUD.master=c.createGain();AUD.master.gain.value=AUD.on?.5:0;AUD.master.connect(c.destination);
    [['p50',.5],['p25',.25],['p12',.125]].forEach(([k,d])=>{const n=40,re=new Float32Array(n),im=new Float32Array(n);for(let i=1;i<n;i++)re[i]=(2/(i*Math.PI))*Math.sin(i*Math.PI*d);AUD.waves[k]=c.createPeriodicWave(re,im)});
    const b=c.createBuffer(1,c.sampleRate,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AUD.noise=b;
    qkInterval(schedule,25);
    if(AUD.want){const w=AUD.want;AUD.want=null;playTrack(w)}
  }catch(e){AUD.ctx=null}
}
function tone(w,f,t,dur,vol,slide){
  const c=AUD.ctx;if(!c||!f)return;const o=c.createOscillator(),g=c.createGain();
  if(w==='tri')o.type='triangle';else o.setPeriodicWave(AUD.waves[w]);
  o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.006);g.gain.setTargetAtTime(vol*.65,t+.02,.09);g.gain.setTargetAtTime(0,t+Math.max(.02,dur*.88),.025);
  o.connect(g).connect(AUD.master);o.start(t);o.stop(t+dur+.15);
}
function drum(k,t){
  const c=AUD.ctx;if(!c)return;
  if(k==='k'){tone('tri',150,t,.12,.35,40);return}
  const s=c.createBufferSource();s.buffer=AUD.noise;const f=c.createBiquadFilter(),g=c.createGain();
  f.type=k==='s'?'bandpass':'highpass';f.frequency.value=k==='s'?1800:7000;const dur=k==='s'?.12:.035;
  g.gain.setValueAtTime(k==='s'?.22:.09,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f).connect(g).connect(AUD.master);s.start(t);s.stop(t+dur+.02);
}
function schedule(){
  const c=AUD.ctx,T=AUD.cur;if(!c||!T)return;const sd=60/T.bpm/2;
  while(AUD.next<c.currentTime+.15){
    const i=AUD.step;
    T.v.forEach(v=>{const n=v.s[i%v.s.length];if(n&&n!=='-'&&n!=='.'){let len=1;while(v.s[(i+len)%v.s.length]==='-'&&len<v.s.length)len++;tone(v.w,nf(n),AUD.next,len*sd,v.vol)}});
    if(T.d){const n=T.d[i%T.d.length];if(n&&n!=='.')drum(n,AUD.next)}
    AUD.step++;AUD.next+=sd;
    if(T.once&&AUD.step>=T.len){const cb=T.cb;AUD.cur=null;qkTimeout(()=>cb&&cb(),Math.max(0,(AUD.next-c.currentTime)*1000));break}
  }
}
function playTrack(name){
  AUD.want=name;if(!AUD.ctx||AUD.jingle)return;if(AUD.curName===name&&AUD.cur)return;
  AUD.cur=TRACKS[name];AUD.curName=name;AUD.step=0;AUD.next=AUD.ctx.currentTime+.06;
}
function jingle(name,cb){
  if(!AUD.ctx){if(cb)cb();return}
  AUD.jingle=true;const T=Object.assign({},TRACKS[name]);T.cb=()=>{AUD.jingle=false;AUD.curName=null;if(AUD.want)playTrack(AUD.want);if(cb)cb()};
  AUD.cur=T;AUD.curName='#'+name;AUD.step=0;AUD.next=AUD.ctx.currentTime+.05;
}

let lastBlip=0;
function sfx(n){
  const c=AUD.ctx;if(!c||!AUD.on)return;const t=c.currentTime+.01;
  switch(n){
    case 'blip':if(t-lastBlip<.05)return;lastBlip=t;tone('p50',1180,t,.025,.035);break;
    case 'select':tone('p25',880,t,.04,.06);tone('p25',1320,t+.045,.05,.06);break;
    case 'good':tone('p50',1047,t,.07,.07);tone('p50',1319,t+.07,.07,.07);tone('p50',1568,t+.14,.14,.07);break;
    case 'bad':tone('p25',220,t,.16,.08,150);break;
    case 'bump':tone('tri',110,t,.06,.18,70);break;
    case 'door':{const s=c.createBufferSource();s.buffer=AUD.noise;const f=c.createBiquadFilter(),g=c.createGain();f.type='bandpass';f.frequency.setValueAtTime(2500,t);f.frequency.exponentialRampToValueAtTime(400,t+.2);g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);s.connect(f).connect(g).connect(AUD.master);s.start(t);s.stop(t+.25);break}
    case 'encounter':['C5','E5','G5','C6','E5','G5','C6','E6'].forEach((x,i)=>tone('p50',nf(x),t+i*.045,.045,.06));break;
    case 'wind':{const s=c.createBufferSource();s.buffer=AUD.noise;const f=c.createBiquadFilter(),g=c.createGain();f.type='bandpass';f.frequency.setValueAtTime(400,t);f.frequency.linearRampToValueAtTime(1200,t+.3);f.frequency.linearRampToValueAtTime(300,t+.7);g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.25,t+.15);g.gain.exponentialRampToValueAtTime(.001,t+.8);s.connect(f).connect(g).connect(AUD.master);s.start(t);s.stop(t+.85);break}

const BOX={on:false,origin:[33,16],guard:null,since:0,lastMove:0};

const GUARD_PATH=[[34,17],[34,22],[32,22],[32,17]];
function enterBox(){
  if(BOX.on)return;
  egg('mgs',["Un grand carton vide, posé là sans raison apparente.","Tu te glisses dessous. Parfait : plus personne ne peut te voir. Tu peux même marcher avec. (A pour en sortir.)"],()=>{

    BOX.guard={x:34*TS,y:22*TS,i:1,dir:'up',state:'patrol',wait:0,frame:0};

function leaveBox(found){
  BOX.on=false;BOX.guard=null;
  if(found){P.x=BOX.origin[0];P.y=BOX.origin[1]+1;P.px=P.x*TS;P.py=P.y*TS;P.dir='up';P.moving=false;S.x=P.x;S.y=P.y;fadeIn()}
}
function updateGuard(k){
  const g=BOX.guard;if(!g||!BOX.on)return;if(dlg.open||busy)return;
  if(P.moving)BOX.lastMove=tick;
  const gx=Math.round(g.x/TS),gy=Math.round(g.y/TS);
  const step=(tx,ty,sp)=>{const dx=tx-g.x,dy=ty-g.y;if(Math.abs(dx)>0.5){g.x+=Math.sign(dx)*Math.min(sp,Math.abs(dx));g.dir=dx>0?'right':'left'}else if(Math.abs(dy)>0.5){g.y+=Math.sign(dy)*Math.min(sp,Math.abs(dy));g.dir=dy>0?'down':'up'}else return true;g.frame+=sp/4;return false};
  if(g.state==='patrol'){
    if(g.wait>0){g.wait-=k;if(g.wait<60&&g.wait>58)g.dir=['left','right','up','down'][Math.floor(Math.random()*4)]}
    else{const [tx,ty]=GUARD_PATH[g.i];if(step(tx*TS,ty*TS,0.9*k)){g.i=(g.i+1)%GUARD_PATH.length;g.wait=90}}
    // repérage : seulement si le carton BOUGE dans son champ de vision
    const [dx,dy]=DIRS[g.dir],moving=tick-BOX.lastMove<12;
    if(moving&&Math.abs(gx-P.x)+Math.abs(gy-P.y)<=1){g.state='alert';g.wait=45;sfx('bad')}
    else if(moving)for(let n=1;n<=5;n++){const x=gx+dx*n,y=gy+dy*n;if(x===P.x&&y===P.y){g.state='alert';g.wait=45;sfx('bad');break}const t=tileAt(x,y);if(t===undefined||SOLID.has(t))break}
    if(g.state==='patrol'&&tick-BOX.since>60*50){BOX.guard=null;say([{w:'Vigile',t:"Rien. Ce doit être mon imagination."},{t:"Le vigile s'éloigne. Tu restes seul avec ton carton et ta dignité."}])}
  }else if(g.state==='alert'){g.wait-=k;g.dir=Math.abs(P.px-g.x)>Math.abs(P.py-g.y)?(P.px>g.x?'right':'left'):(P.py>g.y?'down':'up');if(g.wait<=0)g.state='chase'}
  else if(g.state==='chase'){
    const tx=P.px,ty=P.py;if(Math.abs(tx-g.x)+Math.abs(ty-g.y)<=TS+2||step(tx,ty,2.6*k)){g.state='caught';
      say([{w:'Vigile',t:"Un carton qui marche. Tu croyais vraiment que ça passerait ?"},{t:"Tu es découvert ! Retour à la case départ, à côté du carton."}],()=>leaveBox(true))}
  }
}

  R(c,X+2,Y+6,10,3,'#f1c7a1');R(c,X+(f>0?9:-1),Y+(st?4:7),6,2,'#f1c7a1');R(c,X+(f>0?-1:9),Y+(st?7:4),6,2,'#f1c7a1');
  R(c,X+4,Y+1,6,6,'#f1c7a1');R(c,X+4,Y,6,3,'#5a3a22');R(c,X+(f>0?8:5),Y+4,1,1,'#222');

const ACT={
  ens:{lab:'Enseignement',ref:155},pe:{lab:'Petite enfance',ref:160},sport:{lab:'Sport (hors piscine)',ref:148},
  pisc:{lab:'Piscine',ref:3249,unit:'kWh/m² de bassin'},adm:{lab:'Administratif',ref:156},cult:{lab:'Culture et vie sociale',ref:143},ehpad:{lab:'Résidence seniors',ref:250}
};
const PSITES=[
  ['École Jean-Jaurès','ens',2000,86,208],['École Pasteur','ens',2400,95,470],['Maternelle Les Tilleuls','ens',900,38,110],['Groupe scolaire Victor-Hugo','ens',3200,120,330],['École Marie-Curie','ens',1800,68,190],
  ['Crèche Les Lucioles','pe',600,32,62],['Crèche Pom’Pouce','pe',450,28,88],
  ['Gymnase Coubertin','sport',1800,62,200],['Gymnase des Sablons','sport',1500,48,330],['Dojo municipal','sport',700,25,72],
  ['Piscine Aqualoire','pisc',3000,700,1150,500],
  ['Hôtel de ville','adm',2500,190,215],['Annexe Le Carré','adm',1500,165,120],['Centre technique municipal','adm',1200,58,130],
  ['Médiathèque','cult',1400,95,110],['Salle des fêtes','cult',1000,26,180],['École de musique','cult',500,20,50],['Centre social','cult',800,38,80],['Maison des associations','cult',600,22,60],
  ['Résidence Les Glycines','ehpad',4200,330,720]
].map(([n,a,surf,e,g,bassin],i)=>({i,n,a,surf,e,g,bassin}));
const PX={e:186,g:88.7},CX={e:.052,g:.204};  // €/MWh et tCO2e/MWh, valeurs du cours
const IND={mwh:{lab:'Consommation',u:'MWh',f:v=>fmt(Math.round(v))+' MWh'},eur:{lab:'Coût',u:'€ HT',f:v=>fmt(Math.round(v/100)*100)+' €'},co2:{lab:'Émissions',u:'tCO₂e',f:v=>fmt(Math.round(v))+' t'}};
const parts=(s,ind)=>ind==='mwh'?[s.e,s.g]:ind==='eur'?[s.e*PX.e,s.g*PX.g]:[s.e*CX.e,s.g*CX.g];
const tot=(s,ind)=>{const p=parts(s,ind);return p[0]+p[1]};
const ratio=s=>(s.e+s.g)*1000/(s.bassin||s.surf);
const refOf=s=>ACT[s.a].ref;
const ecart=s=>ratio(s)/refOf(s)-1;
const gis=s=>Math.max(0,ratio(s)-refOf(s))*(s.bassin||s.surf)/1000;
const median=a=>{const v=a.slice().sort((x,y)=>x-y),m=v.length>>1;return v.length%2?v[m]:(v[m-1]+v[m])/2};
const medAct=a=>median(PSITES.filter(s=>s.a===a).map(ratio));
function pareto(ind,list){
  list=(list||PSITES).map(s=>({s,v:tot(s,ind),p:parts(s,ind)})).sort((x,y)=>y.v-x.v);
  const T=list.reduce((a,r)=>a+r.v,0);let c=0;list.forEach(r=>{c+=r.v;r.share=r.v/T;r.cum=c/T});
  return{list,T,n80:list.findIndex(r=>r.cum>=.8)+1};
}
const rankOf=ind=>{const m={};pareto(ind).list.forEach((r,k)=>m[r.s.n]=k+1);return m};
function byActivity(ind){
  const rows=Object.keys(ACT).map(a=>{const ss=PSITES.filter(s=>s.a===a);const p=[0,0];ss.forEach(s=>{const q=parts(s,ind);p[0]+=q[0];p[1]+=q[1]});return{a,lab:ACT[a].lab,n:ss.length,p,v:p[0]+p[1]}}).sort((x,y)=>y.v-x.v);
  const T=rows.reduce((a,r)=>a+r.v,0);let c=0;rows.forEach(r=>{c+=r.v;r.share=r.v/T;r.cum=c/T});return{rows,T};
}
const pct=v=>Math.round(v*100)+' %';
const sgn=v=>(v>=0?'+':'−')+Math.abs(Math.round(v*100))+' %';

function weekCurve(id){
  const out=[];let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  for(let d=0;d<7;d++)for(let h=0;h<48;h++){const H=h/2;let p;
    if(id==='ecole'){p=6;const cl=d<5,wed=d===2;if(cl&&!wed){if(H>=7&&H<8)p=24;else if(H>=8&&H<11.5)p=38;else if(H>=11.5&&H<13.5)p=52;else if(H>=13.5&&H<16.5)p=36;else if(H>=16.5&&H<18)p=16}if(wed){if(H>=7.5&&H<12)p=34;else if(H>=12&&H<14)p=12}}
    if(id==='bureau'){p=18;if(d<5){if(H>=7&&H<8)p=60;else if(H>=8&&H<12)p=92;else if(H>=12&&H<14)p=80;else if(H>=14&&H<18)p=96;else if(H>=18&&H<20)p=44}}
    if(id==='boulangerie'){p=4;if(d!==0){if(H>=3&&H<7)p=24;else if(H>=7&&H<13)p=14;else if(H>=13&&H<15)p=7;else if(H>=15&&H<19.5)p=12}}
    out.push(Math.max(0,p+(rnd()-.5)*2.4));}
  return out;
}

/* ================= DÉTECTER ================= */
function actDerive(id){
  const s=site();if(S.ch!==7)return;
  if(S.derives[id])return say([{t:'Déjà noté dans ton rapport de ronde.'}]);
  const D={light:['Éclairage des circulations resté allumé toute la nuit',0.5],rdc:s.derRdc,cave:s.derCave,boiler:null};
  S.derives[id]=1;save();gainXP(15);
  const lines=id==='boiler'?[{t:"La chaudière tourne un samedi soir, bâtiment vide ! Dérive gaz : le réduit de week-end n'est pas programmé."},{t:"Une règle métier liée au calendrier (« chaudière en marche le week-end ») la repère tout de suite."}]:[{t:`Dérive trouvée : ${D[id][0]}.`},{t:`+${String(D[id][1]).replace('.',',')} kW sur le talon, toutes les nuits et tous les week-ends.`}];
  const n=Object.keys(S.derives).length;
  say([...lines,{t:`Rapport de ronde : ${n}/4 dérives.`}],()=>{hud();if(n>=4&&!gate(7))gameDetect()});
}

function planStep(el,next){
  const BUD=12000,GOAL=4000;let tries=0;
  el.innerHTML=`<h3>Compose ton plan d'action</h3><div class="ctx">Budget travaux cette année : <b class="num">${fmt(BUD)} €</b>. Objectif : au moins <b class="num">${fmt(GOAL)} € HT</b> d'économies par an. <i>Valeurs fictives.</i></div><div class="opts" id="acts"></div><div class="ctx" id="tot" aria-live="polite"></div><button class="btn" id="pv">Valider le plan ▸</button><div class="fbz"></div>`;
  const box=el.querySelector('#acts'),tot=el.querySelector('#tot'),fbz=el.querySelector('.fbz');
  ACTIONS.forEach(a=>{const l=document.createElement('label');l.className='chk';l.innerHTML=`<input type="checkbox" id="act_${a.id}" value="${a.id}"><span><span class="tag">${a.cat}</span> ${a.t}<small>Coût ${fmt(a.cost)} € · gain ${fmt(a.gain)} €/an · retour ${a.cost?String(Math.round(a.cost/a.gain*10)/10).replace('.',',')+' ans':'immédiat'}</small></span>`;box.appendChild(l)});
  const calc=()=>{const sel=ACTIONS.filter(a=>el.querySelector('#act_'+a.id).checked),c=sel.reduce((s,a)=>s+a.cost,0),g=sel.reduce((s,a)=>s+a.gain,0);
    tot.innerHTML=`Coût : <b class="num" style="color:${c>BUD?'var(--bad)':'inherit'}">${fmt(c)} €</b> / ${fmt(BUD)} € · Gain : <b class="num">${fmt(g)} €/an</b> · Retour global : <b class="num">${g?(c?String(Math.round(c/g*10)/10).replace('.',',')+' ans':'immédiat'):'—'}</b>`;return{c,g,sel}};
  box.onchange=calc;calc();
  el.querySelector('#pv').onclick=e=>{const {c,g,sel}=calc();const sob=sel.filter(a=>a.cat==='Sobriété').length;
    if(c>BUD){tries++;trk('wrong_answer',{t:panelTitle(),q:trkTxt('Plan d’action').slice(0,100),a:trkTxt('budget dépassé').slice(0,80)});sfx('bad');fbz.innerHTML='<div class="fb ko">✘ Budget dépassé. Les gros travaux attendront : commence par ce qui ne coûte presque rien.</div>';return}
    if(g<GOAL){tries++;trk('wrong_answer',{t:panelTitle(),q:trkTxt('Plan d’action').slice(0,100),a:trkTxt('économies insuffisantes').slice(0,80)});sfx('bad');fbz.innerHTML=`<div class="fb ko">✘ Seulement ${fmt(g)} €/an. Il manque ${fmt(GOAL-g)} €. As-tu pris toutes les actions de sobriété ?</div>`;return}
    e.target.remove();box.querySelectorAll('input').forEach(i=>i.disabled=true);
    fbz.innerHTML=`<div class="fb ok">✔ Plan validé : ${fmt(g)} €/an pour ${fmt(c)} €. ${sob===3?'Toute la sobriété est dedans : c\'est la base.':'Astuce : la sobriété, presque gratuite, passe toujours en premier.'} Isoler un bâtiment qu'on chauffe le week-end, c'est payer des travaux pour chauffer du vide.</div>`;gainXP(tries?5:20);contBtn(fbz,next)};
}

/* ================= ÉVOLUTION, FIN, TITRE, MENU ================= */
function evolve(rank,cb){
  if(S.rank>=rank){hud();if(cb)cb();return}
  trk('evolve',{rank});
  busy=true;clearKeys();const old=S.rank;
  jingle('evo');const ov=document.createElement('div');ov.className='evo';ov.innerHTML=`<div class="t">Quoi ? ${esc(S.name)}, ${RANKS[old]}, évolue !</div><canvas width="20" height="20" aria-hidden="true"></canvas><div class="row" style="justify-content:center"></div>`;
  $('layer').appendChild(ov);const c=ov.querySelector('canvas'),x=c.getContext('2d'),t=ov.querySelector('.t');let n=0,start=performance.now();
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const drawP=r=>{x.clearRect(0,0,20,20);drawChar(x,2,3,'down',0,PAL[r])};
  (function anim(now){const el=now-start,period=Math.max(60,300-el/12);if(!reduce&&el<3200){drawP(Math.floor(el/period)%2?rank:old);qkRAF(anim)}else{
    drawP(rank);S.rank=rank;const need=rank===1?9:19;if(level()<need+1)S.xp=need*90;save();hud();
    t.innerHTML=`Félicitations ! Tu deviens <b style="color:var(--amber)">${RANKS[rank]}</b> !`;
    const b=document.createElement('button');b.className='btn';b.style.background='var(--amber)';b.style.color='var(--ink)';b.textContent='Continuer ▸';b.onclick=()=>{ov.remove();busy=false;hud();if(cb)cb()};ov.querySelector('.row').appendChild(b);b.focus()}})(start);
}

const KEYMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',KeyW:'up',KeyS:'down',KeyA:'left',KeyD:'right'};
onKey('keydown',e=>{
  if(QK_HOST.hidden)return;const tag=(((e.composedPath&&e.composedPath()[0])||e.target).tagName||'').toLowerCase();if(tag==='input'||tag==='select'||tag==='textarea')return;
  const isM=(e.key||'').toLowerCase()==='m'&&!e.ctrlKey&&!e.metaKey&&!e.altKey; // la lettre M, quel que soit le clavier (AZERTY ou QWERTY)
  if(busy){if(isM&&!e.repeat&&panelEl&&panelEl.querySelector('#mClose')){e.preventDefault();closePanel()}return}
  const k=KEYMAP[e.code]||KEYMAP[e.key];
  if(k){keys[k]=1;e.preventDefault();return}
  if(e.code==='Space'||e.key==='Enter'||e.code==='KeyE'){e.preventDefault();if(!e.repeat)pressA();return}
  if(isM){e.preventDefault();if(!e.repeat)openMenu()}
});
onKey('keyup',e=>{if(e.key==='Shift')P.runHeld=false;const k=KEYMAP[e.code]||KEYMAP[e.key];if(k)keys[k]=0});
onKey('keydown',e=>{if(QK_HOST.hidden)return;const t=((e.composedPath&&e.composedPath()[0])||e.target).tagName||'';if(/INPUT|SELECT|TEXTAREA/.test(t))return;if(e.key==='Shift')P.runHeld=true;if(e.code==='KeyR'&&!e.repeat&&!busy){setRun(!P.runToggle)}});
function setRun(on){trk('setting',{k:'course',v:on});P.runToggle=on;const b=ROOT.querySelector('.ab .run');if(b)b.setAttribute('aria-pressed',on);toast(on?'Course activée':'Marche')}
ROOT.querySelector('.ab .run').addEventListener('pointerdown',e=>{e.preventDefault();setRun(!P.runToggle)});
addEventListener('blur',()=>{clearKeys();P.runHeld=false});
ROOT.querySelectorAll('.dpad button').forEach(b=>{const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();if(busy)return;keys[k]=1;b.classList.add('held');b.setPointerCapture(e.pointerId)});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>{keys[k]=0;b.classList.remove('held')}))});
ROOT.querySelector('.ab .a').addEventListener('pointerdown',e=>{e.preventDefault();pressA()});
ROOT.querySelector('.ab .b').addEventListener('pointerdown',e=>{e.preventDefault();openMenu()});

      <ul class="a-retenir">
        <li><span>Le <strong>Pareto</strong> classe les sites du plus gros au plus petit et cumule leur part. Une minorité de sites fait souvent l’essentiel : la « règle des 80/20 » est un ordre de grandeur, pas une loi.</span></li>
