<style>
/* Layout: one retro console — HUD strip, pixel screen, objective strip, touch pad — centred on a night-blue desk. Single committed dark look. */
:root{
  --desk:#131a2b;      /* page ground, deep grid blue */
  --ink:#1c2440;       /* frames, dialog border */
  --paper:#f7f0dc;     /* dialog + panels */
  --paper-2:#ece2c4;
  --text:#1c2440;
  --muted:#5b6380;
  --amber:#f2a33a;     /* XP, highlights */
  --teal:#2aa198;      /* electricity */
  --flame:#e2573b;     /* gas */
  --ok:#2f8f4e; --bad:#c43d3d;
  --on-desk:#e8e4d6;
  --f-pix:"Pixelify Sans", "Courier New", monospace;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--desk);color:var(--on-desk);font-family:var(--f-body);
  background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:24px 24px;padding-inline:16px;padding-block:12px 24px}
.console{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-family:var(--f-pix);background:var(--ink);border:3px solid #0b1020;border-radius:6px;padding:6px 10px;color:var(--on-desk)}
.hud .who{font-weight:700;font-size:15px}
.hud .rank{color:var(--amber);font-size:14px}
.hud .lvl{font-size:14px}
.xpbar{flex:1;min-width:90px;height:8px;background:#0b1020;border-radius:4px;overflow:hidden;border:1px solid #39426a}
.xpbar i{display:block;height:100%;background:var(--amber);width:0;transition:width .4s}
.hud button{font:inherit;font-size:13px;background:#2c365c;color:var(--on-desk);border:2px solid #4a5588;border-radius:4px;padding:3px 8px;cursor:pointer}
.hud button:hover,.hud button:focus-visible{border-color:var(--amber);outline:none}
.badges{display:flex;gap:3px}
.badges span{width:14px;height:14px;border-radius:50%;background:#2c365c;border:1px solid #4a5588;display:inline-block}
.badges span.on{background:var(--amber);border-color:#ffd48a;box-shadow:0 0 6px rgba(242,163,58,.6)}
.screen-wrap{position:relative;border:6px solid #0b1020;border-radius:8px;background:#000;overflow:hidden;box-shadow:0 0 0 3px #2c365c,0 12px 30px rgba(0,0,0,.45)}
canvas#screen{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
.objective{font-family:var(--f-pix);font-size:15px;background:#1a223a;border:2px dashed #3a4470;border-radius:6px;padding:6px 10px;color:var(--on-desk)}
.objective b{color:var(--amber);font-weight:600}
.keys{font-size:12.5px;color:#9aa3c4;text-align:center}
/* dialog */
.dialog{position:absolute;left:2%;right:2%;bottom:3%;background:var(--paper);color:var(--text);border:4px double var(--ink);border-radius:6px;padding:10px 14px 12px;font-family:var(--f-pix);font-size:clamp(13px,2.6vw,18px);line-height:1.35;min-height:28%;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.dialog .spk{position:absolute;top:-14px;left:12px;background:var(--ink);color:var(--paper);font-size:.8em;padding:1px 8px;border-radius:3px}
.dialog .more{position:absolute;right:10px;bottom:4px;animation:blink 1s steps(2) infinite;color:var(--flame)}
@keyframes blink{50%{opacity:0}}
.toast{position:fixed;z-index:60;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);background:var(--amber);color:var(--ink);font-family:var(--f-pix);font-weight:700;padding:4px 12px;border-radius:4px;border:2px solid var(--ink);white-space:nowrap;font-size:clamp(12px,2.4vw,16px);pointer-events:none;animation:pop 2.2s forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-8px)}10%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
/* touch pad */
.pad{display:none;justify-content:space-between;align-items:center;padding:6px 8px;user-select:none;-webkit-user-select:none;touch-action:none}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:2px}
.dpad button,.ab button{background:#2c365c;border:2px solid #4a5588;color:var(--on-desk);font-family:var(--f-pix);font-size:18px;border-radius:8px;touch-action:none}
.dpad button:active,.ab button:active,.dpad button.held{background:#4a5588}
.ab{display:flex;gap:12px;align-items:center}
.ab button{width:62px;height:62px;border-radius:50%;font-weight:700}
.ab .a{background:var(--flame);border-color:#ff9a80}
@media (pointer:coarse),(max-width:680px){.pad{display:flex}.keys{display:none}}
/* overlays */
.overlay{position:fixed;inset:0;background:rgba(8,11,22,.78);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;z-index:20;overflow-y:auto}
.panel{background:var(--paper);color:var(--text);border:4px double var(--ink);border-radius:8px;width:100%;max-width:680px;margin:auto 0;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.panel header{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--ink);color:var(--paper);font-family:var(--f-pix);padding:8px 14px;font-size:17px}
.panel header .step{color:var(--amber);font-size:14px}
.pbody{padding:16px 18px 18px;font-size:16px;line-height:1.5}
.pbody h3{font-family:var(--f-pix);font-size:20px;margin:0 0 8px;text-wrap:balance}
.pbody p{margin:0 0 10px;max-width:65ch}
.pbody .ctx{background:var(--paper-2);border-left:4px solid var(--teal);padding:8px 12px;border-radius:0 4px 4px 0;margin-bottom:12px}
.pbody .ctx.gas{border-left-color:var(--flame)}
.pbody .num{font-variant-numeric:tabular-nums;font-family:var(--f-pix);font-size:1.05em}
.opts{display:grid;gap:8px;margin:10px 0}
.opt{text-align:left;font:inherit;background:#fffaf0;border:2px solid #c9bb92;border-radius:6px;padding:9px 12px;cursor:pointer;color:var(--text)}
.opt:hover:not(:disabled),.opt:focus-visible{border-color:var(--ink);outline:none;background:#fff}
.opt.good{border-color:var(--ok);background:#e3f4e6}
.opt.badc{border-color:var(--bad);background:#f8e1dd;opacity:.8}
.opt .mono{font-family:var(--f-pix);letter-spacing:.06em}
.fb{border-radius:6px;padding:9px 12px;margin:8px 0;font-size:15px}
.fb.ok{background:#e3f4e6;border:2px solid var(--ok)}
.fb.ko{background:#f8e1dd;border:2px solid var(--bad)}
.btn{font-family:var(--f-pix);font-size:17px;background:var(--ink);color:var(--paper);border:0;border-radius:6px;padding:9px 18px;cursor:pointer;margin-top:6px}
.btn:hover,.btn:focus-visible{background:#2f3a66;outline:2px solid var(--amber)}
.btn.alt{background:#fffaf0;color:var(--ink);border:2px solid var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:grid;gap:4px;margin-bottom:10px}
.field label{font-weight:700;font-size:14px}
.field select,.field input{font:inherit;padding:7px 8px;border:2px solid #c9bb92;border-radius:5px;background:#fffaf0;color:var(--text);max-width:100%}
.chk{display:flex;gap:10px;align-items:flex-start;background:#fffaf0;border:2px solid #c9bb92;border-radius:6px;padding:8px 10px;cursor:pointer}
.chk input{margin-top:4px;width:18px;height:18px;accent-color:var(--ink)}
.chk.good{border-color:var(--ok);background:#e3f4e6}.chk.badc{border-color:var(--bad);background:#f8e1dd}
.chk small{display:block;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.card{background:#fffaf0;border:3px solid #c9bb92;border-radius:8px;padding:10px;cursor:pointer;text-align:left;font:inherit;color:var(--text);display:flex;flex-direction:column;gap:6px}
.card:hover,.card:focus-visible{border-color:var(--ink);outline:none}
.card canvas{width:100%;image-rendering:pixelated;background:#7cc56a;border-radius:4px}
.card b{font-family:var(--f-pix);font-size:17px}
.card small{color:var(--muted);font-size:13.5px;line-height:1.35}
.tag{display:inline-block;font-family:var(--f-pix);font-size:13px;padding:1px 6px;border-radius:3px;background:var(--ink);color:var(--paper)}
.seq{display:flex;gap:6px;flex-wrap:wrap;min-height:40px;padding:6px;border:2px dashed #c9bb92;border-radius:6px;margin:8px 0}
.seq .it{background:var(--ink);color:var(--paper);padding:4px 10px;border-radius:4px;font-family:var(--f-pix)}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border-bottom:1px solid #d6caa6;padding:6px 8px;text-align:left}
.tbl th{font-family:var(--f-pix);font-weight:600}
.sig{width:100%;height:140px;background:#fff;border:2px dashed var(--ink);border-radius:6px;touch-action:none;cursor:crosshair}
.chart{width:100%;height:auto;background:#fffaf0;border:2px solid #c9bb92;border-radius:6px}
input[type=range]{width:100%;accent-color:var(--flame)}
.sticker{display:inline-block;font-family:var(--f-pix);background:#fff;border:2px solid #444;padding:2px 8px;border-radius:3px;margin:3px;color:#222}
.meter-art{display:flex;justify-content:center;margin:6px 0 12px}
.meter-art canvas{width:min(260px,70%);image-rendering:pixelated}
/* battle */
.battle{position:fixed;inset:0;z-index:25;background:rgba(8,11,22,.85);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.arena{width:100%;max-width:680px;background:linear-gradient(#cfe8d0 0 55%,#a9d39a 55%);border:4px double var(--ink);border-radius:8px;overflow:hidden;color:var(--text)}
.field2{position:relative;height:clamp(200px,42vw,280px)}
.hpbox{position:absolute;background:var(--paper);border:3px solid var(--ink);border-radius:6px 6px 14px 6px;padding:6px 10px;font-family:var(--f-pix);min-width:190px;font-size:15px}
.hpbox .bar{height:8px;background:#ddd;border:1px solid var(--ink);border-radius:4px;overflow:hidden;margin-top:4px}
.hpbox .bar i{display:block;height:100%;background:var(--ok);transition:width .6s}
.hpbox.enemy{top:12px;left:12px}.hpbox.me{right:12px;bottom:12px}
.mon{position:absolute;right:8%;top:10%;width:clamp(96px,20vw,140px);image-rendering:pixelated}
.hero{position:absolute;left:8%;bottom:4%;width:clamp(96px,20vw,130px);image-rendering:pixelated}
.mon.hit{animation:shake .5s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.mon.ko{transition:opacity .8s,transform .8s;opacity:0;transform:translateY(20px) scale(.6)}
.bmsg{background:var(--paper);border-top:4px double var(--ink);padding:10px 14px;font-family:var(--f-pix);font-size:16px;min-height:64px;line-height:1.35}
.bdata{font-family:var(--f-body);font-size:15px;background:var(--paper-2);padding:6px 10px;border-radius:4px;margin-top:6px}
.moves{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 12px 12px;background:var(--paper)}
@media (max-width:520px){.moves{grid-template-columns:1fr}}
.moves button{font-family:var(--f-body);font-size:14.5px;text-align:left;background:#fffaf0;border:2px solid var(--ink);border-radius:6px;padding:8px 10px;cursor:pointer;color:var(--text)}
.moves button:hover,.moves button:focus-visible{background:#fff;outline:2px solid var(--amber)}
.moves button:disabled{opacity:.45;cursor:default}
/* title & evolution */
.title-screen{position:fixed;inset:0;z-index:30;background:var(--desk);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.title-box{max-width:560px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.logo{font-family:var(--f-pix);font-weight:700;font-size:clamp(34px,8vw,58px);line-height:1;color:var(--amber);text-shadow:3px 3px 0 var(--flame),6px 6px 0 #0b1020;letter-spacing:.02em;text-wrap:balance}
.logo small{display:block;font-size:.34em;color:var(--on-desk);text-shadow:none;margin-top:10px;letter-spacing:.12em;text-transform:uppercase}
.title-box p{color:#b7bdd6;max-width:48ch;margin:0}
.title-box input{font-family:var(--f-pix);font-size:18px;padding:8px 10px;border-radius:6px;border:2px solid #4a5588;background:#0f1424;color:var(--on-desk);text-align:center;width:220px}
.title-box .btn{background:var(--amber);color:var(--ink)}
.title-box .btn.alt{background:transparent;color:var(--on-desk);border-color:#4a5588}
.ranks{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-family:var(--f-pix);font-size:13px;color:#9aa3c4}
.ranks span{border:1px solid #39426a;border-radius:4px;padding:2px 8px}
.evo{position:fixed;inset:0;z-index:40;background:#0b1020;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:var(--on-desk);font-family:var(--f-pix);text-align:center;padding:16px}
.evo canvas{width:160px;image-rendering:pixelated}
.evo .t{font-size:clamp(18px,4vw,26px);max-width:30ch}
.menu-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.menu-tabs button{font-family:var(--f-pix);font-size:15px;background:#fffaf0;border:2px solid #c9bb92;border-radius:5px;padding:4px 10px;cursor:pointer;color:var(--text)}
.menu-tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.dex div{background:#fffaf0;border:2px solid #c9bb92;border-radius:6px;padding:6px;text-align:center;font-size:13.5px}
.dex canvas{width:64px;image-rendering:pixelated}
.dex .unk{opacity:.45}
/* avatar & étapes */
.av-grid{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:560px){.av-grid{grid-template-columns:1fr}}
.av-prev{display:flex;flex-direction:column;gap:6px;align-items:center;background:#7cc56a;border:3px solid var(--ink);border-radius:8px;padding:10px}
.av-prev canvas{width:100%;max-width:200px;image-rendering:pixelated}
.av-prev small{color:var(--ink);font-size:12px;text-align:center}
.swatches,.pills{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid #fffaf0;box-shadow:0 0 0 2px #c9bb92;cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.sw:focus-visible,.pill:focus-visible{outline:2px solid var(--flame);outline-offset:2px}
.pill{font:inherit;font-size:14px;background:#fffaf0;border:2px solid #c9bb92;border-radius:999px;padding:4px 12px;cursor:pointer;color:var(--text)}
.pill.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chap{display:grid;gap:6px;margin:10px 0}
.chap .opt .num{color:var(--muted);margin-right:6px}
.chap .chap-done{background:#eef6ea}
.chap .chap-cur{border-color:var(--amber);background:#fff3dc}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function genTown(){

  rect(g,3,12,33,13,'=');            // grande rue
  rect(g,6,8,6,11,'=');rect(g,18,9,18,11,'=');rect(g,29,10,29,11,'=');rect(g,23,14,23,22,'=');rect(g,23,22,27,22,'=');rect(g,27,21,27,21,'=');rect(g,8,14,8,14,'=');
  rect(g,18,14,19,22,'=');
  // parc des données (hautes herbes) clôturé
  rect(g,3,15,13,23,'f');rect(g,4,16,12,22,':');g[15][8]='=';
  rect(g,15,18,16,21,'~');rect(g,14,19,17,20,'~');
  [[11,5],[12,6],[3,9],[23,10],[33,14],[21,16],[22,17],[31,21],[32,22],[11,9],[24,23],[21,23]].forEach(([x,y])=>{if(g[y][x]==='.')g[y][x]='*'});
  [[12,3],[24,6],[2,12],[33,9],[21,19],[31,15],[32,15]].forEach(([x,y])=>g[y][x]='T');
  BLD.forEach(b=>{rect(g,b.x,b.y,b.x+b.w-1,b.y+b.h-1,'B');g[b.door[1]][b.door[0]]='D'});
  return g;
}
function genOffice(){const W=12,H=9,g=grid(W,H,'o');rect(g,0,0,W-1,1,'W');rect(g,0,0,0,H-1,'W');rect(g,W-1,0,W-1,H-1,'W');rect(g,0,H-1,W-1,H-1,'W');g[H-1][5]='E';return g}
function genRdc(){const W=16,H=11,g=grid(W,H,'o');rect(g,0,0,W-1,1,'W');rect(g,0,0,0,H-1,'W');rect(g,W-1,0,W-1,H-1,'W');rect(g,0,H-1,W-1,H-1,'W');
  rect(g,5,2,5,6,'W');g[4][5]='o'; // cloison de la pièce technique / cuisine

function genCave(){const W=12,H=9,g=grid(W,H,'c');rect(g,0,0,W-1,1,'W');rect(g,0,0,0,H-1,'W');rect(g,W-1,0,W-1,H-1,'W');rect(g,0,H-1,W-1,H-1,'W');g[2][1]='U';return g}

function R(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h)}
function drawTile(c,ch,x,y,mapId){
  const X=x*TS,Y=y*TS,h=hash(x,y);
  const grass=()=>{R(c,X,Y,16,16,'#7cc56a');if(h>.5){R(c,X+3+(h*8|0),Y+4,1,2,'#5fa854');R(c,X+10-(h*5|0),Y+11,1,2,'#5fa854')}};
  switch(ch){

    case '*':grass();[[3,4,'#e2573b'],[10,6,'#f7e36b'],[6,11,'#fff'],[12,12,'#e2573b']].forEach(([a,b,col])=>{R(c,X+a,Y+b,2,2,col);R(c,X+a,Y+b+2,1,1,'#3f8a3a')});break;
    case ':':R(c,X,Y,16,16,'#4f9a4a');for(let i=0;i<4;i++){const bx=X+1+i*4,by=Y+(i%2?3:8);R(c,bx,by+2,1,5,'#2f6d34');R(c,bx+1,by,1,7,'#6fbf5f');R(c,bx+2,by+2,1,5,'#2f6d34')}break;
    case '=':R(c,X,Y,16,16,'#e3cf98');if(h>.3)R(c,X+(h*13|0),Y+(h*97%13|0),2,1,'#cdb57a');if(h>.7)R(c,X+4,Y+10,1,1,'#cdb57a');break;
    case 'T':grass();R(c,X+6,Y+11,4,5,'#6b4a2b');c.fillStyle='#2e7d4f';c.beginPath();c.arc(X+8,Y+7,7,0,7);c.fill();c.fillStyle='#3f9a5f';c.beginPath();c.arc(X+6,Y+5,3,0,7);c.fill();break;
    case '~':R(c,X,Y,16,16,'#4aa3d8');R(c,X+2+(h*4|0),Y+5,5,1,'#8fd0f0');R(c,X+8,Y+11,5,1,'#8fd0f0');break;
    case 'f':grass();R(c,X,Y+5,16,2,'#a07845');R(c,X,Y+10,16,2,'#a07845');R(c,X+2,Y+3,3,11,'#8a6538');R(c,X+11,Y+3,3,11,'#8a6538');break;
    case 'o':{let a='#c89b62',b='#b3874f';if(mapId==='rdc'){[a,b]=site().floor}
      R(c,X,Y,16,16,a);if(mapId==='rdc'&&S.site==='boulangerie'){if((x+y)%2)R(c,X,Y,16,16,b)}else if(mapId==='rdc'&&S.site==='bureau'){if(h>.6)R(c,X+(h*12|0),Y+(h*71%12|0),2,2,b)}else{R(c,X,Y+7,16,1,b);R(c,X+((y%2)?4:11),Y,1,7,b);R(c,X+((y%2)?12:2),Y+8,1,8,b)}break}
    case 'c':R(c,X,Y,16,16,'#6b6f78');if(h>.4)R(c,X+(h*12|0),Y+(h*37%12|0),3,2,'#5d616a');if(h>.8)R(c,X+3,Y+12,2,1,'#80848d');break;
    case 'E':R(c,X,Y,16,16,mapId==='cave'?'#6b6f78':'#c89b62');R(c,X+2,Y+3,12,10,'#8a3b3b');R(c,X+3,Y+4,10,8,'#a54a4a');break;
    case 'S':R(c,X,Y,16,16,'#3b3240');for(let i=0;i<4;i++)R(c,X+1,Y+2+i*4,14,2,i%2?'#6d5d4d':'#86735f');break;
    case 'U':R(c,X,Y,16,16,'#3b3240');for(let i=0;i<4;i++)R(c,X+1,Y+1+i*4,14-i*2,3,'#9a9aa2');break;
    case 'W':{const below=MAPS[mapId].g[y+1]&&MAPS[mapId].g[y+1][x];const face=below&&below!=='W';
      if(face){const wc=mapId==='cave'?'#555a64':mapId==='rdc'?site().wall:'#e8dcc0';R(c,X,Y,16,16,wc);R(c,X,Y+13,16,3,mapId==='cave'?'#3d414a':'#8c6d4a');if(mapId==='cave'){R(c,X+(h*10|0),Y+4,4,2,'#4a4f58')}}
      else R(c,X,Y,16,16,mapId==='cave'?'#2a2c33':'#3b3240');break}
  }
}
function drawBuilding(c,b){
  const X=b.x*TS,Y=b.y*TS,W=b.w*TS,H=b.h*TS,rh=Math.ceil(b.h*.45)*TS;
  R(c,X,Y+rh,W,H-rh,b.wall);R(c,X,Y+H-3,W,3,'#8c7a62');

  const dx=b.door[0]*TS;
  for(let tx=b.x;tx<b.x+b.w;tx++){if(tx===b.door[0])continue;for(let ty=b.y+Math.ceil(b.h*.45);ty<b.y+b.h;ty++){if(ty===b.y+b.h-1&&b.h>5&&(tx%2))continue;R(c,tx*TS+3,ty*TS+3,10,8,'#4a5566');R(c,tx*TS+4,ty*TS+4,8,6,'#8ec9e8');R(c,tx*TS+4,ty*TS+4,3,2,'#c9ecfa')}}
  const dy=(b.y+b.h-1)*TS;R(c,dx+2,dy+1,12,15,'#4a3421');R(c,dx+3,dy+2,10,14,'#6b4a2b');R(c,dx+10,dy+9,2,2,'#f2a33a');
  // enseigne
  const sy=Y+rh+1;R(c,dx-4,sy-12<Y?Y:sy-11,24,9,'#1c2440');const iy=(sy-11<Y?Y:sy-11)+2,ix=dx+2;
  if(b.id==='ecole'){R(c,ix,iy,12,5,'#f7f0dc');R(c,ix+1,iy+1,10,1,'#c0503a');R(c,ix+1,iy+3,7,1,'#1c2440')}
  if(b.id==='bureau'){R(c,ix+3,iy,6,5,'#f7f0dc');R(c,ix+4,iy+1,4,3,'#3f7f8f')}

  if(b.id===S.site){R(c,X+W-10,Y-6,2,10,'#1c2440');R(c,X+W-8,Y-6,7,5,'#f2a33a')}
}
const mapCache={};
function buildMapCanvas(id){
  const m=MAPS[id],H=m.g.length,W=m.g[0].length,c=document.createElement('canvas');c.width=W*TS;c.height=H*TS;const x2=c.getContext('2d');
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)drawTile(x2,m.g[y][x],x,y,id);
  if(id==='town')BLD.forEach(b=>drawBuilding(x2,b));
  mapCache[id]=c;
}
function rebuildMaps(){Object.keys(MAPS).forEach(buildMapCanvas)}

function targets(){
  const s=S.site,m=S.map,T=[],b=BLD.find(x=>x.id===s),off=BLD[0];
  const toOffice=()=>{if(m==='town')T.push(off.door);else if(m!=='office')T.push(m==='cave'?[1,2]:[7,10])};
  const toSite=()=>{if(m==='town'&&b)T.push(b.door);else if(m==='office')T.push([5,8])};
  switch(S.ch){
    case 0:if(m==='office')T.push([8,4]);else toOffice();break;
    case 1:if(m==='town'){if(!S.notes.adresse)T.push([b.door[0]+2,b.door[1]+1]);if(!S.notes.surface)T.push([b.door[0]-2,b.door[1]+1])}else if(m==='office')T.push([5,8]);else T.push(m==='cave'?[1,2]:[7,10]);break;
    case 2:toSite();if(m==='rdc'){if(!S.flags.elec)T.push([11,1]);if(!S.flags.gas)T.push([14,2])}if(m==='cave'&&!S.flags.gas)T.push([8,1]);if(m==='cave'&&S.flags.gas)T.push([1,2]);break;
    case 3:case 6:case 8:case 9:toOffice();if(m==='office')T.push([2,2]);break;
    case 4:if(m==='town')T.push([8,15]);else toOffice();break;
    case 5:toOffice();if(m==='office')T.push([10,2]);break;
    case 7:toSite();if(m==='rdc'&&(!S.derives.boiler||!S.derives.cave))T.push([14,2]);if(m==='cave'&&!S.derives.boiler)T.push([4,3]);break;
    case 10:toOffice();if(m==='office')T.push([8,4]);break;
  }
  return T;
}

/* ================= BOUCLE DE JEU ================= */
const P={x:5,y:6,px:5*TS,py:6*TS,dir:'up',moving:false,step:0,frame:0};
const keys={up:0,down:0,left:0,right:0};
let tick=0,busy=false; // busy = dialogue/modal/combat
function blocked(){return busy||dlg.open}
function tileAt(x,y){const g=MAPS[S.map].g;return g[y]&&g[y][x]}
function objAt(x,y){return objsFor(S.map).find(o=>o.x===x&&o.y===y)}
function isSolid(x,y){const t=tileAt(x,y);if(t===undefined||SOLID.has(t))return true;const o=objAt(x,y);return !!(o&&o.solid)}
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
function tryMove(d){
  P.dir=d;const [dx,dy]=DIRS[d],nx=P.x+dx,ny=P.y+dy,t=tileAt(nx,ny);
  if(t==='D'){enterDoor(nx,ny);return}
  if(t==='E'){exitBuilding();return}
  if(t==='S'){warp('cave',2,2,'down');return}
  if(t==='U'){warp('rdc',13,2,'left');return}
  if(isSolid(nx,ny)){const n=performance.now();if(n-(tryMove.b||0)>260){sfx('bump');tryMove.b=n}return}
  P.x=nx;P.y=ny;P.moving=true;
}
function warp(map,x,y,dir){S.map=map;P.x=x;P.y=y;P.px=x*TS;P.py=y*TS;P.dir=dir;P.moving=false;S.x=x;S.y=y;S.dir=dir;save();fadeIn();sfx('door');updateMusic()}
let fade=0;function fadeIn(){fade=1}
function enterDoor(x,y){
  const b=BLD.find(b=>b.door[0]===x&&b.door[1]===y);if(!b)return;
  if(b.id==='office'){warp('office',5,7,'up');return}
  if(!S.site){say([{t:"Ce bâtiment n'est pas encore dans ton périmètre. Parle d'abord à Mme Joule, au bureau."}]);return}
  if(b.id!==S.site){say([{t:`${SITES[b.id].name} : ce n'est pas (encore) ton site. ${S.ch>=10?"Tu le gères maintenant depuis la vue patrimoine, au bureau.":"Un jour, peut-être..."}`}]);return}
  if(S.ch<2){say([{t:"Pas si vite ! Avant d'entrer, cadre ton site depuis l'extérieur : boîte aux lettres et fiche technique."}]);return}
  warp('rdc',7,9,'up');
}
function exitBuilding(){
  if(S.map==='office'){const d=BLD[0].door;warp('town',d[0],d[1]+1,'down')}
  else{const b=BLD.find(b=>b.id===S.site);warp('town',b.door[0],b.door[1]+1,'down')}
}
function update(){
  tick++;
  if(fade>0)fade=Math.max(0,fade-.06);
  if(P.moving){const tx=P.x*TS,ty=P.y*TS,sp=2;P.px+=Math.sign(tx-P.px)*Math.min(sp,Math.abs(tx-P.px));P.py+=Math.sign(ty-P.py)*Math.min(sp,Math.abs(ty-P.py));P.step++;if(P.step%8===0)P.frame++;
    if(P.px===tx&&P.py===ty){P.moving=false;S.x=P.x;S.y=P.y;S.dir=P.dir;onStep()}}
  if(!P.moving&&!blocked()){for(const d of ['up','down','left','right'])if(keys[d]){tryMove(d);break}}
  if(!P.moving&&!Object.values(keys).some(Boolean))P.frame=0;
}
function onStep(){
  if(S.map==='town'&&tileAt(P.x,P.y)===':'&&S.ch>=4&&Math.random()<.16){startEncounter()}
}
function render(){
  const m=MAPS[S.map],mc=mapCache[S.map],mw=mc.width,mh=mc.height;
  let ox=P.px+8-VW*TS/2,oy=P.py+8-VH*TS/2;
  ox=mw<VW*TS?(mw-VW*TS)/2:Math.max(0,Math.min(mw-VW*TS,ox));oy=mh<VH*TS?(mh-VH*TS)/2:Math.max(0,Math.min(mh-VH*TS,oy));
  ox=Math.round(ox);oy=Math.round(oy);
  R(ctx,0,0,cv.width,cv.height,'#0b1020');ctx.drawImage(mc,-ox,-oy);
  const objs=objsFor(S.map),pal=PAL[S.rank];
  const ents=objs.map(o=>({y:o.y*TS,f:()=>drawObj(ctx,o,ox,oy,tick)}));
  ents.push({y:P.py+1,f:()=>drawChar(ctx,P.px-ox,P.py-oy-2,P.dir,P.frame,pal)});
  ents.sort((a,b)=>a.y-b.y).forEach(e=>e.f());
  // hautes herbes par-dessus les pieds
  if(S.map==='town'&&tileAt(P.x,P.y)===':'&&!P.moving){R(ctx,P.px-ox+2,P.py-oy+11,12,5,'#4f9a4a');R(ctx,P.px-ox+4,P.py-oy+10,1,4,'#6fbf5f');R(ctx,P.px-ox+10,P.py-oy+10,1,4,'#6fbf5f')}
  // nuit / cave
  const night=S.ch===7,dark=S.map==='cave'?(night?.9:.55):(night?(S.map==='town'?.6:.86):0);
  if(dark>0){const cx=P.px-ox+8,cy=P.py-oy+8,g=ctx.createRadialGradient(cx,cy,8,cx,cy,night?58:80);g.addColorStop(0,'rgba(6,9,24,0)');g.addColorStop(1,`rgba(6,9,24,${dark})`);ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,cv.height);
    if(night)objs.filter(o=>o.kind==='derive'||(o.kind==='boiler'&&!S.derives.boiler)).forEach(o=>{if(o.kind==='boiler'){const X=o.x*TS-ox,Y=o.y*TS-oy,g2=ctx.createRadialGradient(X+8,Y+6,1,X+8,Y+6,16);g2.addColorStop(0,'rgba(255,120,60,.8)');g2.addColorStop(1,'rgba(255,120,60,0)');ctx.fillStyle=g2;ctx.fillRect(X-10,Y-12,36,36)}else drawObj(ctx,o,ox,oy,tick)})}
  // flèches d'objectif
  const bob=Math.sin(tick/8)*2;
  targets().forEach(([x,y])=>{const X=x*TS-ox+8,Y=y*TS-oy-8+bob;ctx.fillStyle='#f2a33a';ctx.beginPath();ctx.moveTo(X-5,Y-6);ctx.lineTo(X+5,Y-6);ctx.lineTo(X,Y);ctx.fill();ctx.strokeStyle='#1c2440';ctx.lineWidth=1;ctx.stroke()});
  // nom de lieu
  if(fade>0){ctx.globalAlpha=fade;R(ctx,0,0,cv.width,cv.height,'#000');ctx.globalAlpha=1}
}
function loop(){update();render();requestAnimationFrame(loop)}

const dlg={open:false,q:[],cur:null,shown:0,cb:null,el:null};
function say(lines,cb){lines=lines.map(l=>typeof l==='string'?{t:l}:l);dlg.q=lines.slice();dlg.cb=cb||null;dlg.open=true;nextLine()}
function nextLine(){
  if(!dlg.q.length){dlg.open=false;if(dlg.el){dlg.el.remove();dlg.el=null}const cb=dlg.cb;dlg.cb=null;if(cb)setTimeout(cb,30);return}
  dlg.cur=dlg.q.shift();dlg.shown=0;
  if(!dlg.el){dlg.el=document.createElement('div');dlg.el.className='dialog';dlg.el.addEventListener('click',pressA);$('wrap').appendChild(dlg.el)}
  const txt=dlg.cur.t.replace(/\{name\}/g,S.name);dlg.cur.full=txt;typeTick();
}
function typeTick(){
  if(!dlg.open||!dlg.el)return;const c=dlg.cur;dlg.shown=Math.min(c.full.length,dlg.shown+2);
  dlg.el.innerHTML=(c.w?`<span class="spk">${esc(c.w)}</span>`:'')+esc(c.full.slice(0,dlg.shown))+(dlg.shown>=c.full.length?'<span class="more">▼</span>':'');
  if(dlg.shown<c.full.length){sfx('blip');setTimeout(typeTick,16)}
}
function pressA(){
  if(busy)return;
  if(dlg.open){if(dlg.shown<dlg.cur.full.length){dlg.shown=dlg.cur.full.length;typeTick()}else nextLine();return}
  if(P.moving)return;
  const [dx,dy]=DIRS[P.dir],o=objAt(P.x+dx,P.y+dy);
  if(o&&o.act){if(o.kind==='npc')o.dir={up:'down',down:'up',left:'right',right:'left'}[P.dir];o.act()}
}

function audInit(){
  if(AUD.ctx){if(AUD.ctx.state==='suspended')AUD.ctx.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{
    const c=AUD.ctx=new AC();AUD.master=c.createGain();AUD.master.gain.value=AUD.on?.5:0;AUD.master.connect(c.destination);
    [['p50',.5],['p25',.25],['p12',.125]].forEach(([k,d])=>{const n=40,re=new Float32Array(n),im=new Float32Array(n);for(let i=1;i<n;i++)re[i]=(2/(i*Math.PI))*Math.sin(i*Math.PI*d);AUD.waves[k]=c.createPeriodicWave(re,im)});
    const b=c.createBuffer(1,c.sampleRate,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AUD.noise=b;
    setInterval(schedule,25);
    if(AUD.want){const w=AUD.want;AUD.want=null;playTrack(w)}
  }catch(e){AUD.ctx=null}
}
function tone(w,f,t,dur,vol,slide){
  const c=AUD.ctx;if(!c||!f)return;const o=c.createOscillator(),g=c.createGain();
  if(w==='tri')o.type='triangle';else o.setPeriodicWave(AUD.waves[w]);
  o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.006);g.gain.setTargetAtTime(vol*.65,t+.02,.09);g.gain.setTargetAtTime(0,t+Math.max(.02,dur*.88),.025);
  o.connect(g).connect(AUD.master);o.start(t);o.stop(t+dur+.15);
}
function drum(k,t){
  const c=AUD.ctx;if(!c)return;
  if(k==='k'){tone('tri',150,t,.12,.35,40);return}
  const s=c.createBufferSource();s.buffer=AUD.noise;const f=c.createBiquadFilter(),g=c.createGain();
  f.type=k==='s'?'bandpass':'highpass';f.frequency.value=k==='s'?1800:7000;const dur=k==='s'?.12:.035;
  g.gain.setValueAtTime(k==='s'?.22:.09,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f).connect(g).connect(AUD.master);s.start(t);s.stop(t+dur+.02);
}
function schedule(){
  const c=AUD.ctx,T=AUD.cur;if(!c||!T)return;const sd=60/T.bpm/2;
  while(AUD.next<c.currentTime+.15){
    const i=AUD.step;
    T.v.forEach(v=>{const n=v.s[i%v.s.length];if(n&&n!=='-'&&n!=='.'){let len=1;while(v.s[(i+len)%v.s.length]==='-'&&len<v.s.length)len++;tone(v.w,nf(n),AUD.next,len*sd,v.vol)}});
    if(T.d){const n=T.d[i%T.d.length];if(n&&n!=='.')drum(n,AUD.next)}
    AUD.step++;AUD.next+=sd;
    if(T.once&&AUD.step>=T.len){const cb=T.cb;AUD.cur=null;setTimeout(()=>cb&&cb(),Math.max(0,(AUD.next-c.currentTime)*1000));break}
  }
}
function playTrack(name){

}

function sfx(n){
  const c=AUD.ctx;if(!c||!AUD.on)return;const t=c.currentTime+.01;

    case 'select':tone('p25',880,t,.04,.06);tone('p25',1320,t+.045,.05,.06);break;
    case 'good':tone('p50',1047,t,.07,.07);tone('p50',1319,t+.07,.07,.07);tone('p50',1568,t+.14,.14,.07);break;
    case 'bad':tone('p25',220,t,.16,.08,150);break;
    case 'bump':tone('tri',110,t,.06,.18,70);break;
    case 'door':{const s=c.createBufferSource();s.buffer=AUD.noise;const f=c.createBiquadFilter(),g=c.createGain();f.type='bandpass';f.frequency.setValueAtTime(2500,t);f.frequency.exponentialRampToValueAtTime(400,t+.2);g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);s.connect(f).connect(g).connect(AUD.master);s.start(t);s.stop(t+.25);break}

function dataAnim(el,next){
  const s=site();
  el.innerHTML=`<h3>Récupération des données</h3><p>Les compteurs remontent leurs mesures au distributeur, qui les transmet à ton logiciel grâce au mandat.</p><canvas class="chart" width="640" height="260" aria-label="Animation de collecte"></canvas><p class="num" id="cnt"></p>`;
  const c=el.querySelector('canvas'),x=c.getContext('2d'),cnt=el.querySelector('#cnt');let t0=performance.now(),pk=[],done=false,pts=0,days=0;
  const nodes={le:[70,70],lg:[70,190],en:[320,70],gr:[320,190],pc:[566,130]};
  const box=(p,col,lab,sub)=>{x.fillStyle=col;x.fillRect(p[0]-56,p[1]-28,112,56);x.fillStyle='#fff';x.font='600 14px "Pixelify Sans",monospace';x.textAlign='center';x.fillText(lab,p[0],p[1]-2);x.font='12px "Atkinson Hyperlegible",sans-serif';x.fillText(sub,p[0],p[1]+16)};
  function frame(now){
    const t=now-t0;x.fillStyle='#fffaf0';x.fillRect(0,0,640,260);x.strokeStyle='#c9bb92';x.lineWidth=3;x.setLineDash([6,6]);
    [['le','en'],['lg','gr'],['en','pc'],['gr','pc']].forEach(([a,b])=>{x.beginPath();x.moveTo(...nodes[a]);x.lineTo(...nodes[b]);x.stroke()});x.setLineDash([]);
    box(nodes.le,'#2aa198',s.souscrit>36?'Compteur pro':'Linky',`PDL …${s.pdl.slice(-4)}`);box(nodes.lg,'#c9a82a','Gazpar',`PCE ${s.pce}`);box(nodes.en,'#2f6db5','Enedis',elecChannel(s));box(nodes.gr,'#1c7a9a','GRDF','ADICT');box(nodes.pc,'#1c2440','Ton EMS','base de données');
    if(t<5200&&Math.random()<.25){const e=Math.random()<.65;pk.push({a:e?'le':'lg',b:e?'en':'gr',p:0,e})}
    pk.forEach(k=>{k.p+=.02;if(k.p>=1){if(k.b==='pc'){k.dead=1;if(k.e)pts+=48;else days++}else{k.a=k.b;k.b='pc';k.p=0}}const A=nodes[k.a],B=nodes[k.b];x.fillStyle=k.e?'#2aa198':'#e2573b';x.fillRect(A[0]+(B[0]-A[0])*k.p-5,A[1]+(B[1]-A[1])*k.p-5,10,10)});
    pk=pk.filter(k=>!k.dead);
    cnt.textContent=`Courbe de charge : ${fmt(pts)} points reçus · Gazpar : ${days} jours reçus`;
    if(t<6500||pk.length)requestAnimationFrame(frame);else if(!done){done=true;cnt.textContent+=' · Collecte terminée.';contBtn(el,next)}
  }
  requestAnimationFrame(frame);
}

function weekCurve(id){
  const out=[];let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  for(let d=0;d<7;d++)for(let h=0;h<48;h++){const H=h/2;let p;
    if(id==='ecole'){p=6;const cl=d<5,wed=d===2;if(cl&&!wed){if(H>=7&&H<8)p=24;else if(H>=8&&H<11.5)p=38;else if(H>=11.5&&H<13.5)p=52;else if(H>=13.5&&H<16.5)p=36;else if(H>=16.5&&H<18)p=16}if(wed){if(H>=7.5&&H<12)p=34;else if(H>=12&&H<14)p=12}}
    if(id==='bureau'){p=18;if(d<5){if(H>=7&&H<8)p=60;else if(H>=8&&H<12)p=92;else if(H>=12&&H<14)p=80;else if(H>=14&&H<18)p=96;else if(H>=18&&H<20)p=44}}
    if(id==='boulangerie'){p=4;if(d!==0){if(H>=3&&H<7)p=24;else if(H>=7&&H<13)p=14;else if(H>=13&&H<15)p=7;else if(H>=15&&H<19.5)p=12}}
    out.push(Math.max(0,p+(rnd()-.5)*2.4));}
  return out;
}

function planStep(el,next){
  const BUD=12000,GOAL=4000;let tries=0;
  el.innerHTML=`<h3>Compose ton plan d'action</h3><div class="ctx">Budget travaux cette année : <b class="num">${fmt(BUD)} €</b>. Objectif : au moins <b class="num">${fmt(GOAL)} € HT</b> d'économies par an. <i>Valeurs fictives.</i></div><div class="opts" id="acts"></div><div class="ctx" id="tot" aria-live="polite"></div><button class="btn" id="pv">Valider le plan ▸</button><div class="fbz"></div>`;
  const box=el.querySelector('#acts'),tot=el.querySelector('#tot'),fbz=el.querySelector('.fbz');
  ACTIONS.forEach(a=>{const l=document.createElement('label');l.className='chk';l.innerHTML=`<input type="checkbox" id="act_${a.id}" value="${a.id}"><span><span class="tag">${a.cat}</span> ${a.t}<small>Coût ${fmt(a.cost)} € · gain ${fmt(a.gain)} €/an · retour ${a.cost?String(Math.round(a.cost/a.gain*10)/10).replace('.',',')+' ans':'immédiat'}</small></span>`;box.appendChild(l)});
  const calc=()=>{const sel=ACTIONS.filter(a=>el.querySelector('#act_'+a.id).checked),c=sel.reduce((s,a)=>s+a.cost,0),g=sel.reduce((s,a)=>s+a.gain,0);
    tot.innerHTML=`Coût : <b class="num" style="color:${c>BUD?'var(--bad)':'inherit'}">${fmt(c)} €</b> / ${fmt(BUD)} € · Gain : <b class="num">${fmt(g)} €/an</b> · Retour global : <b class="num">${g?(c?String(Math.round(c/g*10)/10).replace('.',',')+' ans':'immédiat'):'—'}</b>`;return{c,g,sel}};
  box.onchange=calc;calc();
  el.querySelector('#pv').onclick=e=>{const {c,g,sel}=calc();const sob=sel.filter(a=>a.cat==='Sobriété').length;
    if(c>BUD){tries++;sfx('bad');fbz.innerHTML='<div class="fb ko">✘ Budget dépassé. Les gros travaux attendront : commence par ce qui ne coûte presque rien.</div>';return}
    if(g<GOAL){tries++;sfx('bad');fbz.innerHTML=`<div class="fb ko">✘ Seulement ${fmt(g)} €/an. Il manque ${fmt(GOAL-g)} €. As-tu pris toutes les actions de sobriété ?</div>`;return}
    e.target.remove();box.querySelectorAll('input').forEach(i=>i.disabled=true);
    fbz.innerHTML=`<div class="fb ok">✔ Plan validé : ${fmt(g)} €/an pour ${fmt(c)} €. ${sob===3?'Toute la sobriété est dedans : c\'est la base.':'Astuce : la sobriété, presque gratuite, passe toujours en premier.'} Isoler un bâtiment qu'on chauffe le week-end, c'est payer des travaux pour chauffer du vide.</div>`;gainXP(tries?5:20);contBtn(fbz,next)};
}

function evolve(rank,cb){
  busy=true;clearKeys();const old=S.rank;
  jingle('evo');const ov=document.createElement('div');ov.className='evo';ov.innerHTML=`<div class="t">Quoi ? ${esc(S.name)}, ${RANKS[old]}, évolue !</div><canvas width="20" height="20" aria-hidden="true"></canvas><div class="row" style="justify-content:center"></div>`;
  $('layer').appendChild(ov);const c=ov.querySelector('canvas'),x=c.getContext('2d'),t=ov.querySelector('.t');let n=0,start=performance.now();
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const drawP=r=>{x.clearRect(0,0,20,20);drawChar(x,2,3,'down',0,PAL[r])};
  (function anim(now){const el=now-start,period=Math.max(60,300-el/12);if(!reduce&&el<3200){drawP(Math.floor(el/period)%2?rank:old);requestAnimationFrame(anim)}else{
    drawP(rank);S.rank=rank;const need=rank===1?9:19;if(level()<need+1)S.xp=need*90;save();hud();
    t.innerHTML=`Félicitations ! Tu deviens <b style="color:var(--amber)">${RANKS[rank]}</b> !`;
    const b=document.createElement('button');b.className='btn';b.style.background='var(--amber)';b.style.color='var(--ink)';b.textContent='Continuer ▸';b.onclick=()=>{ov.remove();busy=false;hud();if(cb)cb()};ov.querySelector('.row').appendChild(b);b.focus()}})(start);
}

addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='select'||tag==='textarea')return;
  if(busy){if(e.key==='Escape'&&panelEl&&panelEl.querySelector('#mClose'))closePanel();return}
  const k=KEYMAP[e.code]||KEYMAP[e.key];
  if(k){keys[k]=1;e.preventDefault();return}
  if(e.code==='Space'||e.key==='Enter'||e.code==='KeyE'){e.preventDefault();if(!e.repeat)pressA();return}
  if(e.key==='Escape'||e.code==='KeyM'){openMenu()}
});
addEventListener('keyup',e=>{const k=KEYMAP[e.code]||KEYMAP[e.key];if(k)keys[k]=0});
addEventListener('blur',clearKeys);
document.querySelectorAll('.dpad button').forEach(b=>{const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();if(busy)return;keys[k]=1;b.classList.add('held');b.setPointerCapture(e.pointerId)});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>{keys[k]=0;b.classList.remove('held')}))});
document.querySelector('.ab .a').addEventListener('pointerdown',e=>{e.preventDefault();pressA()});
document.querySelector('.ab .b').addEventListener('pointerdown',e=>{e.preventDefault();openMenu()});
$('menuBtn').onclick=openMenu;
cv.addEventListener('click',()=>{if(!busy)pressA()});

function boot(){
  rebuildMaps();P.x=S.x;P.y=S.y;P.px=S.x*TS;P.py=S.y*TS;P.dir=S.dir||'up';P.moving=false;
  if(isSolid(P.x,P.y)){const f={office:[5,6],town:[6,9],rdc:[7,9],cave:[2,2]}[S.map]||[5,6];P.x=f[0];P.y=f[1];P.px=P.x*TS;P.py=P.y*TS}
  hud();fadeIn();applySobriete();updateMusic();
  if(S.ch===0&&S.map==='office')setTimeout(()=>{if(!busy&&!dlg.open)say([{t:"Ton premier jour. Mme Joule, l'energy manager senior, t'attend à droite. Approche-toi et appuie sur A (Espace)."}])},500);
}
rebuildMaps();hud();requestAnimationFrame(loop);titleScreen();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{});
$('sndBtn').onclick=()=>{audInit();setSound(!AUD.on)};setSound(AUD.on);
</script>

</body></html>
