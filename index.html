s « l’énergie » en général. Il suit des objets emboîtés : un **patrimoine** (toutes les écoles d’une ville), des **sites**, des **bâtiments**, et pour chacun des {{point-de-comptage|points de comptage}}.","L’école Jean-Jaurès est un site, avec un bâtiment de 2 000 m² et deux points de comptage : un pour l’électricité, un pour le gaz. Tout ce que le logiciel affichera ensuite sera rattaché à l’un de ces objets."]},{type:"demo",id:"perimetre",titre:"Écris la fiche de cadrage",consigne:"Choisis l’objectif de la mairie : la fiche de cadrage (données, pas de temps, historique, indicateurs) se remplit en conséquence."},{type:"demo",id:"usages",titre:"Ce que mesure un compteur, et ce qu’il ne mesure pas",consigne:"Un compteur donne un total. Bascule pour voir la répartition par usage, estimée à partir du modèle de l’école."},{type:"encadre",ton:"info",titre:"Un compteur mesure un point, pas un usage",texte:"Pour connaître la consommation de l’éclairage seul, il faut un {{sous-compteur}} sur son circuit, ou une estimation. Quand un écran affiche « éclairage : 14 MWh », la question à poser est toujours : mesuré ou estimé ?"}],approfondir:[{type:"tableau",titre:"Les niveaux de périmètre",entetes:["Niveau","À l’école","Ce qu’on y suit"],lignes:[["Patrimoine","Les écoles de la ville (fictif)","Budget global, classement des sites, priorités"],["Site","École Jean-Jaurès","Consommation totale, kWh/m², factures"],["Bâtiment","Bâtiment principal, 2 000 m²","Surface de référence, {{decret-tertiaire}}"],["Point de comptage","{{pdl}} 30001234567890, {{pce}} 21456789012345","Courbe de charge, index, contrat"],["Usage","Chauffage, éclairage, cuisine…","Sous-comptage ou estimation"]]},{type:"texte",titre:"Les identifiants",paragraphes:["Le {{pdl}} (Point De Livraison, appelé **PRM** par Enedis) identifie un raccordement électrique avec **14 chiffres**. Le {{pce}} (Point de Comptage et d’Estimation) identifie un point de livraison de gaz chez GRDF, en général avec 14 chiffres ; certains sites anciens ont encore un identifiant « GI » suivi de 6 chiffres.","Un identifiant désigne un **point de raccordement**, pas un appareil : quand le compteur est remplacé, le PDL ou le PCE reste le même, mais le numéro de série du compteur change. Le logiciel doit donc distinguer « point » et « compteur »."]},{type:"demo",id:"identifiants",titre:"Valide un identifiant",consigne:"Tape ou choisis un identifiant : le validateur dit s’il a le format d’un PDL ou d’un PCE."},{type:"encadre",ton:"attention",titre:"Le lien site ↔ compteurs n’est pas toujours simple",texte:["Un site peut avoir **plusieurs** PDL (une extension raccordée à part). Un PDL peut alimenter **plusieurs** bâtiments (l’école et le gymnase voisin). Un bâtiment peut changer de PDL après des travaux.","Il faut donc prévoir une relation « plusieurs à plusieurs » entre sites et points de comptage, avec des dates de validité et parfois une clé de répartition (par exemple 80 % école, 20 % gymnase)."]},{type:"texte",titre:"L’objectif décide des données",paragraphes:["**Économie** : on cherche le gaspillage, il faut la courbe de charge et un historique. **Budget** : on prévoit les dépenses, les factures suffisent. **Réglementation** : le {{decret-tertiaire}} impose aux bâtiments tertiaires d’au moins 1 000 m² de réduire leur consommation et de la déclarer sur {{operat}} ; il faut des consommations annuelles fiables et une surface. **Climat** : on convertit les kWh en {{tco2}}."]},{type:"encadre",ton:"qa",texte:"Cas utiles : identifiant à 13 ou 15 chiffres, avec espaces ou tirets, avec des lettres ; ancien PCE « GI123456 » ; site sans compteur ; compteur sans site ; deux sites qui partagent un PDL ; compteur remplacé sans changement de PDL."}]},quiz:[{q:"L’école a un {{pdl}} et un {{pce}}. Combien de points de comptage a-t-elle ?",choix:["Un seul : le site","Deux : un pour l’électricité, un pour le gaz","Autant que d’usages (chauffage, éclairage…)"],bonne:1,explication:"Un point de comptage par énergie livrée. Les usages ne sont pas des points de comptage, sauf s’ils ont un sous-compteur."},{q:"Le compteur électrique de l’école est remplacé. Que devient son PDL ?",choix:["Il change, comme le numéro du compteur","Il reste le même : il désigne le raccordement, pas l’appareil","Il est supprimé jusqu’à la prochaine facture"],bonne:1,explication:"Le PDL (ou PRM) identifie le point de raccordement. Seul le numéro de série du compteur change."},{q:"Lequel de ces identifiants a le bon format pour un PDL ?",choix:["3000123456789","30001234567890","3000-1234-5678"],bonne:1,explication:"Un PDL compte exactement 14 chiffres. Le premier en a 13, le troisième contient des tirets et 12 chiffres."},{q:"La mairie veut seulement prévoir son budget énergie de l’an prochain. Quelle source suffit en priorité ?",choix:["La courbe de charge au pas de 10 minutes","Les factures","Un sous-compteur par usage"],bonne:1,explication:"Pour un budget, on a besoin des montants en euros : les factures. La courbe fine sert à chercher des économies."},{q:"Un écran affiche « Éclairage : 14 MWh/an » alors que l’école n’a qu’un compteur électrique. C’est…",choix:["Une mesure directe","Une estimation","Impossible à afficher"],bonne:1,explication:"Sans sous-compteur sur l’éclairage, cette valeur est calculée à partir d’hypothèses. Le logiciel devrait l’indiquer."}]},2:{niveaux:{comprendre:[{type:"texte",titre:"Qui envoie quoi ?",paragraphes:["Les données de mesure viennent du {{distributeur}} (Enedis pour l’électricité, GRDF pour le gaz), qui pose et relève les compteurs. La facture vient du {{fournisseur}}, qui vend l’énergie. Ce ne sont pas les mêmes entreprises, et pas les mêmes canaux.","Avant de recevoir la moindre donnée de mesure, le logiciel a besoin d’un {{consentement}} du titulaire du contrat : ici, la mairie."]},{type:"demo",id:"consentement",titre:"Signe un consentement (simulé)",consigne:"Remplis le formulaire au nom de la mairie, signe, puis appelle l’API. Essaie aussi d’appeler l’API sans consentement, ou après son expiration."},{type:"encadre",ton:"info",titre:"Message clé n° 1 : chaque source a son usage",texte:["Le **télérelevé** sert à **analyser** : fin, rapide, il montre quand on consomme.","L’**index** sert à **contrôler** : c’est le totalisateur du compteur, la référence du comptage.","La **facture** sert à **chiffrer le coût** : c’est la référence financière, mais elle arrive tard et sur des périodes décalées."]},{type:"demo",id:"troisVoies",titre:"Trois sources, une même vérité",consigne:"Compare la somme de la courbe de charge, la différence d’index et l’énergie facturée sur une même période. Change la période et les anomalies pour voir apparaître les écarts."}],approfondir:[{type:"texte",titre:"Électricité : accès aux données Enedis",paragraphes:["**Jusqu’à 36 kVA (segment C5, compteur {{linky}})** : la {{courbe-de-charge}} est au pas de 30 minutes ; son enregistrement fin se fait avec l’accord du client. Les tiers y accèdent par {{data-connect}}, une API où le client donne son consentement sur son espace Enedis, pour une durée qu’il choisit (jusqu’à 3 ans d’après la documentation publique consultée).","**Au-delà de 36 kVA (segments C1 à C4, comme l’école)** : les compteurs professionnels sont télérelevés et mesurent une courbe de charge plus fine (10 minutes pour l’école). Les tiers y accèdent par le {{sge|SGE}} d’Enedis (système de gestion des échanges, en web services), avec un consentement écrit du client et une habilitation qui prend plusieurs mois."]},{type:"encadre",ton:"verifier",titre:"Changement récent chez Enedis",texte:"Data Connect a basculé vers une nouvelle version le 28 septembre 2026 : nouvelle adresse d’autorisation (v2) et nouvelles API de mesure et de contrat ; les anciennes API v5 doivent être arrêtées environ deux semaines plus tard. Information issue d’un projet open source : **à confirmer dans la documentation officielle Enedis** avant tout développement."},{type:"texte",titre:"Gaz : accès aux données GRDF",paragraphes:["GRDF met à disposition les données par l’API {{adict}} : consommations quotidiennes, mensuelles et semestrielles, données techniques du compteur et données contractuelles, avec le consentement du client. Le compteur {{gazpar}} transmet chaque jour : la consommation d’un jour J est disponible le lendemain environ.","Le compteur mesure un **volume** (m³). La consommation en énergie s’obtient avec le {{coef-conversion}} : **kWh = m³ × coefficient**. Ce coefficient combine le {{pcs}} du gaz livré et une correction liée aux conditions de livraison (altitude, pression, température). Il vaut en général entre 10 et 11,5 kWh/m³ et change selon la commune et le mois."]},{type:"demo",id:"casIndex",titre:"Calcule la consommation à partir des index",consigne:"Quatre cas réels de relevés. Tape ta réponse en kWh ou en m³ : le calcul naïf et le bon calcul s’affichent ensuite."},{type:"demo",id:"anatomieFacture",titre:"Anatomie d’une facture",consigne:"Clique sur chaque ligne de la facture pour savoir ce qu’elle paie, à qui va l’argent, et ce qui se passe si l’école consomme 10 % de moins."},{type:"encadre",ton:"verifier",titre:"Taux relevés en septembre 2026",texte:["Accise sur l’électricité : 26,35 €/MWh pour les activités économiques au 1er août 2026 (catégorie exacte de l’école à vérifier). Accise sur le gaz naturel : 16,66 €/MWh au 1er août 2026.","CTA : 15 % de la part fixe du TURPE depuis le 1er février 2026 (21,93 % avant) ; 20,80 % de la part fixe de l’acheminement gaz. TVA : 20 % sur tous les postes. TURPE 7 : +3,04 % en moyenne au 1er août 2026.","Les prix de fourniture et d’acheminement de l’école restent **fictifs**."]},{type:"tableau",titre:"Les trois sources comparées",entetes:["","Télérelevé","Index","Facture"],lignes:[["Finesse","10 min (élec), 1 jour (gaz)","1 relevé par mois et par cadran","1 montant par période de facturation"],["Délai","Le lendemain","Quelques jours","2 à 6 semaines"],["Unité","kW (puissance moyenne), m³ et kWh","kWh (élec), m³ (gaz)","kWh et €"],["Fiabilité","Trous et doublons possibles","Référence du comptage, parfois estimé","Référence financière, parfois estimée puis régularisée"],["Pièges","Changement d’heure, unités (W ou kW)","{{bouclage}}, changement de compteur, index qui recule","Périodes décalées, {{regularisation}}"],["Usage","Analyser","Contrôler","Chiffrer le coût"]]},{type:"encadre",ton:"info",titre:"RGPD",texte:"La courbe de charge d’un **logement** révèle la vie de ses occupants (heures de lever, absences) : c’est une donnée personnelle, d’où le consentement explicite et limité dans le temps. Pour un bâtiment tertiaire comme l’école, l’enjeu personnel est plus faible, mais l’accès reste encadré par le consentement du titulaire."},{type:"encadre",ton:"qa",texte:"Cas utiles : consentement expiré pendant une collecte, consentement révoqué, PDL hors du périmètre consenti, API qui répond en W au lieu de kW, index gaz en m³ sans coefficient, facture estimée suivie d’une régularisation négative."},ua]},quiz:[{q:"Qui fournit la courbe de charge de l’école ?",choix:["Le fournisseur qui envoie la facture","Le distributeur (Enedis)","La mairie"],bonne:1,explication:"La mesure vient du gestionnaire de réseau de distribution, qui pose et relève les compteurs. Le fournisseur facture."},{q:"Le logiciel appelle l’API de mesure pour un PDL sans consentement. Que doit-il se passer ?",choix:["L’API renvoie les données, le consentement est une formalité","L’API refuse l’accès","L’API renvoie des données estimées"],bonne:1,explication:"Sans consentement valide du titulaire, pour ce point et à cette date, le tiers n’a pas accès aux données."},{q:"Index au 1er mars : 99 850 m³. Index au 1er avril : 00 420 m³ (compteur à 5 chiffres). Consommation ?",choix:["−99 430 m³","570 m³","420 m³"],bonne:1,explication:"Le compteur a bouclé : (100 000 − 99 850) + 420 = 570 m³."},{q:"En janvier, l’école consomme 4 000 m³ de gaz avec un coefficient de 11,2 kWh/m³. Combien de kWh ?",choix:["357 kWh","4 000 kWh","44 800 kWh"],bonne:2,explication:"kWh = m³ × coefficient = 4 000 × 11,2 = 44 800 kWh."},{q:"L’école consomme 10 % d’électricité en moins. Quelle ligne de la facture ne baisse pas ?",choix:["La fourniture","L’accise","L’abonnement"],bonne:2,explication:"L’abonnement (et la part fixe de l’acheminement, donc la CTA) ne dépend pas des kWh consommés."},{q:"La somme de la courbe de charge de janvier ne correspond pas à la facture « janvier ». Première chose à vérifier ?",choix:["Que les deux couvrent bien la même période","Que le compteur n’est pas en panne","Que la facture n’est pas une erreur"],bonne:0,explication:"La période de facturation de l’école va du 14 au 13 : elle ne coïncide pas avec le mois civil. On aligne les périodes avant de comparer."}]},3:{niveaux:{comprendre:[{type:"demo",id:"changementHeure",titre:"Le jour du changement d’heure",consigne:"Choisis le passage à l’heure d’été ou d’hiver : compare l’heure locale et l’heure UTC, et l’énergie de la journée."},{type:"exemple",titre:"Un index qui recule",intro:"Relevés du poste HPB (heures pleines, saison basse) du compteur électrique, avec l’anomalie « index qui recule » activée.",etapes:[{t:"Relevé du 1er mars : **413 989 kWh**. Relevé du 1er avril : **404 989 kWh**."},{t:"Calcul naïf de la consommation de mars :",calc:"404 989 − 413 989 = −9 000 kWh"},{t:"Une consommation négative est impossible pour un compteur de consommation. On cherche la cause : bouclage ? Non, le compteur est loin de son maximum. Changement de compteur ? Aucun n’est déclaré. Il reste l’erreur de saisie : 413 → 404, deux chiffres inversés."},{t:"On rejette le relevé, on le signale, et on l’estime en attendant le suivant. Indice supplémentaire : en mars (saison haute), le poste HPB ne tourne pas, donc son index aurait dû rester à 413 989. Le relevé du 1er mai (418 534 kWh) confirme la hausse normale d’avril.",calc:"418 534 − 413 989 = 4 545 kWh en avril"}],conclusion:"Règle de contrôle : un index doit toujours croître. Tout recul déclenche une vérification (saisie, bouclage, changement de compteur)."},{type:"demo",id:"ecartSources",titre:"Écart entre la courbe et l’index : quel seuil ?",consigne:"Active les trous de données, puis règle le seuil de tolérance : à partir de quel écart le logiciel doit-il lever une alerte ?"}],approfondir:[{type:"tableau",titre:"Les règles de contrôle",entetes:["Règle","Question posée","Exemple à l’école"],lignes:[["Complétude","Ai-je toutes les mesures attendues ?","144 points par jour au pas de 10 min (138 ou 150 les jours de changement d’heure, en heure locale)"],["Unicité","Chaque pas de temps a-t-il une seule mesure ?","Le 2 décembre, 10 h à 11 h arrive deux fois"],["Plausibilité","La valeur est-elle physiquement possible ?","999,9 kW pour un raccordement de 60 kVA : rejeté"],["Continuité","Les index croissent-ils ?","HPB passe de 413 989 à 404 989 : rejeté"],["Cohérence","Les sources concordent-elles ?","Somme de la courbe ≈ différence d’index, à la tolérance près"],["Fraîcheur","La donnée est-elle arrivée à temps ?","Aucune donnée Gazpar depuis 3 jours : alerte de collecte"]]},{type:"texte",titre:"Puissance, énergie et unités",paragraphes:["Une courbe de charge contient des **puissances moyennes** (kW) sur chaque pas. Pour obtenir de l’énergie (kWh), on multiplie par la durée du pas en heures. Additionner des kW sans tenir compte du pas est l’erreur la plus fréquente.","Autres pièges : une API qui renvoie des **W** au lieu de kW (facteur 1 000), du gaz en **m³** comparé à des kWh, des **kVA** (puissance apparente) comparés à des kW."]},{type:"exemple",titre:"De la puissance à l’énergie",etapes:[{t:"Mesure de 10 h 00 à 10 h 10 : puissance moyenne **24 kW**."},{t:"Durée du pas en heures :",calc:"10 min = 10 / 60 = 0,1667 h"},{t:"Énergie consommée pendant ce pas :",calc:"24 kW × 0,1667 h = 4 kWh"},{t:"Pour une journée : somme des 144 puissances, divisée par 6.",calc:"E (kWh) = Σ P (kW) × 1/6"}],conclusion:"Additionner les 144 valeurs sans diviser par 6 donnerait une énergie 6 fois trop grande."},{type:"demo",id:"horodatage",titre:"Début ou fin de période ?",consigne:"La même mesure peut être étiquetée par le début ou par la fin de son pas. Bascule la convention et regarde ce qui arrive au dernier pas de la journée."},{type:"tableau",titre:"Le statut d’une donnée",entetes:["Statut","Sens","Exemple"],lignes:[["Brute","Telle que reçue, jamais modifiée","Les 144 valeurs livrées par l’API"],["Validée","A passé tous les contrôles","Une journée complète et plausible"],["Corrigée","Modifiée par une règle documentée","Doublons retirés le 2 décembre"],["Estimée","Calculée faute de mesure","Le trou du 18 novembre rempli par un profil type"],["Rejetée","Écartée des calculs, conservée pour trace","Le pic à 999,9 kW"]],note:"On garde toujours la donnée brute : une correction doit pouvoir être expliquée et annulée."},{type:"encadre",ton:"qa",texte:"Cas utiles : jours de 23 h et de 25 h, fuseau UTC ou local, horodatage de début ou de fin, doublons exacts et doublons de valeurs différentes, valeur 0 en journée, valeur négative, W au lieu de kW, trou d’une journée entière, index qui recule, donnée qui arrive en retard puis corrige une estimation."}]},quiz:[{q:"Au pas de 10 min, combien de mesures compte la journée du 29 mars 2026 en heure locale ?",choix:["144","138","150"],bonne:1,explication:"Passage à l’heure d’été : la journée dure 23 h, soit 23 × 6 = 138 mesures. Ce n’est pas un trou."},{q:"Une mesure indique 24 kW pendant 10 minutes. Quelle énergie ?",choix:["24 kWh","4 kWh","240 kWh"],bonne:1,explication:"24 kW × 10/60 h = 4 kWh."},{q:"Tu reçois 22 500 pour une puissance d’école à midi. Le plus probable ?",choix:["L’école consomme 22 500 kW","La valeur est en W : 22,5 kW","C’est un doublon"],bonne:1,explication:"Pour un raccordement de 60 kVA, 22 500 kW est impossible ; 22 500 W = 22,5 kW est plausible. Toujours vérifier l’unité."},{q:"Tu corriges un pic aberrant. Que fais-tu de la valeur brute ?",choix:["Tu l’écrases avec la valeur corrigée","Tu la conserves avec le statut « rejetée »","Tu la supprimes"],bonne:1,explication:"On garde la donnée brute et son statut : la correction doit rester traçable et réversible."},{q:"Pourquoi stocker les horodatages en UTC ?",choix:["Parce que c’est plus court","Pour que chaque mesure ait un horodatage unique, même les jours de changement d’heure","Parce qu’Enedis l’impose"],bonne:1,explication:"En heure locale, 2 h 00 à 2 h 50 existe deux fois le jour du passage à l’heure d’hiver. En UTC, jamais."}]},4:{niveaux:{comprendre:[{type:"exemple",titre:"144 points deviennent une journée",intro:"Le lundi 12 janvier 2026, le compteur électrique de l’école a envoyé 144 puissances moyennes.",etapes:[{t:"On additionne les 144 puissances (en kW) :",calc:"Σ P = 2 503,5 kW"},{t:"Chaque pas dure 1/6 d’heure, donc :",calc:"E = 2 503,5 × 1/6 = 417 kWh"},{t:"Le même jour, le compteur gaz indique 229,1 m³, avec un coefficient de 11,21 kWh/m³ :",calc:"229,1 × 11,21 = 2 568 kWh"},{t:"Les deux énergies sont maintenant dans la même unité et peuvent s’additionner :",calc:"417 + 2 568 = 2 985 kWh pour le site ce jour-là"}],conclusion:"Agréger, c’est additionner des énergies dans la même unité. Jamais des kW, jamais des m³ avec des kWh."},{type:"demo",id:"agregationSite",titre:"Agrège les compteurs du site",consigne:"Coche les compteurs à additionner pour obtenir la consommation du site. Attention au sous-compteur de la cuisine."},{type:"encadre",ton:"attention",titre:"Le piège du sous-compteur",texte:"Un sous-compteur mesure une partie de ce que mesure déjà le compteur principal. L’additionner au principal compte deux fois la même énergie. Dans le modèle de données, il faut savoir qui est « parent » de qui."}],approfondir:[{type:"schema",id:"modele",legende:"Modèle de données simplifié : un site regroupe des points de comptage, qui portent des compteurs successifs, qui produisent des mesures."},{type:"tableau",titre:"Les objets du modèle",entetes:["Objet","Champs utiles","Remarque"],lignes:[["Site","nom, adresse, surface, activité","La surface sert aux ratios kWh/m² et au décret tertiaire"],["Point de comptage","identifiant (PDL / PCE), énergie, site(s), dates de validité","Stable dans le temps, même si le compteur change"],["Compteur","numéro de série, date de pose, date de dépose, nombre de chiffres","Plusieurs compteurs successifs pour un même point"],["Contrat","puissance souscrite, option tarifaire, fournisseur, dates","Versionné : un changement de puissance crée une nouvelle version"],["Mesure","horodatage (UTC), pas, valeur, unité, statut, source","Jamais écrasée : on ajoute une version corrigée"],["Facture","période (début, fin), lignes, montants, statut (estimée, réelle)","À rattacher au calendrier (voir la démo ci-dessous)"]]},{type:"texte",titre:"Gérer l’historique",paragraphes:["Tout ce qui change dans le temps porte des **dates de validité** : le compteur (pose, dépose), le contrat (puissance souscrite), la surface (extension), le rattachement site ↔ point de comptage. Ainsi, on peut recalculer correctement une année passée.","Les conversions d’unités sont faites au même endroit, avec la valeur en vigueur à la date de la mesure : le coefficient de conversion du gaz de janvier ne s’applique pas en juillet."]},{type:"demo",id:"rattachement",titre:"Rattacher une facture au calendrier",consigne:"La facture couvre du 14 janvier au 13 février. Choisis une méthode pour répartir ses kWh entre janvier et février, et compare avec la réalité."},{type:"tableau",titre:"Quelle granularité pour quel usage ?",entetes:["Pas","Points par an","Sert à"],lignes:[["10 min","52 560","Pointes de puissance, dépassements, talon précis"],["30 min / 1 h","17 520 / 8 760","Profils journaliers, comparaison de journées"],["1 jour","365","Lien avec la météo (DJU), détection de dérives"],["1 mois","12","Budget, comparaison aux factures, reporting"],["1 an","1","Décret tertiaire, bilans, classement des sites"]]},{type:"encadre",ton:"qa",texte:"Cas utiles : agrégation avec un sous-compteur, site dont un compteur démarre en cours d’année, coefficient de conversion manquant pour un mois, facture à cheval sur deux années, changement de puissance souscrite en milieu de mois, somme de puissances au lieu d’énergies."}]},quiz:[{q:"Pour obtenir la consommation d’une journée à partir de 144 puissances au pas de 10 min, on…",choix:["fait la moyenne des 144 valeurs","additionne les 144 valeurs et divise par 6","additionne les 144 valeurs"],bonne:1,explication:"Chaque valeur × 1/6 h donne des kWh : E = Σ P / 6."},{q:"Le site a un compteur principal (80 MWh) et un sous-compteur cuisine (10 MWh). Consommation du site ?",choix:["90 MWh","80 MWh","70 MWh"],bonne:1,explication:"La cuisine est déjà incluse dans le compteur principal. On n’additionne pas un sous-compteur à son parent."},{q:"Passer du pas 10 min au pas journalier…",choix:["réduit l’énergie totale","conserve l’énergie totale mais cache les pointes","augmente la précision"],bonne:1,explication:"L’agrégation conserve l’énergie. Mais la puissance maximale visible baisse, ce qui compte pour la puissance souscrite."},{q:"Une facture couvre du 14 janvier au 13 février. Pour le bilan de janvier, la méthode la plus juste est…",choix:["compter toute la facture en janvier","répartir selon la courbe de charge réelle","compter toute la facture en février"],bonne:1,explication:"La courbe (ou les index quotidiens) dit quelle part a vraiment été consommée en janvier. Le prorata au nombre de jours est une approximation."},{q:"Le compteur gaz est remplacé le 15 janvier. Dans le modèle, on…",choix:["crée un nouveau point de comptage","ajoute un nouveau compteur au même point de comptage, avec ses dates","écrase l’ancien compteur"],bonne:1,explication:"Le PCE reste le même ; on garde l’historique des compteurs successifs avec leurs dates de pose et de dépose."}]}},da={type:"sources",date:"septembre 2026",liens:[{t:"Veolia : décret tertiaire 2026, obligations et OPERAT",url:"https://www.industries.veolia.com/fr/expertises/energie-travaux-defficacite/reglementations/decret-tertiaire-2026-obligations-operat"},{t:"Hellio : quelle année de référence pour le décret tertiaire ?",url:"https://www.hellio.com/actualites/reglementation/annee-reference-decret-tertiaire"},{t:"Lowit : guide de la déclaration OPERAT 2026",url:"https://www.lowit.fr/guide-declaration-operat-2026/"},{t:"Ministère de la Transition écologique : la norme NF ISO 50001",url:"https://www.ecologie.gouv.fr/politiques-publiques/lamelioration-performance-energetique-norme-nf-iso-50001"},{t:"EN ISO 50001:2018/A1:2024 (amendement changement climatique)",url:"https://standards.iteh.ai/catalog/standards/cen/a1b0e0ec-f97c-4aba-8284-9e4600ca9b96/en-iso-50001-2018-a1-2024"},{t:"Selectra : émissions de CO2 par source d’énergie (Base Empreinte ADEME)",url:"https://climate.selectra.com/fr/empreinte-carbone/energie"}]},xt={5:{niveaux:{comprendre:[{type:"demo",id:"profils",titre:"Journée type, semaine type, saisons",consigne:"Bascule entre les trois vues : chaque profil raconte une partie de la vie de l’école."},{type:"demo",id:"signature",titre:"La signature énergétique du chauffage",consigne:"Chaque point est une journée. Bouge la température pour voir la consommation de gaz attendue."},{type:"demo",id:"puissance",titre:"Régler la puissance souscrite",consigne:"Déplace la puissance souscrite : trop haut, on paie pour rien ; trop bas, on paie des pénalités."},{type:"exemple",titre:"Les ratios de l’école",etapes:[{t:"Électricité sur l’année scolaire : **86 000 kWh**, pour 2 000 m² et 250 élèves.",calc:"86 000 / 2 000 = 43 kWh/m²    86 000 / 250 = 344 kWh/élève"},{t:"Gaz : **208 000 kWh**.",calc:"208 000 / 2 000 = 104 kWh/m²    208 000 / 250 = 832 kWh/élève"},{t:"Tous usages :",calc:"(86 000 + 208 000) / 2 000 = 147 kWh/m²"}],conclusion:"Les ratios rendent les bâtiments comparables. Mais une école ouverte le soir ou le mercredi après-midi ne se compare pas à une école fermée : un ratio se lit toujours avec son contexte."}],approfondir:[{type:"texte",titre:"Consommation de base et consommation variable",paragraphes:["La signature énergétique s’écrit **E = a + b × DJU**. **a** est la consommation de base, qui ne dépend pas de la météo (cuisine, eau chaude : environ 83 kWh un jour de classe). **b** est la {{thermosensibilite}}, en kWh par DJU (environ 134 kWh/DJU un jour de classe).","Si **a** augmente, un usage permanent a dérivé. Si **b** augmente, le bâtiment chauffe moins bien (réglage, isolation, chaudière). Si les points s’éparpillent (R² faible), le chauffage n’est pas piloté par la météo : horaires, fenêtres ouvertes, régulation défaillante."]},{type:"exemple",titre:"Corriger du climat (normalisation)",intro:"On veut comparer deux hivers qui n’ont pas eu la même rigueur : c’est la {{normalisation-climatique}}.",etapes:[{t:"Année de référence : **2 244 DJU**. Une année plus douce : **1 900 DJU**, avec 150 000 kWh de chauffage mesurés."},{t:"On ramène la consommation aux DJU de la référence :",calc:"150 000 × 2 244 / 1 900 = 177 158 kWh"},{t:"C’est cette valeur « corrigée du climat » qu’on compare aux 196 000 kWh de chauffage de l’année de référence.",calc:"177 158 / 196 157 − 1 = −9,7 %"}],conclusion:"Sans correction, on aurait cru à −23,5 %. On ne corrige que la part qui dépend de la météo (le chauffage), pas la cuisine."},{type:"encadre",ton:"info",titre:"Les DJU en pratique",texte:["Le seuil de 18 °C est une convention : en dessous, on considère qu’il faut chauffer. La température moyenne du jour se calcule souvent comme la moyenne du minimum et du maximum (méthode dite « météo ») ; d’autres méthodes existent, comme celle du COSTIC.","Les DJU viennent d’une station météo proche (Météo-France ou fournisseurs de données). Le décret tertiaire prévoit lui aussi un ajustement climatique des consommations."]},{type:"tableau",titre:"Les ratios les plus courants",entetes:["Ratio","École Jean-Jaurès","Utile pour"],lignes:[["kWh/m²/an","43 (élec), 104 (gaz), 147 (total)","Comparer des bâtiments, décret tertiaire"],["kWh/élève/an","344 (élec), 832 (gaz)","Comparer des écoles de tailles différentes"],["kWh/DJU","≈ 87 (tous jours confondus)","Suivre l’efficacité du chauffage"],["Talon / puissance max.","≈ 6 kW / 57 kVA","Repérer les usages permanents, régler la puissance"],["Part hors occupation","plus de la moitié de l’électricité","Chiffrer le potentiel de sobriété"]]},{type:"encadre",ton:"qa",texte:"Cas utiles : régression avec moins de 10 points, journées à 0 DJU, jours de vacances mélangés aux jours de classe, surface modifiée en cours d’année, ratio par élève avec un effectif nul, puissance en kW affichée comme des kVA."}]},quiz:[{q:"Un jour à 8 °C de moyenne compte combien de DJU (base 18 °C) ?",choix:["8","10","26"],bonne:1,explication:"18 − 8 = 10 DJU."},{q:"Dans E = a + b × DJU, que représente b ?",choix:["La consommation de base","Les kWh supplémentaires par degré-jour de froid","Le coût du kWh"],bonne:1,explication:"b est la pente : la sensibilité au froid, en kWh/DJU."},{q:"La pointe annuelle de l’école est 57 kVA et elle a souscrit 100 kVA. C’est…",choix:["un dépassement","une sur-souscription","le réglage idéal"],bonne:1,explication:"Elle paie 43 kVA de puissance qu’elle n’utilise jamais."},{q:"L’école consomme plus de la moitié de son électricité quand elle est…",choix:["pleine, à midi","vide (nuits, week-ends, vacances)","en réunion de parents"],bonne:1,explication:"Le talon tourne 24 h/24, et l’école est vide plus de 80 % des heures de l’année."},{q:"Pour comparer deux écoles de tailles différentes, on utilise plutôt…",choix:["les kWh totaux","un ratio (kWh/m² ou kWh/élève)","le montant de la facture"],bonne:1,explication:"Le ratio neutralise l’effet de taille. Le contexte (horaires, usages) reste à prendre en compte."}]},6:{niveaux:{comprendre:[{type:"exemple",titre:"Un talon qui monte de 3 kW",intro:"Un serveur ou un chauffe-eau reste allumé en permanence : +3 kW dès que l’école est vide.",etapes:[{t:"Heures « bâtiment vide » sur une année (nuits, week-ends, vacances) : environ **7 240 h**."},{t:"Énergie gaspillée :",calc:"3 kW × 7 240 h = 21 720 kWh ≈ 21,7 MWh"},{t:"Coût, au prix du kWh évité (≈ 0,186 € HT) :",calc:"21 720 × 0,186 ≈ 4 040 € HT par an"},{t:"Part de la consommation électrique de l’école :",calc:"21 720 / 86 000 ≈ 25 %"}],conclusion:"Un petit écart de puissance, invisible à midi, devient énorme sur l’année. D’où l’intérêt d’analyser les nuits et les week-ends."},{type:"demo",id:"seuilDetection",titre:"Règle ton alerte",consigne:"Choisis une référence, un seuil et une persistance. Objectif : repérer la dérive du 12 janvier en moins d’une semaine, sans fausse alerte."}],approfondir:[{type:"tableau",titre:"Quelle référence (baseline) ?",entetes:["Référence","Principe","Limite"],lignes:[["Même période l’an passé","Janvier 2026 comparé à janvier 2025","Météo et calendrier différents"],["Moyenne par type de jour","Un mardi de classe comparé aux mardis de classe","Ignore la saison (éclairage, chauffage)"],["Référence glissante","Moyenne des 4 dernières semaines","Apprend la dérive et finit par la cacher"],["Modèle","Régression sur DJU, occupation, calendrier","Demande un historique propre"]]},{type:"tableau",titre:"Types d’alertes",entetes:["Type","Exemple à l’école","Donnée nécessaire"],lignes:[["Seuil fixe","Plus de 12 kW entre 22 h et 5 h","Courbe de charge"],["Écart relatif","Plus de 10 % au-dessus de la référence, 2 jours de suite","Consommation journalière"],["Écart au modèle","Gaz au-dessus de la signature énergétique","Gaz journalier et DJU"],["Règle métier","Chaudière qui consomme un samedi de juillet","Gaz journalier et calendrier"],["Puissance","Pointe au-dessus de 95 % de la puissance souscrite","Courbe au pas fin"]]},{type:"texte",titre:"Faux positifs, faux négatifs",paragraphes:["Un {{faux-positif|faux positif}} est une alerte sans vrai problème : trop nombreux, ils font ignorer toutes les alertes. Un **faux négatif** est un vrai problème sans alerte : le gaspillage continue. Baisser le seuil réduit les faux négatifs mais augmente les faux positifs ; la persistance (plusieurs jours de suite) filtre les écarts ponctuels.","La détection dépend de la qualité des données (étape 3) : un doublon ressemble à une surconsommation, un trou à une économie, un pic aberrant à une alerte. On détecte sur des données fiabilisées, et on estime le surcoût en kWh puis en euros."]},{type:"encadre",ton:"qa",texte:"Cas utiles : alerte sur une journée avec trous, jour férié comparé à un jour de classe, changement d’heure, référence absente (nouveau site), seuil à 0 %, dérive qui commence un jour de vacances, alerte qui se déclenche puis s’éteint toute seule."}]},quiz:[{q:"Le talon de l’école passe de 6 à 9 kW toute l’année. Ordre de grandeur du gaspillage ?",choix:["Environ 200 kWh","Environ 20 000 kWh","Environ 2 000 000 kWh"],bonne:1,explication:"3 kW × environ 7 000 h d’inoccupation ≈ 21 000 kWh."},{q:"Une alerte se déclenche le 20 janvier à cause d’une valeur de 999,9 kW. C’est…",choix:["un vrai positif","un faux positif dû à la qualité des données","un faux négatif"],bonne:1,explication:"La consommation réelle n’a pas bougé : c’est la mesure qui est fausse. D’où l’étape Fiabiliser avant Détecter."},{q:"Pourquoi une référence glissante peut-elle masquer une dérive ?",choix:["Parce qu’elle ne tient pas compte des week-ends","Parce qu’après quelques semaines, la dérive fait partie de la référence","Parce qu’elle est calculée en kW"],bonne:1,explication:"La référence « apprend » la nouvelle consommation : l’écart disparaît alors que le gaspillage continue."},{q:"Augmenter la persistance (plusieurs jours d’affilée) permet surtout de…",choix:["détecter plus vite","réduire les fausses alertes ponctuelles","corriger les données"],bonne:1,explication:"Un écart isolé ne déclenche plus d’alerte. En contrepartie, la détection est un peu plus lente."},{q:"La chaudière consomme un samedi de juillet. Quel type d’alerte le repère le mieux ?",choix:["Une règle métier liée au calendrier","Un seuil de puissance électrique","Le montant de la facture annuelle"],bonne:0,explication:"En été et le week-end, la chaudière ne devrait pas tourner : une règle simple suffit."}]},7:{niveaux:{comprendre:[{type:"exemple",titre:"Baisser la consigne d’un degré",intro:"On passe la consigne des classes de 20 °C à 19 °C.",etapes:[{t:"Règle d’ordre de grandeur souvent citée : **1 °C de moins ≈ 7 % de chauffage en moins**."},{t:"Chauffage de l’école sur l’année : **196 000 kWh** de gaz.",calc:"196 157 × 7 % ≈ 13 730 kWh"},{t:"Économie financière, au prix du kWh de gaz évité (≈ 0,089 € HT) :",calc:"13 730 × 0,0887 ≈ 1 220 € HT par an"},{t:"CO2 évité (≈ 0,204 kgCO2e par kWh de gaz facturé) :",calc:"13 730 × 0,204 ≈ 2,8 tCO2e"}],conclusion:"Coût : zéro. Temps de retour : immédiat. C’est pour ça qu’on commence toujours par la sobriété."},{type:"exemple",titre:"Ajuster la puissance souscrite",etapes:[{t:"La pointe de l’école est de **57 kVA** ; elle a souscrit 60 kVA."},{t:"Passer à 58 kVA économise, au tarif fictif de 13,50 €/kVA/an :",calc:"2 × 13,50 = 27 € HT par an"},{t:"Si l’école avait souscrit 80 kVA par prudence, revenir à 60 kVA rapporterait :",calc:"20 × 13,50 = 270 € HT par an"}],conclusion:"Un levier gratuit, mais modeste ici, et risqué si on descend trop près de la pointe. Il agit sur la part fixe de la facture, pas sur les kWh."},{type:"demo",id:"autoconso",titre:"Produire son électricité",consigne:"Choisis la taille de l’installation solaire : observe la production, la part consommée sur place et le temps de retour."}],approfondir:[{type:"tableau",titre:"Sobriété, efficacité, production",entetes:["Levier","Principe","Exemples à l’école","Coût"],lignes:[["{{sobriete|Sobriété}}","Consommer moins en changeant les usages et les réglages","Consigne à 19 °C, réduit la nuit, extinction des veilles","Faible"],["Efficacité","Obtenir le même service avec moins d’énergie","LED, isolation des combles, chaudière à condensation","Moyen à élevé"],["Production","Produire une partie de son énergie","Panneaux photovoltaïques en autoconsommation","Élevé"]],note:"L’ordre compte : isoler un bâtiment qu’on chauffe le week-end, c’est payer des travaux pour chauffer du vide."},{type:"texte",titre:"Autoconsommation",paragraphes:["En {{autoconsommation}} individuelle, l’école consomme directement ce que ses panneaux produisent ; le surplus est injecté sur le réseau et peut être vendu. En **autoconsommation collective**, plusieurs bâtiments proches partagent une production.","Deux taux à ne pas confondre : le **taux d’autoconsommation** (part de la production consommée sur place) et le **taux d’autoproduction** (part des besoins couverts par la production). Une école fermée l’été autoconsomme mal sa production estivale."]},{type:"texte",titre:"Temps de retour et impact sur la facture",paragraphes:["Le {{temps-de-retour}} simple = investissement / économie annuelle. Il ignore la hausse des prix, la durée de vie de l’équipement, la maintenance et les aides (par exemple les certificats d’économies d’énergie) : c’est un premier filtre, pas une étude financière.","Une action sur les **kWh** réduit la fourniture, la part variable de l’acheminement et l’accise. Une action sur la **puissance** réduit la part fixe de l’acheminement (et donc la CTA). L’abonnement fournisseur, lui, ne bouge pas."]},{type:"encadre",ton:"qa",texte:"Cas utiles : actions cumulées (les pourcentages se multiplient, ils ne s’additionnent pas), action avec coût nul (temps de retour immédiat, pas de division par zéro), économie négative, production solaire supérieure à la consommation, action sur la puissance qui ne change pas les kWh."}]},quiz:[{q:"Dans quel ordre recommande-t-on d’agir ?",choix:["Production, efficacité, sobriété","Sobriété, efficacité, production","Efficacité, production, sobriété"],bonne:1,explication:"On réduit d’abord le besoin (souvent gratuit), puis on consomme mieux, puis on produit."},{q:"Deux actions de 10 % chacune sur le chauffage donnent au total…",choix:["20 %","19 %","10 %"],bonne:1,explication:"La seconde s’applique à ce qui reste : 1 − 0,9 × 0,9 = 19 %."},{q:"Un investissement de 30 000 € économise 2 500 € par an. Temps de retour simple ?",choix:["8 ans","12 ans","25 ans"],bonne:1,explication:"30 000 / 2 500 = 12 ans."},{q:"L’école installe beaucoup de panneaux solaires. Pourquoi son taux d’autoconsommation baisse-t-il ?",choix:["Parce que les panneaux produisent moins","Parce que la production estivale tombe pendant les vacances, école fermée","Parce que le réseau refuse le surplus"],bonne:1,explication:"Plus la production est grande, plus une part dépasse la consommation instantanée, surtout l’été."},{q:"Baisser la puissance souscrite réduit surtout…",choix:["la part fixe de l’acheminement","la fourniture","l’accise"],bonne:0,explication:"La puissance souscrite fixe une partie de l’acheminement, indépendante des kWh."}]},8:{niveaux:{comprendre:[{type:"exemple",titre:"Mesure et vérification d’une économie",intro:"L’école a baissé sa consigne et programmé le réduit. L’hiver suivant est plus doux.",etapes:[{t:"Année de référence : **196 157 kWh** de chauffage pour **2 244 DJU**.",calc:"196 157 / 2 244 = 87,4 kWh par DJU"},{t:"Année suivante : **1 900 DJU** et **139 000 kWh** de chauffage mesurés."},{t:"Ce qu’on aurait consommé sans rien faire, avec cette météo :",calc:"87,4 × 1 900 = 166 060 kWh"},{t:"Économie attribuable à l’action :",calc:"166 060 − 139 000 = 27 060 kWh, soit −16,3 %"},{t:"Comparaison brute, sans correction :",calc:"139 000 / 196 157 − 1 = −29,1 %"}],conclusion:"L’action a réellement fait gagner 16 %. Les 13 points restants viennent de la météo : les annoncer comme un succès serait une erreur de mesure."},{type:"demo",id:"indicateurs",titre:"Un bâtiment, quatre indicateurs",consigne:"Change d’indicateur : la part du gaz et de l’électricité change du tout au tout."},{type:"demo",id:"decretTertiaire",titre:"La trajectoire du décret tertiaire",consigne:"Choisis l’année de référence et le rythme de baisse : l’école tient-elle les objectifs 2030, 2040 et 2050 ?"}],approfondir:[{type:"tableau",titre:"Les indicateurs clés",entetes:["Indicateur","École Jean-Jaurès (fictif)","Remarque"],lignes:[["kWh","86 MWh élec + 208 MWh gaz","Énergie finale, celle qu’on paie"],["kWh/m²","147 kWh/m² tous usages","Unité des seuils du décret tertiaire"],["€","≈ 44 000 € TTC par an","Dépend des prix : un indicateur qui bouge sans que la consommation change"],["tCO2e","≈ 4,5 t (élec) + 42 t (gaz)","Facteurs ADEME à vérifier : ≈ 0,052 kg/kWh (élec, mix moyen), ≈ 0,227 kg/kWh PCI (gaz)"]]},{type:"texte",titre:"Le décret tertiaire (dispositif Éco Énergie Tertiaire)",paragraphes:["Il concerne les bâtiments, parties de bâtiments ou ensembles de bâtiments d’un même site accueillant des activités tertiaires sur au moins **1 000 m²** (surfaces cumulées sur le site). L’école, avec 2 000 m², est concernée.","Objectifs de réduction de la consommation d’{{energie-finale|énergie finale}} : **−40 % en 2030, −50 % en 2040, −60 % en 2050**, par rapport à une année de référence ; ou bien atteindre un **seuil en valeur absolue** (kWh/m²/an) fixé par catégorie d’activité. L’année de référence est une période de 12 mois consécutifs entre **2010 et 2022** (la borne haute a été repoussée de 2019 à 2022 en 2024).","Chaque année, les consommations de l’année précédente sont déclarées sur la plateforme {{operat}} de l’ADEME, **avant le 30 septembre**. Les consommations sont ajustées du climat ; des modulations des objectifs sont possibles sur dossier technique (contraintes techniques, architecturales, coût disproportionné). Une attestation annuelle est délivrée ; en cas de manquement, les sanctions prévues vont jusqu’à 7 500 € d’amende pour une personne morale, avec publication."]},{type:"encadre",ton:"verifier",titre:"À revérifier régulièrement",texte:"Seuils en valeur absolue, bornes de l’année de référence, date limite OPERAT, montants des sanctions : ces paramètres ont déjà été modifiés par arrêté. Vérifier sur les textes officiels (Légifrance) et le site OPERAT avant de coder une règle."},{type:"tableau",titre:"ISO 50001 : la boucle du site",entetes:["Phase ISO 50001","Étapes du site","Exemple à l’école"],lignes:[["Planifier (Plan)","1. Cadrer · 2 à 4. Données · 5. Analyser","Revue énergétique, situation de référence, indicateurs ({{ipe}})"],["Faire (Do)","7. Agir","Consigne à 19 °C, programmation du réduit"],["Vérifier (Check)","6. Détecter · 8. Mesurer","Suivi des alertes, M&V corrigée des DJU"],["Agir / améliorer (Act)","8 → 1","Nouveaux objectifs, nouveau périmètre"]],note:"La norme ISO 50001 (version 2018, complétée par un amendement de 2024 sur le changement climatique) ne fixe pas d’objectif chiffré : elle impose une démarche d’amélioration continue et documentée."},{type:"texte",titre:"Mesure et vérification (M&V)",paragraphes:["La {{mv}} compare la consommation mesurée après l’action à ce qu’on aurait consommé sans elle, dans les mêmes conditions (météo, occupation, surface). Le protocole international le plus utilisé est l’{{ipmvp}}. Il demande de fixer à l’avance la période de référence, le modèle d’ajustement et les facteurs pris en compte."]},{type:"encadre",ton:"qa",texte:"Cas utiles : année de référence hors bornes, 12 mois non consécutifs, surface qui change entre la référence et l’année courante, DJU manquants, objectif déjà atteint, consommation en PCS comparée à un facteur CO2 en PCI."},da]},quiz:[{q:"L’hiver a été 15 % plus doux et la consommation de chauffage a baissé de 15 %. L’action a-t-elle marché ?",choix:["Oui, de 15 %","On ne peut pas conclure sans corriger du climat : l’effet réel est proche de 0","Non, elle a augmenté la consommation"],bonne:1,explication:"La météo explique toute la baisse. Corrigée des DJU, la consommation n’a pas bougé."},{q:"À partir de quelle surface tertiaire un site est-il concerné par le décret tertiaire ?",choix:["500 m²","1 000 m²","5 000 m²"],bonne:1,explication:"Au moins 1 000 m² d’activités tertiaires, surfaces cumulées sur le site."},{q:"Objectif du décret tertiaire pour 2030 par rapport à l’année de référence ?",choix:["−20 %","−40 %","−60 %"],bonne:1,explication:"−40 % en 2030, −50 % en 2040, −60 % en 2050 (ou un seuil en valeur absolue)."},{q:"Où déclare-t-on les consommations au titre du décret tertiaire ?",choix:["Sur OPERAT (ADEME)","Sur l’espace client Enedis","Dans la facture du fournisseur"],bonne:0,explication:"La plateforme OPERAT, chaque année avant le 30 septembre pour l’année précédente."},{q:"Pour l’école, quel indicateur fait le plus ressortir le gaz ?",choix:["Les euros","Les tonnes de CO2","Le nombre de compteurs"],bonne:1,explication:"Le gaz émet environ 4 fois plus de CO2 par kWh que l’électricité française."},{q:"Dans ISO 50001, l’étape « Vérifier » correspond surtout à…",choix:["Cadrer","Mesurer et détecter","Agir"],bonne:1,explication:"On contrôle les résultats (M&V, indicateurs, alertes) avant de relancer la boucle."}]}},Le={data:{nom:"Data",icone:"data",description:"Obtenir une donnée juste et bien rangée"},energie:{nom:"Énergie",icone:"energie",description:"Comprendre la consommation et la réduire"}},Q=[{num:1,slug:"cadrer",titre:"Cadrer",famille:"data",aussi:"energie",question:"Qu'est-ce qu'on mesure, où, et pourquoi ?",phrase:"Avant de mesurer quoi que ce soit, on décide quoi suivre, où, et dans quel but.",retenir:["On délimite un **périmètre** : un site, un bâtiment, parfois un usage (chauffage, éclairage…).","Chaque énergie arrive par un {{point-de-comptage}} qui a un identifiant unique : le {{pdl}} pour l’électricité, le {{pce}} pour le gaz.","On fixe un objectif : baisser la facture, respecter le {{decret-tertiaire}}, réduire le CO2…"],analogie:{icone:"stetho",titre:"Préparer un bilan de santé",texte:"Avant les examens, le médecin décide qui il examine, quels examens il prescrit et ce qu'il cherche. Sans ça, on accumule des résultats sans savoir quoi en faire."},schema:"cadrer",legendeSchema:"L'école Jean-Jaurès : un site, deux compteurs, deux identifiants.",demo:{id:"cadrer",titre:"Relie chaque élément à son compteur",consigne:"Glisse chaque étiquette vers le bon compteur. Au clavier : sélectionne une étiquette avec Entrée, puis choisis le compteur."},avenir:{comprendre:["Un site avec plusieurs compteurs : que faire quand un PDL alimente deux bâtiments ?","Exemple chiffré : ce que représente chaque usage dans la consommation de l’école"],approfondir:["Périmètre site / bâtiment / usage","Objectifs : économie, budget, réglementation","Point de comptage, sous-comptage et identifiants","Mini-quiz"]}},{num:2,slug:"collecter",titre:"Collecter",famille:"data",question:"D’où viennent les données et sous quelle forme ?",phrase:"La donnée d’énergie arrive par trois canaux : le télérelevé, les index et les factures. Même énergie, trois formes différentes.",retenir:["Le {{telereleve}} est fin et rapide : une {{courbe-de-charge}} au {{pas-de-temps}} de 10 min pour l’électricité, un volume par jour pour le gaz ({{gazpar}}).","L’{{index}} est le compteur qui tourne : on soustrait deux relevés pour obtenir une consommation.","La facture donne le coût en euros, avec du retard et sur des périodes qui ne suivent pas les mois."],analogie:{icone:"facture",titre:"Trois façons de suivre ton budget",texte:"L’appli bancaire te montre chaque dépense en temps réel (télérelevé). Le relevé de fin de mois donne le solde (index). La facture du magasin dit exactement ce que tu as payé et pourquoi (facture)."},schema:"collecter",legendeSchema:"Trois sources, trois rythmes, un seul logiciel qui les reçoit.",demo:{id:"collecter",titre:"Ouvre les trois robinets de données",consigne:"Choisis une source et un mois : tu vois la donnée brute telle que le logiciel la reçoit."},avenir:{comprendre:["Démo de consentement simulé qui débloque l’accès aux données","Exemple chiffré : une même consommation obtenue par les trois voies"],approfondir:["API Enedis et GRDF, tiers autorisé, RGPD","Multi-cadrans, bouclage, changement de compteur, index estimé","Anatomie complète d’une facture","Comparaison des trois sources","Mini-quiz"]}},{num:3,slug:"fiabiliser",titre:"Fiabiliser",famille:"data",question:"Peut-on faire confiance à ces données ?",phrase:"Avant d’analyser, on vérifie que la donnée est juste : complète, sans doublon, plausible et cohérente entre sources.",retenir:["**Complétude** : une journée au pas de 10 min doit avoir 144 points, sauf les jours de changement d’heure (138 ou 150 en heure locale).","**Plausibilité** : un pic à 999,9 kW dans une école de 60 {{kva}}, c’est un bug de mesure, pas une vraie consommation.","On ne corrige jamais en silence : chaque valeur garde un statut ({{donnee-brute}})."],analogie:{icone:"loupe",titre:"Vérifier le thermomètre",texte:"Si le thermomètre affiche 45 °C, on ne conclut pas à une fièvre mortelle : on vérifie d’abord le thermomètre. Une mauvaise mesure mène à un mauvais diagnostic."},schema:"fiabiliser",legendeSchema:"Les contrôles repèrent le trou et le pic avant toute analyse.",demo:{id:"fiabiliser",titre:"Chasse aux anomalies",consigne:"Choisis une journée piège, regarde ce que disent les contrôles, puis choisis la bonne correction."},avenir:{comprendre:["Exemples chiffrés : jour de 23 h ou de 25 h, index qui recule, écart entre courbe et facture"],approfondir:["Règles de contrôle : complétude, cohérence, plausibilité","Unités, fuseaux (UTC ou heure locale), horodatage début ou fin","Statut de la donnée : brute, corrigée, estimée","Mini-quiz"]}},{num:4,slug:"structurer",titre:"Structurer",famille:"data",question:"Comment organiser les données pour les exploiter ?",phrase:"On range les données dans un modèle commun, à la même unité et au bon pas de temps, pour pouvoir les comparer et les additionner.",retenir:["Un modèle simple : un **site** contient des **compteurs**, qui produisent des **mesures**.","Changer de {{pas-de-temps}} ({{agregation}}) lisse la courbe mais ne change pas l’énergie totale.","Pour comparer le gaz et l’électricité, on convertit les m³ en {{kwh}} avec le {{coef-conversion}}."],analogie:{icone:"tableau",titre:"Ranger une bibliothèque",texte:"Les mêmes livres peuvent être classés par auteur, par thème ou par année. Le classement ne change pas les livres, mais il change ce que tu trouves facilement."},schema:"structurer",legendeSchema:"Site → compteurs → mesures, puis regroupement par pas de temps.",demo:{id:"structurer",titre:"Change le pas de temps",consigne:"Passe de 10 minutes à 1 jour : la courbe se lisse, mais l’énergie de la semaine reste la même."},avenir:{comprendre:["Exemple chiffré : 144 points qui deviennent une journée, m³ qui deviennent kWh","Agréger plusieurs compteurs en un site"],approfondir:["Modèle de données site → compteur → mesure","Historique, conversion d’unités, granularités","Rattacher une période de facture au calendrier","Mini-quiz"]}},{num:5,slug:"analyser",titre:"Analyser",famille:"energie",question:"Comment le bâtiment consomme-t-il ?",phrase:"On lit la consommation pour comprendre quand le bâtiment consomme, combien il consomme à vide, et comment il réagit au froid.",retenir:["Le {{talon}}, c’est ce que le bâtiment consomme quand il est vide. Chez l’école, il pèse lourd dans le total.","Une journée de classe et une journée de vacances n’ont pas du tout le même profil.","Le chauffage suit la météo : on la mesure avec les {{dju}}."],analogie:{icone:"courbe",titre:"Lire un électrocardiogramme",texte:"Le cardiologue regarde le rythme au repos, les pics à l’effort et ce qui sort de l’ordinaire. Une courbe de charge se lit de la même façon."},schema:"analyser",legendeSchema:"Une journée de classe : le talon, la journée, le pic du déjeuner.",demo:{id:"analyser",titre:"Trouve le talon de l’école",consigne:"Choisis une semaine : le talon est calculé la nuit et le week-end, et tu vois sa part dans la consommation."},avenir:{comprendre:["Profils : journée type, semaine type, saison","Signature énergétique : DJU et gaz","Puissance souscrite : sur-souscription ou dépassement"],approfondir:["Ratios kWh/m² et kWh/élève","Consommation de base et variable, normalisation climatique","Mini-quiz"]}},{num:6,slug:"detecter",titre:"Détecter",famille:"energie",question:"Où y a-t-il gaspillage ou dérive ?",phrase:"On compare la consommation réelle à ce qu’elle devrait être, pour repérer gaspillages et dérives et estimer leur coût.",retenir:["Sans {{baseline}}, pas de détection : il faut savoir ce qui est « normal ».","Les dérives classiques : talon qui monte, chauffage le week-end ou l’été, {{depassement}} de puissance.","Une alerte sur une donnée fausse fait perdre du temps : la détection dépend de l’étape Fiabiliser."],analogie:{icone:"alerte",titre:"Le robinet qui goutte",texte:"Une nuit où personne ne tire d’eau, le compteur d’eau devrait être immobile. S’il tourne, il y a une fuite. Un bâtiment vide qui consomme plus que d’habitude, c’est pareil."},schema:"detecter",legendeSchema:"La nuit, le réel reste au-dessus de la référence : c’est une dérive.",demo:{id:"detecter",titre:"Déclenche des dérives",consigne:"Active un ou plusieurs scénarios : le graphique montre l’écart avec la référence et le surcoût estimé."},avenir:{comprendre:["Exemple chiffré : un talon qui augmente de 3 kW toute l’année"],approfondir:["Référence, seuil d’alerte, faux positif","Lien avec la qualité des données","Mini-quiz"]}},{num:7,slug:"agir",titre:"Agir",famille:"energie",question:"Que fait-on concrètement pour consommer mieux ?",phrase:"On passe à l’action, du moins cher au plus lourd : régler, optimiser le contrat, puis investir.",retenir:["**Sobriété** d’abord : régler les horaires, baisser la consigne, éteindre. Coût quasi nul.","Puis le **contrat** : {{puissance-souscrite}} ajustée, bonne option tarifaire.","Enfin l’**efficacité** et la **production** : travaux, équipements, panneaux solaires. Coûteux, rentable sur plusieurs années."],analogie:{icone:"cle",titre:"Réduire les dépenses d’un foyer",texte:"D’abord on éteint les lumières et on baisse le chauffage. Ensuite on renégocie ses abonnements. Enfin, si ça vaut le coup, on isole la maison."},schema:"agir",legendeSchema:"Trois marches : chaque marche coûte plus cher et prend plus de temps.",demo:{id:"agir",titre:"Compose ton plan d’action",consigne:"Coche des actions : tu vois l’économie annuelle, le coût et le temps de retour (valeurs fictives)."},avenir:{comprendre:["Exemple chiffré : baisser la consigne d’un degré","Exemple chiffré : ajuster la puissance souscrite"],approfondir:["Sobriété, efficacité, production","Autoconsommation","Temps de retour, impact sur abonnement et consommation","Mini-quiz"]}},{num:8,slug:"mesurer",titre:"Mesurer",famille:"energie",aussi:"data",question:"L’action a-t-elle marché ? On recommence ?",phrase:"On vérifie que l’action a vraiment marché, à conditions comparables, puis on repart au début de la boucle.",retenir:["Un hiver doux fait baisser la consommation de gaz… sans que personne n’ait rien fait.","On corrige donc la comparaison avec les {{dju}} : c’est le principe de la {{mv}}.","Le résultat alimente le prochain tour de boucle (logique {{iso50001}}) et les déclarations {{operat}}."],analogie:{icone:"boucle",titre:"Se peser en manteau",texte:"Tu te pèses en manteau en janvier et en t-shirt en juillet : tu as « perdu » 3 kg. Pour savoir si le régime a marché, il faut se peser dans les mêmes conditions."},schema:"mesurer",legendeSchema:"On compare à conditions égales, puis on revient à l’étape 1.",demo:{id:"mesurer",titre:"Avant / après : brut ou corrigé ?",consigne:"Bouge la météo de l’hiver suivant et bascule entre « brut » et « corrigé des DJU »."},avenir:{comprendre:["Exemple chiffré de mesure et vérification avec une année de référence corrigée"],approfondir:["Indicateurs : kWh, kWh/m², €, tCO2","Décret tertiaire et OPERAT","ISO 50001 et la boucle d’amélioration continue","Mini-quiz et quiz de synthèse"]}}];for(const e of Q)$t[e.num]&&Object.assign(e,$t[e.num]);for(const e of Q)xt[e.num]&&Object.assign(e,xt[e.num]);const Ft="ems-pedagogie-v1";let Vt={},ft=!0;function pa(){try{const e=localStorage.getItem(Ft);return e?JSON.parse(e):{}}catch{return ft=!1,Vt}}function ma(e){Vt=e;try{localStorage.setItem(Ft,JSON.stringify(e))}catch{ft=!1}}let he={progression:{},filtre:"tout",anomalies:{},derives:{},...pa()};const et=new Set,P={get:()=>he,persistant:()=>ft,set(e){he={...he,...e},ma(he),et.forEach(n=>n(he))},on(e){return et.add(e),()=>et.delete(e)},marquer(e,n){const t=he.progression[e]||{};t[n]||P.set({progression:{...he.progression,[e]:{...t,[n]:!0}}})},estFaite:e=>{const n=he.progression[e]||{};return!!(n.essentiel&&n.demo)},reinitialiser(){P.set({progression:{}})}},ee={puissance:{terme:"Puissance",def:"La vitesse à laquelle un appareil consomme de l'énergie à un instant donné. Elle se mesure en watts (W) ou kilowatts (kW).",ex:"À midi, avec la cuisine et toutes les classes allumées, l’école appelle environ 50 kW.",etapes:[2,5]},energie:{terme:"Énergie",def:"La quantité totale consommée sur une durée. C'est la puissance multipliée par le temps, en kilowattheures (kWh).",ex:"Sur une année scolaire, l’école consomme environ 86 000 kWh d’électricité.",etapes:[2,4]},kw:{terme:"kW",def:"Kilowatt : 1 000 watts. Unité de puissance, comme les km/h pour une voiture.",ex:"Le talon nocturne de l’école est d’environ 6 kW.",etapes:[2,5]},kwh:{terme:"kWh",def:"Kilowattheure : l’énergie consommée par une puissance de 1 kW pendant 1 heure. C’est l’unité qu’on paie, comme les km parcourus.",ex:"Un radiateur de 2 kW allumé 3 heures consomme 6 kWh.",etapes:[2,4]},kva:{terme:"kVA",def:"Kilovoltampère : unité de puissance « apparente », utilisée pour les contrats et le dimensionnement des réseaux. Elle est un peu supérieure à la puissance en kW (kW = kVA × cos φ).",ex:"L’école a souscrit 60 kVA, soit environ 56 kW utilisables.",etapes:[1,5]},"courbe-de-charge":{terme:"Courbe de charge",def:"La suite des puissances moyennes mesurées à intervalle régulier. Elle montre comment la consommation évolue dans la journée.",ex:"Au pas de 10 minutes, la courbe de l’école compte 144 points par jour.",etapes:[2,3,5]},"pas-de-temps":{terme:"Pas de temps",def:"La durée entre deux mesures successives (10 min, 30 min, 1 h, 1 jour…). Plus il est court, plus la donnée est fine.",ex:"Le compteur électrique de l’école mesure au pas de 10 min, le gaz au pas journalier.",etapes:[2,4]},index:{terme:"Index",def:"Le totalisateur du compteur, qui ne fait qu’augmenter. La consommation d’une période est l’index de fin moins l’index de début.",ex:"Index gaz au 1er nov. : 41 940 m³ ; au 1er déc. : 44 867 m³ ; consommation : 2 927 m³.",etapes:[2,3]},cadran:{terme:"Cadran (poste)",def:"Un index séparé pour une plage horaire ou une saison. Un compteur multi-cadrans a plusieurs index ; la consommation totale est leur somme.",ex:"L’école a 4 postes : HPH, HCH, HPB, HCB.",etapes:[2,4]},"hp-hc":{terme:"Heures pleines / creuses",def:"Des plages horaires où le kWh est plus cher (pleines) ou moins cher (creuses). Combinées aux saisons haute (hiver) et basse, elles donnent les postes horosaisonniers.",ex:"Pour l’école (simplifié) : heures pleines de 6 h à 22 h du lundi au samedi, saison haute de novembre à mars.",etapes:[2]},bouclage:{terme:"Bouclage",def:"Quand l’index atteint sa valeur maximale, il repart à zéro, comme le compteur kilométrique d’une vieille voiture. Un calcul naïf donne alors une consommation négative.",ex:"Le compteur gaz a 5 chiffres : après 99 999 m³, il affiche 00 000.",etapes:[2,3]},pdl:{terme:"PDL (ou PRM)",def:"Point De Livraison : l’identifiant à 14 chiffres d’un raccordement électrique chez Enedis. Il est aussi appelé PRM (Point de Référence Mesure).",ex:"PDL fictif de l’école : 30001234567890.",etapes:[1,4]},pce:{terme:"PCE",def:"Point de Comptage et d’Estimation : l’identifiant d’un point de livraison de gaz chez GRDF, en général 14 chiffres.",ex:"PCE fictif de l’école : 21456789012345.",etapes:[1,4]},"point-de-comptage":{terme:"Point de comptage",def:"L’endroit précis où l’énergie est mesurée. Un site peut en avoir plusieurs, et un compteur peut couvrir plusieurs usages.",ex:"L’école a deux points de comptage : un pour l’électricité, un pour le gaz.",etapes:[1]},distributeur:{terme:"Gestionnaire de réseau de distribution",def:"L’entreprise qui gère les câbles ou les tuyaux jusqu’au bâtiment, pose les compteurs et fournit les données de mesure. Il est unique pour une zone donnée.",ex:"Pour l’école : Enedis (électricité) et GRDF (gaz).",etapes:[1,2]},fournisseur:{terme:"Fournisseur",def:"L’entreprise qui vend l’énergie et envoie la facture. On peut en changer sans changer de compteur ni de distributeur.",ex:"L’école reçoit ses factures d’un fournisseur choisi par la mairie, pas d’Enedis.",etapes:[2]},telereleve:{terme:"Télérelevé",def:"Une mesure transmise automatiquement à distance par le compteur, sans passage d’un technicien.",ex:"Le compteur électrique de l’école envoie sa courbe de charge tous les jours.",etapes:[2]},linky:{terme:"Linky",def:"Le compteur électrique communicant d’Enedis pour les raccordements jusqu’à 36 kVA (logements, petits commerces).",ex:"L’école, à 60 kVA, n’a pas de Linky mais un compteur professionnel télérelevé.",etapes:[1,2]},c4:{terme:"Segment C4",def:"Les raccordements électriques en basse tension au-delà de 36 kVA : bâtiments tertiaires moyens, PME. Leurs compteurs sont télérelevés et mesurent une courbe de charge fine.",ex:"L’école est en C4 avec 60 kVA et 4 postes horosaisonniers.",etapes:[1,2]},gazpar:{terme:"Gazpar",def:"Le compteur de gaz communicant de GRDF. Il transmet chaque jour son index, d’où l’on déduit une consommation journalière.",ex:"Le Gazpar de l’école remonte la consommation de la veille chaque matin.",etapes:[1,2]},pcs:{terme:"PCS",def:"Pouvoir Calorifique Supérieur : l’énergie contenue dans un m³ de gaz, en kWh, en comptant la chaleur récupérable de la vapeur d’eau.",ex:"Le gaz livré à l’école contient environ 11,2 kWh par m³.",etapes:[2,4]},"coef-conversion":{terme:"Coefficient de conversion",def:"Le nombre de kWh par m³ appliqué pour convertir le volume de gaz en énergie. Il dépend du PCS et des conditions de livraison (altitude, pression), et varie selon la commune et le mois.",ex:"En janvier, 4 000 m³ × 11,2 = 44 800 kWh.",etapes:[2,4]},consentement:{terme:"Consentement",def:"L’accord du titulaire du contrat qui autorise un tiers à accéder à ses données de consommation, pour une durée et un périmètre donnés.",ex:"La mairie signe un consentement pour que l’EMS récupère la courbe de charge de l’école.",etapes:[2]},"tiers-autorise":{terme:"Tiers autorisé",def:"Une entreprise habilitée à récupérer les données d’un client auprès du distributeur, grâce au consentement de ce client.",ex:"L’éditeur de l’EMS est le tiers autorisé pour les compteurs de l’école.",etapes:[2]},rgpd:{terme:"RGPD",def:"Le règlement européen sur la protection des données personnelles. Une courbe de charge de logement révèle la vie des occupants : c’est une donnée personnelle.",ex:"Les données d’un bâtiment tertiaire comme l’école sont moins sensibles, mais l’accès reste encadré par le consentement.",etapes:[2]},turpe:{terme:"TURPE",def:"Tarif d’Utilisation des Réseaux Publics d’Électricité. Fixé par la CRE, il rémunère les réseaux et apparaît dans la ligne « acheminement ».",ex:"Sur la facture de l’école, le TURPE a une part fixe (liée aux 60 kVA) et une part par kWh.",etapes:[2,7]},accise:{terme:"Accise",def:"Une taxe proportionnelle à la quantité d’énergie consommée (en €/MWh). Elle existe pour l’électricité et pour le gaz naturel, et son taux change régulièrement (à vérifier chaque année).",ex:"Pour l’école, la ligne « accise » est proportionnelle aux kWh du mois.",etapes:[2]},cta:{terme:"CTA",def:"Contribution Tarifaire d’Acheminement : un pourcentage de la part fixe de l’acheminement, qui finance les retraites des agents des industries électriques et gazières.",ex:"Sur la facture de l’école, la CTA ne bouge pas quand la consommation baisse.",etapes:[2]},tva:{terme:"TVA",def:"La taxe sur la valeur ajoutée, appliquée à la fin de la facture. Pour un professionnel, elle est de 20 % sur tous les postes.",ex:"Pour une facture de 1 500 € HT, l’école paie 1 800 € TTC.",etapes:[2]},abonnement:{terme:"Abonnement",def:"La part fixe de la facture, payée même sans rien consommer.",ex:"En août, école fermée, l’abonnement est dû quand même.",etapes:[2,7]},fourniture:{terme:"Fourniture",def:"La part de la facture qui paie l’énergie elle-même, au prix fixé avec le fournisseur, pour chaque kWh consommé.",ex:"En janvier, la fourniture est la plus grosse ligne de la facture de gaz.",etapes:[2]},acheminement:{terme:"Acheminement",def:"La part de la facture qui paie le transport de l’énergie par les réseaux jusqu’au bâtiment (TURPE pour l’électricité, tarifs de distribution et de transport pour le gaz).",ex:"L’acheminement est reversé à Enedis et GRDF via le fournisseur.",etapes:[2]},"facture-estimee":{terme:"Facture estimée",def:"Une facture calculée sur une consommation supposée, faute de relevé réel.",ex:"La facture de gaz de janvier-février de l’école est estimée trop bas de 30 %.",etapes:[2,3]},regularisation:{terme:"Régularisation",def:"La correction, sur une facture suivante, de l’écart entre ce qui a été estimé et ce qui a été réellement consommé.",ex:"La facture de février-mars rattrape les 13 000 kWh sous-estimés.",etapes:[2,3]},horodatage:{terme:"Horodatage",def:"La date et l’heure attachées à une mesure. Il faut savoir si elles désignent le début ou la fin de l’intervalle, et dans quel fuseau.",ex:"La mesure « 10:00 » de l’école couvre 10:00 à 10:10.",etapes:[3]},utc:{terme:"UTC",def:"Le temps universel, sans heure d’été ni d’hiver. La France est à UTC+1 en hiver et UTC+2 en été.",ex:"Stocker en UTC évite les journées de 23 h et 25 h.",etapes:[3]},interpolation:{terme:"Interpolation",def:"Estimer une valeur manquante à partir des valeurs voisines (par exemple une ligne droite entre la dernière valeur avant le trou et la première après).",ex:"Un trou de 30 min la nuit peut être interpolé sans risque ; un trou d’une journée, non.",etapes:[3]},"donnee-brute":{terme:"Donnée brute / corrigée / estimée",def:"Le statut d’une donnée : telle que reçue, modifiée par un contrôle, ou calculée faute de mesure. On garde toujours la trace du statut.",ex:"Le pic à 999,9 kW de l’école est marqué « brute, rejetée ».",etapes:[3]},agregation:{terme:"Agrégation",def:"Regrouper des données fines en données plus grossières : sommer des énergies, ou moyenner des puissances.",ex:"144 points de 10 min deviennent 1 énergie journalière.",etapes:[4]},"sous-compteur":{terme:"Sous-compteur",def:"Un compteur privé placé en aval du compteur principal pour mesurer une partie des usages (une cuisine, un étage). Il ne s’additionne pas au compteur principal.",ex:"Un sous-compteur sur la cuisine de l’école mesurerait environ 2 MWh par an, déjà inclus dans les 86 MWh du compteur principal.",etapes:[1,4]},"data-connect":{terme:"Enedis Data Connect",def:"L’API d’Enedis qui permet à un tiers autorisé de récupérer les données d’un compteur Linky (≤ 36 kVA), avec le consentement du client. Une nouvelle version a été mise en service le 28 septembre 2026 (à vérifier).",ex:"Elle ne s’applique pas à l’école, raccordée en C4 au-delà de 36 kVA.",etapes:[2]},sge:{terme:"SGE (Enedis)",def:"Le système de gestion des échanges d’Enedis : portail et web services qui donnent accès aux données des compteurs, notamment au-delà de 36 kVA, pour des tiers habilités avec le consentement du client.",ex:"C’est par ce canal qu’un EMS récupérerait la courbe au pas de 10 min de l’école.",etapes:[2]},adict:{terme:"GRDF ADICT",def:"L’API de GRDF qui donne accès, avec le consentement du client, aux consommations de gaz (quotidiennes, mensuelles, semestrielles) et aux données du compteur et du contrat.",ex:"L’EMS y récupère chaque jour la consommation Gazpar de la veille.",etapes:[2]},thermosensibilite:{terme:"Thermosensibilité",def:"Le nombre de kWh de chauffage en plus pour chaque degré-jour de froid : la pente de la signature énergétique.",ex:"Environ 134 kWh de gaz par DJU un jour de classe.",etapes:[5]},"normalisation-climatique":{terme:"Correction climatique",def:"Ramener une consommation de chauffage aux DJU d’une année de référence, pour comparer des hivers différents.",ex:"150 000 kWh pour 1 900 DJU valent 177 158 kWh à 2 244 DJU.",etapes:[5,8]},ratio:{terme:"Ratio de consommation",def:"Une consommation divisée par une grandeur de taille ou d’activité (m², élève, repas) pour comparer des bâtiments.",ex:"147 kWh/m² tous usages pour l’école.",etapes:[5]},"seuil-alerte":{terme:"Seuil d’alerte",def:"L’écart à la référence au-delà duquel le logiciel signale une anomalie, parfois avec une durée minimale (persistance).",ex:"Plus de 10 % au-dessus de la référence, deux jours de suite.",etapes:[3,6]},"faux-positif":{terme:"Faux positif / faux négatif",def:"Une alerte sans vrai problème (faux positif), ou un vrai problème sans alerte (faux négatif).",ex:"Le pic à 999,9 kW déclenche une fausse alerte ; un seuil à 40 % laisse passer la dérive de janvier.",etapes:[6]},sobriete:{terme:"Sobriété / efficacité",def:"Sobriété : consommer moins en changeant les usages. Efficacité : obtenir le même service avec moins d’énergie grâce à de meilleurs équipements.",ex:"Baisser la consigne (sobriété) ; passer aux LED (efficacité).",etapes:[7]},autoconsommation:{terme:"Autoconsommation",def:"Consommer sur place l’électricité qu’on produit. Le taux d’autoconsommation est la part de la production consommée sur place ; le surplus part sur le réseau.",ex:"Avec 36 kWc, l’école consomme sur place une partie seulement de sa production d’été.",etapes:[7]},kwc:{terme:"kWc",def:"Kilowatt-crête : la puissance maximale d’une installation solaire dans des conditions standard d’ensoleillement.",ex:"36 kWc produisent environ 38 MWh par an en Île-de-France (ordre de grandeur).",etapes:[7]},"temps-de-retour":{terme:"Temps de retour",def:"Le nombre d’années pour
