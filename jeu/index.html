<div class="qk-app"><div class="qk-top"><button type="button" id="qkBack">←<span class="lg"> Retour au cours</span><span class="sm"> Cours</span></button><span class="qk-top-r"><button type="button" id="qkCourse"><span class="lg">Comprendre cette étape : </span><span class="sm">Cours : </span><b id="qkStep">Le cycle</b></button><button type="button" id="qkPip" aria-pressed="false" title="Détacher le jeu dans une petite fenêtre flottante">⧉<span class="lg"> Vignette</span></button><button type="button" id="qkFs" aria-pressed="false" title="Plein écran (touche F)">⛶<span class="lg"> Plein écran</span></button></span></div>
<div class="console" id="console">
  <div class="hud" role="status">
    <span class="who" id="hudName">—</span>
    <span class="rank" id="hudRank">Gestionnaire de site</span>
    <span class="lvl" id="hudLvl">Nv 1</span>
    <div class="xpbar" title="Expérience"><i id="hudXp"></i></div>
    <div class="badges" id="hudBadges" aria-label="Badges"></div>
    <button id="hudKwh" class="hud-kwh zero" type="button" title="kWh économisés depuis le début de la partie : ouvre le tableau de bord Énergie" hidden></button>
    <button id="sndBtn" type="button" aria-pressed="true">♪ Son</button>
    <span class="saved" id="hudSaved" aria-live="polite"></span>
    <button id="menuBtn" type="button">Menu</button>
  </div>
  <div class="screen-wrap" id="wrap">
    <canvas id="screen" width="240" height="176" aria-label="Écran de jeu"></canvas>
    <div class="scr-btns"><button id="backBtn" class="start-btn" type="button" title="Quitter le jeu et revenir au cours">← Cours</button><button id="pipBtn" class="start-btn" type="button" aria-pressed="false" title="Détacher le jeu dans une petite fenêtre flottante">⧉ Vignette</button><button id="mapBtn" class="start-btn" type="button" title="Carte de la ville : quartiers, arènes, objectif (touche K)">CARTE</button><button id="startBtn" class="start-btn" type="button" title="Menu : objectif, carnet, options (touche M)">MENU</button></div>
    <button id="kwhPill" class="hud-kwh kwh-pill zero" type="button" title="kWh économisés depuis le début de la partie : ouvre le tableau de bord Énergie" hidden></button>
    <div id="objFlash" class="obj-flash" role="status" hidden></div>
  </div>
  <div class="objective" id="objective"><b>Objectif :</b> …</div>
  <div class="keys">Flèches ou ZQSD/WASD pour marcher · Espace ou Entrée pour parler, lire, interagir · Maj (maintenue) ou R pour courir · Échap ou M pour le menu · F pour le plein écran</div>
  <div class="pad" id="pad">
    <div class="dpad">
      <span></span><button data-k="up" aria-label="Haut">▲</button><span></span>
      <button data-k="left" aria-label="Gauche">◀</button><span></span><button data-k="right" aria-label="Droite">▶</button>
      <span></span><button data-k="down" aria-label="Bas">▼</button><span></span>
    </div>
    <div class="ab"><div class="pills"><button class="roll" data-b="roll" aria-label="Roulade avant">Roulade</button><button class="run" data-b="run" aria-pressed="false" aria-label="Courir">Courir</button></div><button class="b" data-b="menu" aria-label="Menu">Menu</button><button class="a" data-b="a" aria-label="Action">A</button></div>
  </div>
</div>
<div id="layer"></div></div>
</template>
<div id="qk-host"></div>

<!-- Affiché dans cet onglet quand le jeu est parti dans la vignette flottante -->
<div id="qk-ailleurs" hidden>

  <p><button type="button" id="qkAilleursCours">Ouvrir le cours ↗</button> <button type="button" id="qkAilleursRetour">↩ Remettre le jeu ici</button></p>
</div>
